<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #fdf8ef;
  --ink-soft: rgba(253, 248, 239, .82);
  --sun-ink: #3b230d;
  --glass: rgba(16, 32, 58, .52);
  --glass-hi: rgba(16, 32, 58, .7);
  --line: rgba(255, 241, 214, .5);
  --qa: #5fe3d6; --art: #ff9a6a; --moss: #cdb0ff; --stage: #ffcf6e;
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --cond: "Barlow Semi Condensed", "Avenir Next Condensed", system-ui, sans-serif;
  --sans: "Inter", system-ui, sans-serif;
}
html { background: #f1c79c; }
body {
  min-height: 100vh; min-height: 100svh;
  color: var(--ink); font: 15px/1.45 var(--sans);
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* Sky: the one painted background, nudged by the pointer. */
.sky {
  position: fixed; inset: -3%;
  background: url(assets/sky.webp) center 40% / cover no-repeat;
  transform: translate3d(var(--px, 0), var(--py, 0), 0) scale(1.02);
  transition: transform .8s cubic-bezier(.2, .7, .2, 1);
  z-index: -2;
}
.sky::after { /* darker top edge so the header always reads */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(10, 24, 48, .45), transparent 22%, transparent 80%, rgba(40, 20, 10, .12));
}

/* Header */
header {
  position: relative; z-index: 3;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
  padding: clamp(18px, 3.2vw, 40px) clamp(16px, 3.6vw, 52px) 0;
}
.brand { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
.brand .spark { width: 30px; height: 30px; grid-row: span 2; color: #fff; filter: drop-shadow(0 0 8px rgba(255, 230, 180, .9)); }
.brand h1 { font: 500 clamp(26px, 2.6vw, 34px)/1 var(--serif); letter-spacing: .005em; }
.brand small { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }

/* The system: a fixed 16:10 board, scaled to fit the window. */
main { display: grid; place-items: center; padding: 8px 12px 28px; }
.system {
  --w: min(1320px, 92vw, calc((100svh - 120px) * 1.6));
  position: relative; width: var(--w); aspect-ratio: 16 / 10;
}
.orbits { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.orbits ellipse, .orbits line { fill: none; stroke: var(--line); stroke-width: .14; }
.orbits .faint { stroke: rgba(255, 241, 214, .28); }
.orbits .dot { fill: #f6dcae; filter: drop-shadow(0 0 .4px rgba(255, 220, 160, .9)); }
.orbits .dot.dim { fill: #9aa4b6; }
.orbits .star { fill: #fff8e8; }

.body {
  position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
  width: calc(var(--d) * 1%); aspect-ratio: 1; translate: -50% -50%;
}
.body img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }

/* Sun = Ivo */
.sun { --x: 50; --y: 50; --d: 41; --disc: 70.5%; --c: #ffe3a6; --f: 12s; }
.sun::before { /* warm halo, cheaper and softer than painting it */
  content: ""; position: absolute; inset: -18%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 214, 140, .75), rgba(255, 196, 120, .28) 55%, transparent);
  z-index: -1; animation: breathe 7s ease-in-out infinite;
}

/* Planets */
.planet { z-index: 2; border-radius: 50%; outline: none; }
.planet .ball { position: relative; width: 100%; height: 100%; animation: float var(--f, 9s) ease-in-out infinite; animation-delay: var(--fd, 0s); }
.planet .ball::after { /* hover ring in the planet's colour */
  content: ""; position: absolute; inset: calc(50% - var(--disc) / 2); border-radius: 50%;
  box-shadow: 0 0 0 1.5px var(--c), 0 0 34px 6px color-mix(in srgb, var(--c) 55%, transparent);
  opacity: 0; transition: opacity .35s, inset .35s;
}
.planet img { transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
.label {
  position: absolute; top: 50%; translate: 0 -50%; width: max-content; max-width: 19em;
  padding: 12px 18px 13px; border-radius: 12px;
  background: var(--glass); border: 1px solid rgba(255, 255, 255, .14);
  -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2);
  transition: opacity .3s, background .3s, border-color .3s, box-shadow .3s, translate .35s;
  opacity: 0; pointer-events: none;
}
.left .label { translate: 10px -50%; }
.right .label { translate: -10px -50%; }
.below .label { top: calc(50% + var(--disc) / 2 + 6px); left: 50%; translate: -50% -8px; }
.planet:hover .label, .planet:focus-visible .label { opacity: 1; translate: 0 -50%; }
.below:hover .label, .below:focus-visible .label { translate: -50% 0; }
/* Touch screens have no hover: keep the cards showing. */
@media (hover: none) { .label { opacity: 1; translate: 0 -50%; } .below .label { translate: -50% 0; } }
.left .label { right: calc(100% - (100% - var(--disc)) / 2 + 18px); }
.right .label { left: calc(100% - (100% - var(--disc)) / 2 + 18px); }
.label strong { display: flex; align-items: center; gap: 10px; font: 600 clamp(19px, 1.9vw, 26px)/1 var(--cond); letter-spacing: .06em; color: var(--c); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 40%, transparent); }
.label strong svg { width: .8em; height: .8em; transition: translate .3s; }
.label span { display: block; margin-top: 6px; font-size: 13.5px; color: var(--ink-soft); }
.label .soon-tag { display: inline-block; margin: 0 0 0 2px; font: 500 10.5px var(--cond); letter-spacing: .16em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; color: var(--stage); vertical-align: 1px; }

a.planet:hover img, a.planet:focus-visible img { transform: scale(1.06); }
.sun:hover img, .sun:focus-visible img { transform: scale(1.03); }
.planet:hover .ball::after, .planet:focus-visible .ball::after { opacity: 1; inset: calc(50% - var(--disc) / 2 - 6px); }
.planet:hover .label, .planet:focus-visible .label { background: var(--glass-hi); border-color: var(--c); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 12px 32px rgba(10, 20, 40, .3); }
a.planet:hover .label strong svg, a.planet:focus-visible .label strong svg { translate: 4px 0; }

.qa { --x: 24.2; --y: 40.1; --d: 13.0; --disc: 96.3%; --c: var(--qa); --f: 9s; }
.art { --x: 68.9; --y: 19.5; --d: 12.4; --disc: 96.5%; --c: var(--art); --f: 10s; --fd: -3s; }
.moss { --x: 18.0; --y: 78.1; --d: 15.6; --disc: 86.5%; --c: var(--moss); --f: 11s; --fd: -6s; }
.stage { --x: 95.1; --y: 69.3; --d: 13.4; --disc: 98.7%; --c: var(--stage); --f: 9.5s; --fd: -2s; }
.stage { cursor: default; }
.stage .label { max-width: 14.5em; }

/* Entrance */
.body, .orbits, header { animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both; }
.orbits { animation-name: fade; animation-duration: 2s; animation-delay: .3s; }
.qa { animation-delay: .25s; } .art { animation-delay: .35s; } .moss { animation-delay: .45s; } .stage { animation-delay: .55s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.96); } }
@keyframes fade { from { opacity: 0; } }
@keyframes float { 50% { transform: translateY(-1.6%); } }
@keyframes breathe { 50% { opacity: .72; transform: scale(1.05); } }

/* Phone and tall windows: a vertical line-up under the sun. */
@media (max-width: 760px), (max-aspect-ratio: 4/5) {
  .sky { inset: 0; transform: none; background-position: 46% 30%; }
  header { padding: 18px 20px 0; }
  main { padding: 6px 20px 40px; overflow-x: clip; }
  .system { --w: 100%; aspect-ratio: auto; width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
  .orbits { display: none; }
  .system::before { /* the line every planet hangs on */
    content: ""; position: absolute; left: 51px; top: calc(min(84vw, 340px) - 4px); bottom: 50px; width: 1px;
    background: linear-gradient(var(--line), rgba(255, 241, 214, .15));
  }
  .body { position: relative; left: auto; top: auto; translate: none; width: auto; aspect-ratio: auto; }
  .sun { width: min(84vw, 340px); aspect-ratio: 1; align-self: center; margin: -10px 0 -30px; }
  .sun.planet { display: flex; flex-direction: column; align-items: center; gap: 0; margin-bottom: 18px; }
  .sun .ball { width: 100%; height: 100%; }
  .label, .below .label { opacity: 1; pointer-events: auto; }
  .planet:not(.sun) { display: grid; grid-template-columns: 102px 1fr; align-items: center; gap: 10px; border-radius: 16px; }
  .planet:not(.sun) .ball { width: 102px; height: 102px; }
  .label, .left .label, .right .label, .below .label { position: static; translate: none !important; width: auto; max-width: none; left: auto; right: auto; min-width: 0; }
  .planet > .label { justify-self: start; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .sky { transform: none; }
  .orbits animateMotion { display: none; }
}
</style>

<script>
  // Gentle parallax: the sky drifts a little against the pointer.
  (function () {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !matchMedia("(pointer: fine)").matches) return;
    var sky = document.querySelector(".sky"), raf = 0;
    addEventListener("pointermove", function (e) {

      raf = requestAnimationFrame(function () {

        sky.style.setProperty("--px", ((e.clientX / innerWidth - .5) * -14).toFixed(1) + "px");

      });
    }, { passive: true });
  })();
</script>
