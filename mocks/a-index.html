<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A · Index</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=VT323&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="_shared.css">
<style>
body { background: #0e0e0d; color: #ece8e1; font: 16px/1.5 var(--sans); padding: clamp(24px, 5vw, 64px); min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
header h1 { font: 400 clamp(44px, 8vw, 96px)/1 var(--serif); letter-spacing: -.02em; }

.num { font: 500 13px var(--mono); color: #6f6b64; }
.name { font-size: clamp(38px, 7vw, 84px); line-height: 1; }
.what { color: #9a958d; text-align: right; font-size: 15px; }
.qa .name { font-family: var(--display); font-weight: 700; color: var(--qa); letter-spacing: -.03em; }
.art .name { font-family: var(--serif); font-style: italic; color: var(--art); }
.moss .name { font-family: var(--crt); color: var(--moss); letter-spacing: .1em; text-shadow: 0 0 14px rgba(156,245,154,.45); }
.stage .name { font-family: var(--display); font-weight: 500; color: var(--stage); letter-spacing: .02em; }
footer { margin-top: 28px; display: flex; justify-content: space-between; color: #6f6b64; font: 13px var(--mono); }
@media (max-width: 640px) { .row { grid-template-columns: 40px 1fr; } .what { grid-column: 2; text-align: left; } }
