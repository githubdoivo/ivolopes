<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ivo Lopes · Ceramics</title>
<meta name="theme-color" content="#efe3d0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/wall.webp">
<style>
  /* Washi paper, ink and watercolour, a lot of quiet space. The jar stays in
     view and changes as the story scrolls past; its white paper is multiplied
     into the wall, so the drawings sit on it like ink, with no cut-out edges. */
  :root {
    --paper: #f1e6d4; --ink: #3b2f27; --ink-soft: #6f6256; --line: rgba(59, 47, 39, .16);
    --seal: #b5442c; --clay: #a8562f;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper); scroll-behavior: smooth; }
  body { color: var(--ink); font: 400 15.5px/1.95 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 1.5px solid var(--seal); outline-offset: 4px; border-radius: 2px; }

  /* ---------- The room ---------- */
  .wall { position: fixed; inset: -2%; z-index: 0; background: url(assets/wall.webp) center / cover no-repeat; animation: breeze 26s ease-in-out infinite alternate; }
  @keyframes breeze { from { transform: translate(0, 0) scale(1); } to { transform: translate(-.6%, .3%) scale(1.012); } }
  .kiln { position: fixed; z-index: 1; pointer-events: none; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(255, 140, 60, .55), rgba(240, 110, 40, .22) 55%, transparent); filter: blur(8px); }
  .jar { position: fixed; z-index: 2; pointer-events: none; mix-blend-mode: multiply; }
  .jar img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; will-change: opacity, filter; }
  .jar img.first { opacity: 1; }
  .label { position: fixed; z-index: 3; writing-mode: vertical-rl; font: 500 11px/1 var(--sans); letter-spacing: .32em; color: var(--ink-soft); white-space: nowrap; transition: opacity .6s; }
  .label b { font-weight: 500; color: var(--seal); margin-bottom: 1.1em; display: inline-block; }

  /* ---------- Top ---------- */
  .top { position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px clamp(20px, 5vw, 64px) 34px; background: linear-gradient(rgba(241, 230, 212, .94) 55%, rgba(241, 230, 212, 0)); }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .seal { width: 30px; height: 30px; flex: none; }
  .brand span { font: 500 15px/1.1 var(--serif); letter-spacing: .04em; }
  .brand small { display: block; font: 400 10px/1.4 var(--sans); letter-spacing: .28em; color: var(--ink-soft); text-transform: lowercase; }
  .top nav { display: flex; gap: 22px; align-items: center; font: 500 12px var(--sans); letter-spacing: .18em; text-transform: lowercase; }
  .top nav a, .top nav button { text-decoration: none; background: none; border: 0; font: inherit; letter-spacing: inherit; color: var(--ink); cursor: pointer; padding: 6px 0; border-bottom: 1px solid transparent; }
  .top nav a:hover, .top nav button:hover { border-bottom-color: var(--ink); }

  /* ---------- The story ---------- */
  main { position: relative; z-index: 4; }
  .sec { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 120px clamp(24px, 9vw, 140px) 120px; max-width: calc(min(470px, 40vw) + clamp(24px, 9vw, 140px) * 2); }
  .sec > * { opacity: 0; transform: translateY(14px); transition: opacity 1.1s ease, transform 1.1s ease; }
  .sec.in > * { opacity: 1; transform: none; }
  .sec.in > :nth-child(2) { transition-delay: .08s; } .sec.in > :nth-child(3) { transition-delay: .16s; } .sec.in > :nth-child(n+4) { transition-delay: .24s; }
  .eyebrow { font: 500 11px/1 var(--sans); letter-spacing: .32em; color: var(--clay); text-transform: lowercase; margin-bottom: 22px; display: flex; align-items: center; gap: 14px; }
  .eyebrow::after { content: ""; width: 36px; height: 1px; background: currentColor; opacity: .5; }
  h1 { font: 500 clamp(48px, 6.4vw, 84px)/1.02 var(--serif); letter-spacing: -.01em; margin-bottom: 20px; }
  h2 { font: 500 clamp(32px, 3.6vw, 46px)/1.15 var(--serif); margin-bottom: 20px; }
  .lead { font: 400 clamp(19px, 1.8vw, 23px)/1.55 var(--serif); color: var(--ink-soft); margin-bottom: 18px; }
  .sec p + p { margin-top: 14px; }
  .sec p { max-width: 34em; }
  .hint { margin-top: 44px; font: 500 11px var(--sans); letter-spacing: .28em; color: var(--ink-soft); text-transform: lowercase; display: flex; align-items: center; gap: 14px; }
  .hint i { width: 1px; height: 46px; background: linear-gradient(var(--ink-soft), transparent); animation: drip 2.4s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  /* Work: a quiet row of pieces on paper. */
  .works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 26px; }
  .piece figure, .piece { margin: 0; }
  .piece .ph { aspect-ratio: 3 / 4; background: #f4ebde; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .piece .ph img { width: 92%; mix-blend-mode: multiply; }
  .piece figcaption { margin-top: 10px; font: 500 14px/1.3 var(--serif); }
  .piece small { display: block; font: 400 11px/1.6 var(--sans); letter-spacing: .08em; color: var(--ink-soft); }

  .order-btn { align-self: flex-start; margin-top: 30px; display: inline-flex; align-items: center; gap: 14px; padding: 16px 28px; background: var(--seal); color: #fbf3e8; text-decoration: none; font: 500 13px var(--sans); letter-spacing: .22em; text-transform: lowercase; transition: background .3s; }
  .order-btn:hover { background: #9a3822; }
  .order-btn span { transition: transform .3s; } .order-btn:hover span { transform: translateX(4px); }
  .mail { margin-top: 26px; font-size: 14px; color: var(--ink-soft); }
  .mail a { color: var(--ink); text-underline-offset: 4px; text-decoration-thickness: 1px; }
  footer { position: relative; z-index: 4; padding: 0 clamp(24px, 9vw, 140px) 40px; font: 400 11px var(--sans); letter-spacing: .2em; color: var(--ink-soft); text-transform: lowercase; }

  /* ---------- Phones: the jar on top, the story underneath ---------- */
  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    .sec { max-width: none; justify-content: flex-end; padding: 52vh 24px 9vh; min-height: 100svh; }
    .sec:first-child { padding-top: 54vh; }
    .sec .card { background: linear-gradient(180deg, rgba(241, 230, 212, 0), rgba(241, 230, 212, .92) 18%, rgba(241, 230, 212, .92)); margin: 0 -24px; padding: 34px 24px 6px; }
    .top { padding: max(16px, env(safe-area-inset-top)) 20px 14px; background: linear-gradient(rgba(241, 230, 212, .85), rgba(241, 230, 212, 0)); }
    .brand small { display: none; }
    .top nav { gap: 16px; }
    .works { gap: 10px; }
    .label { display: none; }
    /* The table is for the desktop scene; on a phone the jar floats on the wall. */
    .wall { background-size: auto 128%; background-position: 32% 0; }
    .sec { min-height: 82svh; padding-top: 46vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .wall, .hint i { animation: none; }
    .sec > * { opacity: 1; transform: none; transition: none; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wall" aria-hidden="true"></div>
<div class="kiln" id="kiln" aria-hidden="true"></div>
<div class="jar" id="jar" aria-hidden="true"></div>
<div class="label" id="label" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#top" aria-label="Ivo Lopes, ceramics">
    <svg class="seal" viewBox="0 0 30 30" aria-hidden="true"><defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
      <g filter="url(#rough)"><rect x="1.5" y="1.5" width="27" height="27" rx="2.5" fill="#b5442c"/><rect x="4" y="4" width="22" height="22" rx="1.5" fill="none" stroke="#f6e9da" stroke-width="1"/>
      <text x="15" y="19.6" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="11.5" font-weight="600" fill="#f6e9da" letter-spacing=".5">IL</text></g></svg>
    <span>Ivo Lopes<small id="tagline">ceramics · porto</small></span>
  </a>
  <nav><a href="#order" id="nav-order">order</a><button type="button" id="lang">pt</button></nav>
</header>

<main id="story"></main>
<footer id="foot"></footer>

<script>
(function () {
  const T = {
    en: {
      lang: "en", other: "pt", title: "Ivo Lopes · Ceramics", tagline: "ceramics · porto", order: "order", hint: "scroll to shape the clay",
      footer: "made by hand, and in code",
      stages: ["a ball of clay", "pinched open", "a small bowl", "coil by coil", "one skin", "bisque", "glazed"],
      sections: [
        { id: "top", stage: 0, eyebrow: "ceramics · porto", h1: "Ivo Lopes", lead: "Earth, water, fire and time.", body: ["Ceramics, built by hand. Scroll, and follow a ball of clay all the way to a finished jar."], hint: true },
        { id: "prepare", stage: 0, eyebrow: "01 · prepare", h: "It starts as a ball", body: ["Clay is wedged first: pressed, folded and turned on the bench until the air is out and it is even all the way through. Then it is rolled into a ball.", "Skip it, and a hidden air pocket can crack the piece in the kiln weeks later."] },
        { id: "pinch", stage: 1, eyebrow: "02 · pinch", h: "Pinch it open", body: ["A thumb goes into the ball. Turning it slowly in the hand, the walls are pinched out between thumb and fingers, a little thinner with every round."] },
        { id: "base", stage: 2, eyebrow: "03 · base", h: "A small bowl", body: ["The pinched form becomes a bowl with an even wall: the base everything else is built on."] },
        { id: "coil", stage: 3, eyebrow: "04 · coil", h: "Coil by coil", body: ["Clay is rolled into long ropes and laid around the rim one coil at a time, each one scored and joined to the last with slip. Placing a coil slightly in or out is how the form starts to curve."] },
        { id: "shape", stage: 4, eyebrow: "05 · shape", h: "One skin", body: ["The coils are blended into one smooth skin with fingers and a wooden rib. No two pieces come out alike, and each keeps a little of the hands that made it."] },
        { id: "fire", stage: 5, eyebrow: "06 · fire", h: "Through the fire", body: ["Bone dry, the piece goes into the kiln for its first firing, the bisque, at around 950°C. Clay turns into ceramic and shrinks a little on the way."] },
        { id: "glaze", stage: 6, eyebrow: "07 · glaze", h: "Glaze, and fire again", body: ["Then glaze, and a second, hotter firing that melts it into glass. Every glaze moves a little differently in the heat, so the kiln has the last word."] },
        { id: "work", stage: 6, eyebrow: "work", h: "A few pieces", body: ["Each one made the same slow way."], works: [["Piece I", "photo coming soon"], ["Piece II", "photo coming soon"], ["Piece III", "photo coming soon"]] },
        { id: "order", stage: 6, eyebrow: "order", h: "Order a piece", body: ["Have something in mind? Send a photo or two of a piece you love, describe what you would like, and you will get a reply by email with a price."], cta: "Order a piece", mail: "Questions, or just to talk clay:" },
      ],
    },
    pt: {
      lang: "pt", other: "en", title: "Ivo Lopes · Cerâmica", tagline: "cerâmica · porto", order: "encomendar", hint: "desliza para moldar o barro",
      footer: "feito à mão, e em código",
      stages: ["uma bola de barro", "aberta à mão", "uma pequena taça", "rolo a rolo", "uma só pele", "chacota", "vidrado"],
      sections: [
        { id: "top", stage: 0, eyebrow: "cerâmica · porto", h1: "Ivo Lopes", lead: "Terra, água, fogo e tempo.", body: ["Cerâmica construída à mão. Desliza e acompanha uma bola de barro até ser um jarro acabado."], hint: true },
        { id: "prepare", stage: 0, eyebrow: "01 · preparar", h: "Começa numa bola", body: ["Primeiro, o barro é amassado: pressionado, dobrado e rodado na bancada até sair o ar e ficar uniforme por dentro. Depois, enrola-se numa bola.", "Sem este passo, uma bolha de ar escondida pode rachar a peça no forno semanas depois."] },
        { id: "pinch", stage: 1, eyebrow: "02 · beliscar", h: "Abrir com o polegar", body: ["Um polegar entra na bola. A rodar devagar na mão, as paredes vão sendo apertadas entre o polegar e os dedos, um pouco mais finas a cada volta."] },
        { id: "base", stage: 2, eyebrow: "03 · base", h: "Uma pequena taça", body: ["A forma beliscada passa a uma taça de parede uniforme: a base onde tudo o resto é construído."] },
        { id: "coil", stage: 3, eyebrow: "04 · rolos", h: "Rolo a rolo", body: ["O barro é enrolado em cordas compridas, assentes à volta do bordo um rolo de cada vez, cada um riscado e colado ao anterior com barbotina. Pôr um rolo um pouco mais para dentro ou para fora é o que começa a curvar a forma."] },
        { id: "shape", stage: 4, eyebrow: "05 · moldar", h: "Uma só pele", body: ["Os rolos são fundidos numa só pele lisa, com os dedos e uma costela de madeira. Não há duas peças iguais, e cada uma guarda um pouco das mãos que a fizeram."] },
        { id: "fire", stage: 5, eyebrow: "06 · cozer", h: "Pelo fogo", body: ["Bem seca, a peça vai ao forno para a primeira cozedura, a chacota, a cerca de 950°C. O barro passa a cerâmica e encolhe um pouco pelo caminho."] },
        { id: "glaze", stage: 6, eyebrow: "07 · vidrar", h: "Vidrar, e voltar ao fogo", body: ["Depois vem o vidrado, e uma segunda cozedura, mais quente, que o derrete em vidro. Cada vidrado corre um pouco à sua maneira no calor, por isso a última palavra é do forno."] },
        { id: "work", stage: 6, eyebrow: "trabalhos", h: "Algumas peças", body: ["Todas feitas da mesma maneira lenta."], works: [["Peça I", "fotografia em breve"], ["Peça II", "fotografia em breve"], ["Peça III", "fotografia em breve"]] },
        { id: "order", stage: 6, eyebrow: "encomendar", h: "Encomendar uma peça", body: ["Tens uma ideia? Envia uma ou duas fotografias de uma peça de que gostes, descreve o que procuras, e recebes uma resposta por email com um orçamento."], cta: "Encomendar uma peça", mail: "Perguntas, ou só para falar de barro:" },
      ],
    },
  };
  const q = new URLSearchParams(location.search);
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  const want = q.get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
  const c = T[want === "pt" ? "pt" : "en"];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.documentElement.lang = c.lang;
  document.title = c.title;
  $("tagline").textContent = c.tagline;
  $("nav-order").textContent = c.order;
  $("lang").textContent = c.other;
  $("lang").setAttribute("aria-label", c.lang === "pt" ? "View in English" : "Ver em português");
  $("lang").addEventListener("click", () => { try { localStorage.setItem("lang", c.other); } catch (_) {} location.search = `?lang=${c.other}`; });
  $("foot").textContent = c.footer;

  /* Story */
  const ORDER_URL = `https://art.ivolopes.com/order/?lang=${c.lang}`;
  $("story").innerHTML = c.sections.map((s) => `
    <section class="sec" id="${s.id}" data-stage="${s.stage}"><div class="card">
      <p class="eyebrow">${esc(s.eyebrow)}</p>
      ${s.h1 ? `<h1>${esc(s.h1)}</h1>` : `<h2>${esc(s.h)}</h2>`}
      ${s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ""}
      ${s.body.map((p) => `<p>${esc(p)}</p>`).join("")}
      ${s.works ? `<div class="works">${s.works.map(([t, n]) => `<figure class="piece"><div class="ph"><img src="assets/stage-7.webp" alt="" loading="lazy"></div><figcaption>${esc(t)}<small>${esc(n)}</small></figcaption></figure>`).join("")}</div>` : ""}
      ${s.cta ? `<a class="order-btn" href="${ORDER_URL}">${esc(s.cta)} <span aria-hidden="true">→</span></a><p class="mail">${esc(s.mail)} <a href="mailto:mail@ivolopes.com">mail@ivolopes.com</a></p>` : ""}
      ${s.hint ? `<p class="hint"><i></i>${esc(c.hint)}</p>` : ""}
    </div></section>`).join("");
  // On wide screens the card wrapper is just a pass-through.
  const wide = () => innerWidth > 900 && innerWidth / innerHeight > 1;
  document.querySelectorAll(".card").forEach((cd) => { cd.style.display = "contents"; });
  function cards() { document.querySelectorAll(".card").forEach((cd) => { cd.style.display = wide() ? "contents" : "block"; }); }
  cards();
  const sections = [...document.querySelectorAll(".sec")];
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: .25 });
  sections.forEach((s) => io.observe(s));
  // Phones: the animation targets are inside .card, so reveal those children too.
  const style = document.createElement("style");
  style.textContent = "@media (max-width: 900px), (max-aspect-ratio: 1/1) { .sec > .card { opacity: 1; transform: none; } .sec > .card > * { opacity: 0; transform: translateY(14px); transition: opacity 1.1s ease, transform 1.1s ease; } .sec.in > .card > * { opacity: 1; transform: none; } }" + (still ? " .sec > .card > * { opacity: 1 !important; transform: none !important; }" : "");
  document.head.appendChild(style);

  /* The jar: seven drawings stacked, crossfading with the scroll. */
  const jar = $("jar");
  const imgs = [1, 2, 3, 4, 5, 6, 7].map((n, i) => {
    const im = document.createElement("img");
    im.src = `assets/stage-${n}.webp`; im.alt = "";
    if (i === 0) im.className = "first";
    jar.appendChild(im);
    return im;
  });

  // Where the table edge sits in the wall image (fraction of its height), and
  // where the drawings' ground line sits in their square (fraction of size).
  const WALL = { w: 1672, h: 941, table: .822 }, GROUND = .835;
  let J = { x: 0, y: 0, size: 0 };
  function layout() {
    cards();
    const W = innerWidth, H = innerHeight;
    if (wide()) {
      // The wall is `cover`ed (with the 2% bleed of .wall); find the table on screen.
      const sw = W * 1.04, sh = H * 1.04, s = Math.max(sw / WALL.w, sh / WALL.h);
      const tableY = -H * .02 + (sh - WALL.h * s) / 2 + WALL.table * WALL.h * s;
      const size = Math.min(H * .72, W * .42);
      J = { x: W * .66, y: tableY + H * .065 - size * GROUND + size / 2, size };
    } else {
      const size = Math.min(W * .86, H * .44);
      J = { x: W / 2, y: Math.max(70, H * .07) + size / 2, size };
    }
    Object.assign(jar.style, { left: `${J.x - J.size / 2}px`, top: `${J.y - J.size / 2}px`, width: `${J.size}px`, height: `${J.size}px` });
    const k = $("kiln");
    Object.assign(k.style, { left: `${J.x - J.size * .55}px`, top: `${J.y - J.size * .5}px`, width: `${J.size * 1.1}px`, height: `${J.size * 1.05}px` });
    const lb = $("label");
    Object.assign(lb.style, { left: `${J.x - J.size * .36 - 22}px`, top: `${J.y - J.size * .18}px` });
    onScroll();
  }

  // Stage from scroll: section k holds stage[k] when its middle is mid-screen.
  function stageNow() {
    const mid = innerHeight * (wide() ? .5 : .7);
    const pts = sections.map((s) => { const r = s.getBoundingClientRect(); return [r.top + r.height / 2, +s.dataset.stage]; });
    if (mid <= pts[0][0]) return pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const [a, sa] = pts[i], [b, sb] = pts[i + 1];
      if (mid <= b) { const f = (mid - a) / (b - a), e = f * f * (3 - 2 * f); return sa + (sb - sa) * e; }
    }
    return pts[pts.length - 1][1];
  }
  let shown = -1;
  function onScroll() {
    const s = stageNow();
    if (Math.abs(s - shown) < .001) return;
    shown = s;
    imgs.forEach((im, i) => {
      const o = Math.max(0, 1 - Math.abs(s - i));
      im.style.opacity = o.toFixed(3);
      // A stage settles in like wet ink: soft, then sharp.
      im.style.filter = o > .995 || still ? "none" : `blur(${((1 - o) * 5).toFixed(2)}px)`;
    });
    // The kiln: a warm glow while the raw jar is fired into bisque.
    $("kiln").style.opacity = Math.max(0, 1 - Math.abs(s - 4.5) / .5).toFixed(3);
    const n = Math.round(s);
    const lb = $("label");
    const txt = `<b>${String(n + 1).padStart(2, "0")}</b>${esc(c.stages[n])}`;
    if (lb.dataset.n !== String(n)) { lb.dataset.n = n; lb.innerHTML = txt; }
  }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", layout);
  layout();
  if (q.has("at")) { const t = document.getElementById(q.get("at")); if (t) { t.scrollIntoView({ block: "center" }); document.querySelectorAll(".sec").forEach((x) => x.classList.add("in")); onScroll(); } }
})();
</script>
</body>
</html>
