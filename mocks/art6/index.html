<style>
  /* Washi paper, ink and watercolour, a lot of quiet space. The jar stays in
     view and changes as the story scrolls past; its white paper is multiplied
     into the wall, so the drawings sit on it like ink, with no cut-out edges. */
  :root {
    --paper: #f1e6d4; --ink: #3b2f27; --ink-soft: #6f6256; --line: rgba(59, 47, 39, .16);
    --seal: #b5442c; --clay: #a8562f;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper); scroll-behavior: smooth; }
  body { color: var(--ink); font: 400 15.5px/1.95 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 1.5px solid var(--seal); outline-offset: 4px; border-radius: 2px; }

  /* ---------- The room ---------- */
  .wall { position: fixed; inset: -2%; z-index: 0; background: url(assets/wall.webp) center / cover no-repeat; animation: breeze 26s ease-in-out infinite alternate; }
  @keyframes breeze { from { transform: translate(0, 0) scale(1); } to { transform: translate(-.6%, .3%) scale(1.012); } }
  /* Phones: an identical copy of the wall covers the jar's area, so the
     story slides under it and never covers the jar mid-morph. */
  .wall.cover { z-index: 2; display: none; pointer-events: none; }
  .kiln { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(255, 140, 60, .55), rgba(240, 110, 40, .22) 55%, transparent); filter: blur(8px); }
  /* Two layers: a paper-white backing in the pot's exact outline (so the pot is solid),
     and the drawing multiplied over it like ink (so the shadow soaks into the paper). */
  .jar-back { position: fixed; z-index: 4; pointer-events: none; }
  .jar { position: fixed; z-index: 4; pointer-events: none; mix-blend-mode: multiply; }
  .jar canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .jar img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; will-change: opacity, filter; }
  .jar img.first { opacity: 1; }
  .label { position: fixed; z-index: 5; writing-mode: vertical-rl; font: 500 11px/1 var(--sans); letter-spacing: .32em; color: var(--ink-soft); white-space: nowrap; transition: opacity .6s; }
  .label b { font-weight: 500; color: var(--seal); margin-bottom: 1.1em; display: inline-block; }

  /* ---------- Top ---------- */
  .top { position: fixed; z-index: 6; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 22px clamp(20px, 5vw, 64px) 34px; background: linear-gradient(rgba(241, 230, 212, .94) 55%, rgba(241, 230, 212, 0)); }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .seal { width: 30px; height: 30px; flex: none; }
  .brand span { font: 500 15px/1.1 var(--serif); letter-spacing: .04em; }
  .brand small { display: block; font: 400 10px/1.4 var(--sans); letter-spacing: .28em; color: var(--ink-soft); text-transform: lowercase; }
  .top nav { display: flex; gap: 22px; align-items: center; font: 500 12px var(--sans); letter-spacing: .18em; text-transform: lowercase; }
  .top nav a, .top nav button { text-decoration: none; background: none; border: 0; font: inherit; letter-spacing: inherit; color: var(--ink); cursor: pointer; padding: 6px 0; border-bottom: 1px solid transparent; }
  .top nav a:hover, .top nav button:hover { border-bottom-color: var(--ink); }

  /* ---------- The story ---------- */
  main { position: relative; z-index: 1; }
  .sec { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 120px clamp(24px, 9vw, 140px) 120px; max-width: calc(min(470px, 40vw) + clamp(24px, 9vw, 140px) * 2); }
  .card { display: flex; flex-direction: column; will-change: opacity, transform; }
  .eyebrow { font: 500 11px/1 var(--sans); letter-spacing: .32em; color: var(--clay); text-transform: lowercase; margin-bottom: 22px; display: flex; align-items: center; gap: 14px; }
  .eyebrow::after { content: ""; width: 36px; height: 1px; background: currentColor; opacity: .5; }
  h1 { font: 500 clamp(48px, 6.4vw, 84px)/1.02 var(--serif); letter-spacing: -.01em; margin-bottom: 20px; }
  h2 { font: 500 clamp(32px, 3.6vw, 46px)/1.15 var(--serif); margin-bottom: 20px; }
  .lead { font: 400 clamp(19px, 1.8vw, 23px)/1.55 var(--serif); color: var(--ink-soft); margin-bottom: 18px; }
  .sec p + p { margin-top: 14px; }
  .sec p { max-width: 34em; }
  .hint { margin-top: 44px; font: 500 11px var(--sans); letter-spacing: .28em; color: var(--ink-soft); text-transform: lowercase; display: flex; align-items: center; gap: 14px; }
  .hint i { width: 1px; height: 46px; background: linear-gradient(var(--ink-soft), transparent); animation: drip 2.4s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  /* Work: a quiet row of pieces on paper. */
  .works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 26px; }
  .piece figure, .piece { margin: 0; }
  .piece .ph { aspect-ratio: 3 / 4; background: #f4ebde; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .piece .ph img { width: 92%; mix-blend-mode: multiply; }
  .piece figcaption { margin-top: 10px; font: 500 14px/1.3 var(--serif); }
  .piece small { display: block; font: 400 11px/1.6 var(--sans); letter-spacing: .08em; color: var(--ink-soft); }

  .order-btn { align-self: flex-start; margin-top: 30px; display: inline-flex; align-items: center; gap: 14px; padding: 16px 28px; background: var(--seal); color: #fbf3e8; text-decoration: none; font: 500 13px var(--sans); letter-spacing: .22em; text-transform: lowercase; transition: background .3s; }
  .order-btn:hover { background: #9a3822; }
  .order-btn span { transition: transform .3s; } .order-btn:hover span { transform: translateX(4px); }
  .mail { margin-top: 26px; font-size: 14px; color: var(--ink-soft); }
  .mail a { color: var(--ink); text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .foot { margin-top: 34px; font: 400 11px var(--sans); letter-spacing: .2em; color: var(--ink-soft); text-transform: lowercase; }
  footer { position: relative; z-index: 1; padding: 0 clamp(24px, 9vw, 140px) 40px; font: 400 11px var(--sans); letter-spacing: .2em; color: var(--ink-soft); text-transform: lowercase; }

  /* ---------- Phones: the jar on top, the story underneath ---------- */
  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    .sec { max-width: none; justify-content: flex-end; padding: 52vh 24px 9vh; min-height: 100svh; }
    .sec:first-child { padding-top: 54vh; }
    .sec .card { padding: 10px 0 6px; }
    .wall.cover { display: block; -webkit-mask-image: linear-gradient(#000 var(--cut, 50vh), transparent calc(var(--cut, 50vh) + 7vh)); mask-image: linear-gradient(#000 var(--cut, 50vh), transparent calc(var(--cut, 50vh) + 7vh)); }
    .top { padding: max(16px, env(safe-area-inset-top)) 20px 14px; background: linear-gradient(rgba(241, 230, 212, .85), rgba(241, 230, 212, 0)); }
    .brand small { display: none; }
    .top nav { gap: 16px; }
    .works { gap: 10px; }
    .label { display: none; }
    /* The table is for the desktop scene; on a phone the jar floats on the wall. */
    .wall { background-size: auto 128%; background-position: 32% 0; }
    .sec { min-height: 78svh; padding-top: 50vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .wall, .hint i { animation: none; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

        { id: "prepare", stage: 0, eyebrow: "01 · prepare", h: "It starts as a ball", body: ["Clay is wedged first: pressed, folded and turned on the bench until the air is out and it is even all the way through. Then it is rolled into a ball.", "Skip it, and a hidden air pocket can crack the piece in the kiln weeks later."] },

        { id: "coil", stage: 12, eyebrow: "04 · coil", h: "Coil by coil", body: ["Clay is rolled into long ropes and laid around the rim one coil at a time, each one scored and joined to the last with slip. Placing a coil slightly in or out is how the form starts to curve."] },
        { id: "shape", stage: 14, eyebrow: "05 · shape", h: "One skin", body: ["The coils are blended into one smooth skin with fingers and a wooden rib. No two pieces come out alike, and each keeps a little of the hands that made it."] },

      footer: "feito à mão, e em código",
      stages: ["uma bola de barro", "aberta à mão", "uma pequena taça", "rolo a rolo", "uma só pele", "chacota", "vidrado"],
      sections: [
        { id: "top", stage: 0, eyebrow: "cerâmica · porto", h1: "Ivo Lopes", lead: "Terra, água, fogo e tempo.", body: ["Cerâmica construída à mão. Desliza e acompanha uma bola de barro até ser um jarro acabado."], hint: true },
        { id: "prepare", stage: 0, eyebrow: "01 · preparar", h: "Começa numa bola", body: ["Primeiro, o barro é amassado: pressionado, dobrado e rodado na bancada até sair o ar e ficar uniforme por dentro. Depois, enrola-se numa bola.", "Sem este passo, uma bolha de ar escondida pode rachar a peça no forno semanas depois."] },
        { id: "pinch", stage: 4, eyebrow: "02 · beliscar", h: "Abrir com o polegar", body: ["Um polegar entra na bola. A rodar devagar na mão, as paredes vão sendo apertadas entre o polegar e os dedos, um pouco mais finas a cada volta."] },

        { id: "fire", stage: 17, eyebrow: "06 · cozer", h: "Pelo fogo", body: ["Bem seca, a peça vai ao forno para a primeira cozedura, a chacota, a cerca de 950°C. O barro passa a cerâmica e encolhe um pouco pelo caminho."] },
        { id: "glaze", stage: 20, eyebrow: "07 · vidrar", h: "Vidrar, e voltar ao fogo", body: ["Depois vem o vidrado, e uma segunda cozedura, mais quente, que o derrete em vidro. Cada vidrado corre um pouco à sua maneira no calor, por isso a última palavra é do forno."] },
        { id: "work", stage: 20, eyebrow: "trabalhos", h: "Algumas peças", body: ["Todas feitas da mesma maneira lenta."], works: [["Peça I", "fotografia em breve"], ["Peça II", "fotografia em breve"], ["Peça III", "fotografia em breve"]] },
        { id: "order", stage: 20, eyebrow: "encomendar", h: "Encomendar uma peça", body: ["Tens uma ideia? Envia uma ou duas fotografias de uma peça de que gostes, descreve o que procuras, e recebes uma resposta por email com um orçamento."], cta: "Encomendar uma peça", mail: "Perguntas, ou só para falar de barro:" },
      ],
    },
  };
  const q = new URLSearchParams(location.search);
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  const want = q.get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
  const c = T[want === "pt" ? "pt" : "en"];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  $("nav-order").textContent = c.order;
  $("lang").textContent = c.other;
  $("lang").setAttribute("aria-label", c.lang === "pt" ? "View in English" : "Ver em português");
  $("lang").addEventListener("click", () => { try { localStorage.setItem("lang", c.other); } catch (_) {} location.search = `?lang=${c.other}`; });


  /* Story */
  const ORDER_URL = `https://art.ivolopes.com/order/?lang=${c.lang}`;
  $("story").innerHTML = c.sections.map((s) => `
    <section class="sec" id="${s.id}" data-stage="${s.stage}"><div class="card">
      <p class="eyebrow">${esc(s.eyebrow)}</p>
      ${s.h1 ? `<h1>${esc(s.h1)}</h1>` : `<h2>${esc(s.h)}</h2>`}
      ${s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ""}
      ${s.body.map((p) => `<p>${esc(p)}</p>`).join("")}
      ${s.works ? `<div class="works">${s.works.map(([t, n]) => `<figure class="piece"><div class="ph"><img src="assets/f-20.webp" alt="" loading="lazy"></div><figcaption>${esc(t)}<small>${esc(n)}</small></figcaption></figure>`).join("")}</div>` : ""}
      ${s.cta ? `<a class="order-btn" href="${ORDER_URL}">${esc(s.cta)} <span aria-hidden="true">→</span></a><p class="mail">${esc(s.mail)} <a href="mailto:mail@ivolopes.com">mail@ivolopes.com</a></p><p class="foot">${esc(c.footer)}</p>` : ""}
      ${s.hint ? `<p class="hint"><i></i>${esc(c.hint)}</p>` : ""}
    </div></section>`).join("");
  // On wide screens the card wrapper is just a pass-through.
  const wide = () => innerWidth > 900 && innerWidth / innerHeight > 1;
  function cards() {}
  const sections = [...document.querySelectorAll(".sec")];



  /* The jar: a real morph between seven drawings (WebGL).
     Each drawing's clay silhouette is measured once. Mid-transition both
     drawings are stretched onto the same in-between silhouette, anchored at
     the base, so one object visibly changes shape; the new stage bleeds in
     through a watercolour edge, with a slight wet-ink ripple. */
  const jar = $("jar");
  const STAGES = 21;
  const WASH_FROM = 14;   // from here on only the colour changes (drying, then glazing)   // frames f-00 … f-20: the seven drawings and the in-betweens
  const morph = (() => {
    const cv = document.createElement("canvas");
    const gl = cv.getContext("webgl", { premultipliedAlpha: false, antialias: true });
    if (!gl) return null;
    jar.appendChild(cv);
    const VS = "attribute vec2 p; varying vec2 vUv; void main(){ vUv = vec2(p.x * .5 + .5, .5 - p.y * .5); gl_Position = vec4(p, 0., 1.); }";
    const FS = `precision highp float;
      uniform sampler2D uA, uB, uPA, uPB; uniform vec4 uBoxA, uBoxB; uniform float uF, uT, uWash; varying vec2 vUv;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
        return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
      float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++){ s += a * n(p); p = p * 2.03 + 7.1; a *= .5; } return s; }
      // box: centre x, base y, width, height (uv). Map a screen uv on box M into box S.
      vec2 fit(vec2 uv, vec4 M, vec4 S){ return vec2(S.x + (uv.x - M.x) * S.z / M.z, S.y + (uv.y - M.y) * S.w / M.w); }
      // A drawing's outline at height t (0 top .. 1 base): its left and right edge (16-bit packed).
      vec2 edges(sampler2D P, float t){ vec4 v = texture2D(P, vec2(clamp(t, 0., 1.) * (127. / 128.) + .5 / 128., .5));
        return vec2(v.r * 255. / 256. + v.g / 256., v.b * 255. / 256. + v.a / 256.); }
      // Where a screen point on the in-between outline lands in a drawing.
      vec2 follow(vec2 uv, sampler2D P, vec4 S, vec4 M, vec2 eM){
        float topS = S.y - S.w, topM = M.y - M.w;
        float t = (uv.y - topM) / M.w;
        vec2 eS = edges(P, t);
        float x = eS.x + (uv.x - eM.x) / max(eM.y - eM.x, 1e-3) * (eS.y - eS.x);
        return vec2(x, topS + t * S.w);
      }
      vec3 tex(sampler2D t, vec2 uv){ if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return vec3(1.); return texture2D(t, uv).rgb; }
      void main(){
        float f = uF, e = f;   // linear: many small steps flow into one motion, no pause at each drawing
        vec4 M = mix(uBoxA, uBoxB, e);
        float wob = sin(3.14159 * f);
        vec2 uv = vUv;
        float tM = (uv.y - (M.y - M.w)) / M.w;
        vec2 eM = mix(edges(uPA, tM), edges(uPB, tM), e);
        // Shape changes follow the outline; colour-only changes keep the drawings as they are.
        // Inside the in-between outline the drawings follow it; outside (paper, the hatched
        // shadow) they keep their own shape, so nothing gets stretched.
        float px = 1.5 / 512.;
        float inside = smoothstep(eM.x - px, eM.x + px, uv.x) * (1. - smoothstep(eM.y - px, eM.y + px, uv.x))
                     * smoothstep(-.004, .004, tM) * (1. - smoothstep(.996, 1.004, tM));
        float useFollow = inside * (1. - uWash);
        vec3 a = tex(uA, mix(fit(uv, M, uBoxA), follow(uv, uPA, uBoxA, M, eM), useFollow));
        vec3 b = tex(uB, mix(fit(uv, M, uBoxB), follow(uv, uPB, uBoxB, M, eM), useFollow));
        // The new stage bleeds in like a wash: grows from the clay outward, with a soft edge.
        float g = clamp((fbm(vUv * 3.2 + vec2(0., uT * .03)) - .25) / .5, 0., 1.) * .7 + (1. - vUv.y) * .3;
        // Shape changes: an even, aligned dissolve. Colour-only changes: the colour spreads like a wash.
        float m = mix(e, smoothstep(g - .22, g + .22, f * 1.44 - .22), uWash);
        vec3 col = mix(a, b, m);
        // Watercolour bloom: pigment gathers at the wet edge.
        float edge = 1. - abs(m * 2. - 1.);
        col *= 1. - edge * .06 * wob * uWash * smoothstep(.05, .2, 1. - min(col.r, min(col.g, col.b)));
        gl_FragColor = vec4(col, 1.);
      }`;
    const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {}; ["uA", "uB", "uPA", "uPB", "uBoxA", "uBoxB", "uF", "uT", "uWash"].forEach((k) => (U[k] = gl.getUniformLocation(pr, k)));
    gl.uniform1i(U.uA, 0); gl.uniform1i(U.uB, 1); gl.uniform1i(U.uPA, 2); gl.uniform1i(U.uPB, 3);
    const tex = [], box = [], prof = [], edgesJS = [];
    const back = $("jar-back"), bg = back.getContext("2d");
    const unpack = (px, r, o) => ((px[r * 4 + o] << 8) | px[r * 4 + o + 1]) / 65535;
    // The clay's silhouette: coloured pixels (the ink hatching is grey, so it is left out).
    function measure(img) {
      const c = document.createElement("canvas"), N = 256; c.width = c.height = N;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0, N, N);
      const d = g.getImageData(0, 0, N, N).data;
      // Each row's outermost drawn pixel (ink or colour) on both sides.
      const Ls = new Float32Array(N).fill(-1), Rs = new Float32Array(N).fill(-1);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const k = (y * N + x) * 4;
        if ((d[k] + d[k + 1] + d[k + 2]) / 3 < 228) { if (Ls[y] < 0) Ls[y] = x; Rs[y] = x; }
      }
      let top = 0; while (top < N - 1 && Ls[top] < 0) top++;
      // The base: below the widest row the pot narrows towards its foot; where the
      // hatched shadow starts, the width jumps out again. Stop just before that.
      let wide = top; for (let y = top; y < N; y++) if (Ls[y] >= 0 && Rs[y] - Ls[y] > Rs[wide] - Ls[wide]) wide = y;
      let base = wide;
      for (let y = wide + 1; y < N && Ls[y] >= 0; y++) { if (Rs[y] - Ls[y] > Rs[y - 1] - Ls[y - 1] + 2.5) break; base = y; }
      let minL = N, maxR = 0;
      for (let y = top; y <= base; y++) { minL = Math.min(minL, Ls[y]); maxR = Math.max(maxR, Rs[y]); }
      const R = 128, px = new Uint8Array(R * 4);
      const pack = (r, v, o) => { const q = Math.round(Math.min(.9999, Math.max(0, v)) * 65535); px[r * 4 + o] = q >> 8; px[r * 4 + o + 1] = q & 255; };
      for (let r = 0; r < R; r++) {
        const y = Math.round(top + (r / (R - 1)) * (base - top));
        pack(r, Ls[y] / N, 0); pack(r, (Rs[y] + 1) / N, 2);
      }
      return { box: [(minL + maxR + 1) / 2 / N, (base + 1) / N, (maxR - minL + 1) / N, (base - top + 1) / N], px };
    }
    const ready = Promise.all(Array.from({ length: STAGES }, (_, i) => new Promise((res) => {
      const im = new Image(); im.onload = () => {
        const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
        [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([a, b]) => gl.texParameteri(gl.TEXTURE_2D, a, b));
        const m = measure(im); tex[i] = t; box[i] = m.box; edgesJS[i] = m.px;
        const pt = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, pt);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 128, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, m.px);
        [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([a, b]) => gl.texParameteri(gl.TEXTURE_2D, a, b));
        prof[i] = pt; res();
      };
      im.src = `assets/f-${String(i).padStart(2, "0")}.webp`;
    })));
    let t0 = performance.now();
    return {
      ready,
      size(px) { const d = Math.min(devicePixelRatio || 1, 2); cv.width = cv.height = Math.round(px * d); gl.viewport(0, 0, cv.width, cv.height); back.width = back.height = cv.width; },
      draw(s) {
        if (!tex[STAGES - 1]) return;
        const i = Math.min(STAGES - 2, Math.max(0, Math.floor(s))), f = Math.min(1, Math.max(0, s - i));
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[i]);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex[i + 1]);
        gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, prof[i]);
        gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, prof[i + 1]);
        gl.uniform4fv(U.uBoxA, box[i]); gl.uniform4fv(U.uBoxB, box[i + 1]);
        gl.uniform1f(U.uF, f); gl.uniform1f(U.uT, (performance.now() - t0) / 1000);
        gl.uniform1f(U.uWash, i >= WASH_FROM ? 1 : 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        // The backing: the in-between outline, filled with paper white, a hair inside the ink line.
        const e = f, A = box[i], B = box[i + 1], W = back.width, inset = 1.4 / 512;
        const My = A[1] + (B[1] - A[1]) * e, Mh = A[3] + (B[3] - A[3]) * e, top = My - Mh;
        bg.clearRect(0, 0, W, W); bg.fillStyle = "#fffdf8"; bg.beginPath();
        for (let r = 0; r < 128; r++) { const x = unpack(edgesJS[i], r, 0) * (1 - e) + unpack(edgesJS[i + 1], r, 0) * e; bg.lineTo((x + inset) * W, (top + (r / 127) * Mh) * W); }
        for (let r = 127; r >= 0; r--) { const x = unpack(edgesJS[i], r, 2) * (1 - e) + unpack(edgesJS[i + 1], r, 2) * e; bg.lineTo((x - inset) * W, (top + (r / 127) * Mh) * W); }
        bg.closePath(); bg.fill();
      },
    };
  })();
  // Without WebGL: the drawings simply crossfade.
  const imgs = morph ? [] : Array.from({ length: STAGES }, (_, i) => {
    const im = document.createElement("img"); im.src = `assets/f-${String(i).padStart(2, "0")}.webp`; im.alt = "";
    if (i === 0) im.className = "first"; jar.appendChild(im); return im;
  });

  // Where the table edge sits in the wall image (fraction of its height), and
  // where the drawings' ground line sits in their square (fraction of size).
  // GROUND: where the clay's base sits in its canvas (fraction of its height).
  const WALL = { w: 1672, h: 941, table: .822 }, GROUND = .835;
  let J = { x: 0, y: 0, size: 0 };
  function layout() {
    cards();
    const W = innerWidth, H = innerHeight;
    if (wide()) {
      // The wall is `cover`ed (with the 2% bleed of .wall); find the table on screen.
      const sw = W * 1.04, sh = H * 1.04, s = Math.max(sw / WALL.w, sh / WALL.h);
      const tableY = -H * .02 + (sh - WALL.h * s) / 2 + WALL.table * WALL.h * s;
      const size = Math.min(H * .72, W * .42);
      J = { x: W * .66, y: tableY + H * .065 - size * GROUND + size / 2, size };
    } else {
      const size = Math.min(W * .86, H * .44);
      J = { x: W / 2, y: Math.max(70, H * .07) + size / 2, size };
    }
    Object.assign(jar.style, { left: `${J.x - J.size / 2}px`, top: `${J.y - J.size / 2}px`, width: `${J.size}px`, height: `${J.size}px` });
    Object.assign($("jar-back").style, { left: jar.style.left, top: jar.style.top, width: jar.style.width, height: jar.style.height });
    cutPx = J.y + J.size * .45;
    document.documentElement.style.setProperty("--cut", `${cutPx}px`);
    // The last passage ends the page: at full scroll it sits at the reading point.
    const last = sections[sections.length - 1], lc = last.querySelector(".card");
    last.style.minHeight = "0"; last.style.paddingBottom = "0";
    last.style.paddingBottom = `${Math.max(0, H - readAt() - (wide() ? lc.offsetHeight / 2 : lc.offsetHeight))}px`;
    if (morph) morph.size(J.size);
    shown = -1;
    const k = $("kiln");
    Object.assign(k.style, { left: `${J.x - J.size * .55}px`, top: `${J.y - J.size * .5}px`, width: `${J.size * 1.1}px`, height: `${J.size * 1.05}px` });
    const lb = $("label");
    Object.assign(lb.style, { left: `${J.x - J.size * .36 - 22}px`, top: `${J.y - J.size * .18}px` });
    onScroll();
  }

  // Stage from scroll: section k holds stage[k] when its middle is mid-screen.
  function stageNow() {
    // Desktop: a section's middle at mid-screen. Phones: its text just under the jar.
    const mid = readAt();
    const pts = sections.map((s) => [wide() ? centreOf(s) : anchorOf(s.querySelector(".card")), +s.dataset.stage]);
    if (mid <= pts[0][0]) return pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const [a, sa] = pts[i], [b, sb] = pts[i + 1];
      if (mid <= b) return sa + (sb - sa) * (mid - a) / (b - a);
    }
    return pts[pts.length - 1][1];
  }
  let shown = -1;
  // A card's centre on screen, ignoring its own fade-in offset.
  const centreOf = (el) => { let y = 0, n = el; while (n) { y += n.offsetTop; n = n.offsetParent; } return y + el.offsetHeight / 2 - scrollY; };
  // Desktop: a passage's middle sits mid-screen. Phones: its top sits just under the jar.
  let cutPx = 0;
  const readAt = () => wide() ? innerHeight * .5 : cutPx + innerHeight * .07 + 10;
  const anchorOf = (cd) => wide() ? centreOf(cd) : centreOf(cd) - cd.offsetHeight / 2;
  function fadeText() {
    const H = innerHeight, mid = readAt();
    document.querySelectorAll(".sec .card").forEach((cd) => {
      const d = (anchorOf(cd) - mid) / H;
      // Fades in from below, holds around the reading point, gone well before the top.
      const o = d > 0 ? 1 - smooth((d - .14) / .26) : 1 - smooth((-d - (wide() ? .14 : .08)) / (wide() ? .2 : .14));
      cd.style.opacity = still ? (o > .5 ? 1 : 0) : o.toFixed(3);
      cd.style.transform = still ? "" : `translateY(${(d > 0 ? Math.max(0, d - .14) : 0) * 40}px)`;
    });
  }
  const smooth = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  function onScroll() {
    const s = stageNow();
    fadeText();
    if (Math.abs(s - shown) < .001) return;
    shown = s;
    if (morph) morph.draw(s);
    imgs.forEach((im, i) => { im.style.opacity = Math.max(0, 1 - Math.abs(s - i)).toFixed(3); });
    // The kiln: a warm glow while the raw jar is fired into bisque.
    // The kiln: a warm glow while the raw jar is fired into bisque.
    $("kiln").style.opacity = Math.max(0, 1 - Math.abs(s - 15.5) / 1.6).toFixed(3);
    const KEYS = [0, 4, 8, 12, 14, 17, 20];
    let n = 0; KEYS.forEach((k, i) => { if (Math.abs(s - k) < Math.abs(s - KEYS[n])) n = i; });
    const lb = $("label");
    const txt = `<b>${String(n + 1).padStart(2, "0")}</b>${esc(c.stages[n])}`;
    if (lb.dataset.n !== String(n)) { lb.dataset.n = n; lb.innerHTML = txt; }
  }
  addEventListener("scroll", onScroll, { passive: true });
  // The kiln glow follows the clay's own firing value, which it sets every frame.
  if (morph) morph.ready.then(() => { shown = -1; onScroll();
    if (!still) (function tick() { const s = stageNow(), f = s - Math.floor(s); if (f > .01 && f < .99) morph.draw(s); requestAnimationFrame(tick); })(); });
  addEventListener("resize", layout);
  layout();
  if (q.has("at")) { const t = document.getElementById(q.get("at")); if (t) { const cd = t.querySelector(".card"); scrollTo({ top: anchorOf(cd) + scrollY - readAt(), behavior: "instant" }); onScroll(); } }
})();
</script>
</body>
