<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ivo Lopes · Ceramics</title>
<meta name="theme-color" content="#f1e7d6">
<link rel="icon" href="assets/stamp.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* A hanging scroll: six watercolour scenes, one under the other, on washi
     paper. Each painting washes in as it arrives; the text sits on the paper
     below it. Scrolling down simply goes down. */
  :root {
    --paper: #f1e7d6; --ink: #3b2f27; --ink-soft: #6c5f53; --clay: #a8562f;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper); scroll-behavior: smooth; }
  body { color: var(--ink); font: 400 15px/1.85 var(--sans); -webkit-font-smoothing: antialiased;
    background: radial-gradient(120% 60% at 50% 0%, #f5ecdd, var(--paper) 70%); }
  a { color: inherit; }
  :focus-visible { outline: 1.5px solid var(--clay); outline-offset: 4px; border-radius: 2px; }

  .top { position: fixed; z-index: 5; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 14px clamp(16px, 4vw, 48px); background: linear-gradient(rgba(241, 231, 214, .95) 60%, rgba(241, 231, 214, 0)); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 500 15px var(--serif); }
  .brand img { width: 30px; height: 30px; }
  .top nav { display: flex; gap: 20px; font: 500 12px var(--sans); letter-spacing: .16em; }
  .top nav a, .top nav button { background: none; border: 0; font: inherit; letter-spacing: inherit; color: var(--ink); text-decoration: none; cursor: pointer; }

  main { max-width: 1180px; margin: 0 auto; padding: 96px clamp(16px, 4vw, 40px) 40px; }
  .scene { margin: 0 auto 120px; }
  /* Paintings melt into the paper: feathered edges, no hard rectangle. */
  .art { display: block; width: 100%; height: auto;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent), linear-gradient(transparent, #000 6%, #000 92%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent), linear-gradient(transparent, #000 6%, #000 92%, transparent); mask-composite: intersect;
    opacity: 0; filter: blur(6px) saturate(.6); transform: scale(1.015); transition: opacity 1.6s ease, filter 1.8s ease, transform 2.4s ease; }
  .in .art { opacity: 1; filter: none; transform: none; }
  .phone-only { display: none; }

  .caps { display: grid; gap: 28px; margin-top: 26px; }
  .cap { opacity: 0; transform: translateY(12px); transition: opacity 1s ease .5s, transform 1s ease .5s; }
  .in .cap { opacity: 1; transform: none; }
  .in .cap:nth-child(2) { transition-delay: .75s; } .in .cap:nth-child(3) { transition-delay: 1s; }
  .n { font: 500 11px var(--sans); letter-spacing: .3em; color: var(--clay); }
  .cap h2 { font: 500 26px/1.25 var(--serif); margin: 4px 0 6px; }
  .cap p { color: var(--ink); max-width: 30em; }

  /* Arrival and the end: painting and text side by side. */
  .duo { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; }
  .duo .cap { transition-delay: .3s; }
  h1 { font: 500 clamp(46px, 6vw, 72px)/1.05 var(--serif); letter-spacing: -.01em; }
  .sub { display: flex; align-items: center; gap: 12px; margin: 12px 0 16px; font: 500 11px var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--ink-soft); }
  .sub img { width: 36px; height: 36px; }
  .lead { font: 400 21px/1.5 var(--serif); margin-bottom: 10px; }
  .down { margin-top: 26px; display: inline-flex; align-items: center; gap: 12px; font: 500 11px var(--sans); letter-spacing: .26em; color: var(--ink-soft); text-decoration: none; }
  .down i { width: 1px; height: 38px; background: linear-gradient(var(--ink-soft), transparent); }
  .btn { display: inline-flex; align-items: center; gap: 12px; margin-top: 18px; padding: 15px 26px; border-radius: 999px; background: var(--clay); color: #fbf3e8; text-decoration: none; font: 500 14px var(--sans); letter-spacing: .08em; }
  .btn:hover { background: #8f4523; }
  .mail { display: block; margin-top: 14px; }
  .seal { width: 46px; height: 46px; margin-top: 18px; display: block; }
  footer { text-align: center; font: 400 11px var(--sans); letter-spacing: .2em; color: var(--ink-soft); padding: 0 0 40px; }

  @media (max-width: 760px) {
    main { padding-top: 76px; }
    .scene { margin-bottom: 80px; }
    .duo { grid-template-columns: 1fr; gap: 18px; }
    .desk-only { display: none; }
    .phone-only { display: block; }
    .phone-only + .phone-only { margin-top: 18px; }
    .caps { grid-template-columns: 1fr !important; gap: 22px; }
    .cap h2 { font-size: 23px; }
    h1 { font-size: 48px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .art, .cap { opacity: 1; filter: none; transform: none; transition: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#top"><img src="assets/stamp.png" alt=""><span>Ivo Lopes</span></a>
  <nav><a href="#order" id="nav-order">order</a><button type="button" id="lang">pt</button></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script>
(function () {
  const T = {
    en: { other: "pt", order: "order", down: "scroll", foot: "made by hand, in Porto",
      intro: ["Ivo Lopes", "ceramics · porto", "Earth, water, fire and time.", "I build pots by hand in Porto, slowly, one at a time. Scroll down and follow a ball of clay to a finished jar."],
      s: {
        ball: ["01", "It starts as a ball", "I wedge the clay until the air is out, then roll it into a ball."],
        pinch: ["02", "Pinch it open", "A thumb goes in. Turning it in my hand, I pinch the walls out, a little thinner each round."],
        bowl: ["03", "A small bowl", "The pinched form becomes a bowl with an even wall: the base for everything else."],
        coil: ["04", "Coil by coil", "I lay ropes of clay on the bowl's rim, one at a time, each joined to the last."],
        skin: ["05", "One skin", "The coils are blended into one smooth surface with my fingers and a wooden rib."],
        dry: ["06", "Bone dry", "It rests for days until every bit of water has left the clay."],
        bisque: ["07", "Through the fire", "In the kiln at around 950°C, clay becomes ceramic: pale, matte and hard."],
        glaze: ["08", "Glaze, and fire again", "A second, hotter firing melts the glaze into glass. The kiln has the last word."],
      },
      end: ["finished pieces", "Order a piece", "Have something in mind? Send a photo or two, describe what you would like, and you will get a reply by email with a price.", "Order a piece"] },
    pt: { other: "en", order: "encomendar", down: "desliza", foot: "feito à mão, no Porto",
      intro: ["Ivo Lopes", "cerâmica · porto", "Terra, água, fogo e tempo.", "Construo peças à mão no Porto, devagar, uma de cada vez. Desliza e segue uma bola de barro até ser um jarro acabado."],
      s: {
        ball: ["01", "Começa numa bola", "Amasso o barro até sair todo o ar e enrolo-o numa bola."],
        pinch: ["02", "Abrir com o polegar", "Um polegar entra. A rodar na mão, aperto as paredes, um pouco mais finas a cada volta."],
        bowl: ["03", "Uma pequena taça", "A forma beliscada passa a uma taça de parede uniforme: a base para tudo o resto."],
        coil: ["04", "Rolo a rolo", "Assento cordas de barro no bordo da taça, uma de cada vez, cada uma colada à anterior."],
        skin: ["05", "Uma só pele", "Os rolos fundem-se numa só superfície lisa, com os dedos e uma costela de madeira."],
        dry: ["06", "Bem seca", "Descansa durante dias, até a água sair toda do barro."],
        bisque: ["07", "Pelo fogo", "No forno, a cerca de 950°C, o barro passa a cerâmica: claro, mate e duro."],
        glaze: ["08", "Vidrar, e voltar ao fogo", "Uma segunda cozedura, mais quente, derrete o vidrado em vidro. A última palavra é do forno."],
      },
      end: ["peças acabadas", "Encomendar uma peça", "Tens uma ideia? Envia uma ou duas fotografias, descreve o que procuras, e recebes uma resposta por email com um orçamento.", "Encomendar uma peça"] },
  };
  const q = new URLSearchParams(location.search);
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (_) {}
  const lang = (q.get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en")) === "pt" ? "pt" : "en";
  const c = T[lang], $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  document.documentElement.lang = lang;
  $("nav-order").textContent = c.order; $("lang").textContent = c.other; $("foot").textContent = c.foot;
  $("lang").addEventListener("click", () => { try { localStorage.setItem("lang", c.other); } catch (_) {} location.search = `?lang=${c.other}`; });
  const cap = ([n, h, p]) => `<div class="cap"><span class="n">${n}</span><h2>${esc(h)}</h2><p>${esc(p)}</p></div>`;
  const img = (f, cls = "") => `<img class="art ${cls}" src="assets/${f}.webp" alt="" loading="lazy">`;
  const scene = (desk, phone, caps, cols) => `<section class="scene">${img(desk, phone ? "desk-only" : "")}${(phone || []).map((f) => img(f, "phone-only")).join("")}
    <div class="caps" style="grid-template-columns:repeat(${cols}, 1fr)">${caps.map(cap).join("")}</div></section>`;
  const S = c.s;
  $("main").innerHTML = `
    <section class="scene duo" id="top">${img("s1")}
      <div class="cap"><h1>${esc(c.intro[0])}</h1><p class="sub"><img src="assets/stamp.png" alt="">${esc(c.intro[1])}</p>
      <p class="lead">${esc(c.intro[2])}</p><p>${esc(c.intro[3])}</p><a class="down" href="#s2"><i></i>${esc(c.down)}</a></div></section>
    <div id="s2">${scene("s2", null, [S.ball], 1)}</div>
    ${scene("s3", ["s3a", "s3b"], [S.pinch, S.bowl], 2)}
    ${scene("s4", ["s4a", "s4b"], [S.coil, S.skin], 2)}
    ${scene("s5", ["s5a", "s5b"], [S.dry, S.bisque, S.glaze], 3)}
    <section class="scene duo" id="order">${img("s6")}
      <div class="cap"><span class="n">${esc(c.end[0])}</span><h2>${esc(c.end[1])}</h2><p>${esc(c.end[2])}</p>
      <a class="btn" href="https://art.ivolopes.com/order/?lang=${lang}">${esc(c.end[3])} <span aria-hidden="true">→</span></a>
      <a class="mail" href="mailto:mail@ivolopes.com">mail@ivolopes.com</a><img class="seal" src="assets/stamp.png" alt="Ivo's seal"></div></section>`;
  // Each scene washes in as it arrives.
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .2 });
  document.querySelectorAll(".scene").forEach((s) => io.observe(s));
})();
</script>
</body>
</html>
