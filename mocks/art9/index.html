<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ivo Lopes · Ceramics (flow mock)</title>
<meta name="theme-color" content="#f1e7d6">
<link rel="icon" href="assets/stamp.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Flow mock, two variants (?v=a / ?v=b). Paintings are placeholders.
     A: one scene fills the screen; scrolling washes the next one in over it.
     B: scenes are full-screen layers stacked down the page, with parallax. */
  :root { --paper: #f1e7d6; --ink: #3b2f27; --soft: #6c5f53; --clay: #a8562f;
    --serif: "Shippori Mincho", Georgia, serif; --sans: "Zen Kaku Gothic New", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font: 400 15px/1.8 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .top { position: fixed; z-index: 10; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(16px, 4vw, 44px); }
  .brand { display: flex; gap: 10px; align-items: center; text-decoration: none; font: 500 15px var(--serif); }
  .brand img { width: 30px; height: 30px; }
  .switch { display: flex; gap: 4px; padding: 3px; border-radius: 99px; background: rgba(241, 231, 214, .85); font: 500 11px var(--sans); letter-spacing: .1em; }
  .switch a { padding: 5px 12px; border-radius: 99px; text-decoration: none; }
  .switch a.on { background: var(--ink); color: var(--paper); }

  /* Paintings fill the screen; the top fades into paper so text sits on the sky. */
  .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--fx, 50%) 60%; }
  .veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(241, 231, 214, .82), rgba(241, 231, 214, .35) 38%, rgba(241, 231, 214, 0) 55%); }
  .text { position: absolute; left: 0; right: 0; top: max(84px, 11vh); padding: 0 clamp(20px, 6vw, 80px); max-width: 640px; }
  .n { font: 500 11px var(--sans); letter-spacing: .3em; color: var(--clay); }
  h1 { font: 500 clamp(44px, 7vw, 76px)/1.02 var(--serif); }
  h2 { font: 500 clamp(26px, 3.4vw, 40px)/1.15 var(--serif); margin: 4px 0 8px; }
  .text p { max-width: 30em; }
  .sub { display: flex; gap: 10px; align-items: center; margin: 10px 0 12px; font: 500 11px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--soft); }
  .sub img { width: 32px; height: 32px; }
  .lead { font: 400 20px/1.5 var(--serif); }
  .btn { display: inline-flex; gap: 10px; margin-top: 16px; padding: 14px 24px; border-radius: 99px; background: var(--clay); color: #fbf3e8; text-decoration: none; font: 500 14px var(--sans); }
  .mail { display: block; margin-top: 10px; }
  .dots { position: fixed; z-index: 10; right: clamp(12px, 2.5vw, 28px); top: 50%; transform: translateY(-50%); display: grid; gap: 10px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink); transition: background .3s; }
  .dots i.on { background: var(--ink); }

  /* ---------- A: pinned, washing from one scene to the next ---------- */
  .A .stage { position: fixed; inset: 0; overflow: hidden; }
  .A .scene { position: absolute; inset: 0; opacity: 0; }
  .A .scene .art { transform: scale(var(--z, 1.04)); }
  .A .scene .text { opacity: 0; transform: translateY(16px); transition: opacity .7s, transform .7s; }
  .A .scene.read .text { opacity: 1; transform: none; }

  /* ---------- B: stacked full-screen layers with parallax ---------- */
  .B .scene { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
  .B .scene .art { top: -12%; height: 124%; will-change: transform; }
  .B .scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: linear-gradient(rgba(241, 231, 214, 0), var(--paper)); }
  .B .scene .text { opacity: 0; transform: translateY(26px); transition: opacity 1s, transform 1s; }
  .B .scene.read .text { opacity: 1; transform: none; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#"><img src="assets/stamp.png" alt=""><span>Ivo Lopes</span></a>
  <nav class="switch"><a href="?v=a" id="va">A · pages</a><a href="?v=b" id="vb">B · layers</a></nav>
</header>
<div id="root"></div>
<div class="dots" id="dots"></div>
<script>
(function () {
  // [image, focus x on phones, html]
  const S = [
    ["sc0", "22%", `<h1>Ivo Lopes</h1><p class="sub"><img src="assets/stamp.png" alt="">ceramics · porto</p><p class="lead">Earth, water, fire and time.</p><p>I build pots by hand in Porto, slowly, one at a time.</p>`],
    ["sc1", "34%", `<span class="n">01 · 02</span><h2>A ball, pinched open</h2><p>I wedge the clay into a ball, then open it with my thumb.</p>`],
    ["sc2", "80%", `<span class="n">03 · 04</span><h2>A bowl, then coil by coil</h2><p>Ropes of clay are laid on the bowl's rim and rise into a jar.</p>`],
    ["sc3", "72%", `<span class="n">05 · 07</span><h2>Through the fire</h2><p>Raw, then bisque at 950°C, then glazed and fired again.</p>`],
    ["sc4", "35%", `<span class="n">order</span><h2>Order a piece</h2><p>Send a photo or two and describe what you'd like.</p><a class="btn" href="https://art.ivolopes.com/order/">Order a piece →</a><a class="mail" href="mailto:mail@ivolopes.com">mail@ivolopes.com</a>`],
  ];
  const v = new URLSearchParams(location.search).get("v") === "b" ? "B" : "A";
  document.body.className = v;
  document.getElementById(v === "A" ? "va" : "vb").classList.add("on");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const phone = () => innerWidth / innerHeight < .9;
  const html = S.map(([img, fx, t]) => `<section class="scene" style="--fx:${fx}"><img class="art" src="assets/${img}.webp" alt=""><div class="veil"></div><div class="text">${t}</div></section>`).join("");
  const root = document.getElementById("root");
  root.innerHTML = v === "A" ? `<div class="stage">${html}</div><div style="height:${S.length * 100}vh"></div>` : html;
  const scenes = [...document.querySelectorAll(".scene")];
  document.getElementById("dots").innerHTML = S.map(() => "<i></i>").join("");
  const dots = [...document.querySelectorAll(".dots i")];
  const fit = () => scenes.forEach((s) => (s.querySelector(".art").style.objectPosition = `${phone() ? s.style.getPropertyValue("--fx") : "50%"} 60%`));

  function frame() {
    const H = innerHeight;
    if (v === "A") {
      // Progress in scenes: 0 → first scene, 1 → second, … Each change washes in over the last.
      const p = Math.min(S.length - 1, Math.max(0, scrollY / H)), i = Math.floor(p), f = p - i;
      scenes.forEach((s, k) => {
        let o = k < i ? 0 : k === i ? 1 : k === i + 1 ? f : 0;
        if (k === i + 1) {
          // watercolour wash: a soft circle growing from the object area
          const r = (still ? 1 : f) * 160;
          s.style.webkitMaskImage = s.style.maskImage = `radial-gradient(circle at 50% 65%, #000 ${r - 30}%, transparent ${r}%)`;
          o = 1;
        } else { s.style.webkitMaskImage = s.style.maskImage = "none"; }
        if (k === i + 1 && f < .02) o = 0;
        s.style.opacity = o; s.style.zIndex = k;
        s.querySelector(".art").style.setProperty("--z", (1.08 - .06 * (k === i ? f : 0)).toFixed(4));
        s.classList.toggle("read", (k === i && f < .45) || (k === i + 1 && f > .7));
      });
      dots.forEach((d, k) => d.classList.toggle("on", k === Math.round(p)));
    } else {
      scenes.forEach((s, k) => {
        const r = s.getBoundingClientRect();
        if (r.bottom > -H && r.top < 2 * H) s.querySelector(".art").style.transform = still ? "" : `translate3d(0, ${(-r.top * .22).toFixed(1)}px, 0)`;
        if (r.top < H * .55) s.classList.add("read");
        dots[k].classList.toggle("on", r.top <= H * .5 && r.bottom > H * .5);
      });
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", fit); fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
