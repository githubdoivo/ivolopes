<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B · Four rooms</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=VT323&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="_shared.css">
<style>
body { background: #000; color: #fff; font: 16px var(--sans); min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; }
.top h1 { font: 600 18px var(--sans); letter-spacing: .02em; }
.top a { font: 13px var(--mono); color: #aaa; }
.rooms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.room { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; min-height: 60vh; transition: flex .4s; }
.room h2 { font-size: clamp(34px, 4vw, 56px); line-height: 1; }
.room p { margin-top: 8px; font-size: 14px; opacity: .8; }
.room .scene { position: absolute; inset: 0; }
.qa { background: #0b0d10; color: var(--qa); }
.qa .scene { font: 13px/1.7 var(--mono); padding: 70px 24px; color: #c9d3dd; }
.qa .scene b { color: var(--qa); font-weight: 400; }
.qa h2 { font-family: var(--display); font-weight: 700; }
.art { background: #f3ece4; color: #2a211b; }
.art .scene::after { content: ""; position: absolute; left: 50%; top: 30%; width: 120px; height: 150px; transform: translateX(-50%); background: #3f9089; border: 4px solid #2a1d16; border-radius: 40% 40% 46% 46% / 30% 30% 62% 62%; box-shadow: 0 30px 40px -20px rgba(0,0,0,.35); }
.art .scene::before { content: ""; position: absolute; left: 50%; top: calc(30% - 18px); width: 54px; height: 26px; transform: translateX(-50%); background: #3f9089; border: 4px solid #2a1d16; border-bottom: 0; border-radius: 6px 6px 0 0; z-index: 1; }
.art h2 { font-family: var(--serif); font-style: italic; font-weight: 400; color: #9a4520; }
.moss { background: #000; color: var(--moss); }
.moss .scene { background: radial-gradient(circle at 50% 38%, #2c6e31 0 16%, #173f1f 26%, transparent 42%), radial-gradient(circle at 50% 38%, #f4f6ee 0 7%, transparent 8%); }
.moss .scene::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.35) 2px 3px); }
.moss h2 { font-family: var(--crt); font-weight: 400; letter-spacing: .1em; text-shadow: 0 0 14px rgba(156,245,154,.5); }
.stage { background: #120d06; color: var(--stage); }
.stage .scene { background: radial-gradient(ellipse 40% 60% at 50% 0%, rgba(242,210,122,.45), transparent 70%); }
.stage h2 { font-family: var(--display); font-weight: 500; }
.stage.soon { opacity: 1; } .stage.soon h2, .stage.soon p { opacity: .6; }
.foot { padding: 14px 24px; font: 12px var(--mono); color: #777; text-align: center; }
@media (max-width: 760px) { .rooms { grid-template-columns: 1fr 1fr; } .room { min-height: 38vh; } }
</style></head><body>
<div class="top"><h1>Ivo Lopes</h1><a href="mailto:mail@ivolopes.com">mail@ivolopes.com</a></div>
<div class="rooms">
  <a class="room qa" href="https://qa.ivolopes.com"><div class="scene">$ npx playwright test<br><b>✓</b> automation › 140+ scenarios<br><b>✓</b> sit › 300+ scenarios<br><b>✓</b> release › defects caught<br><b>6 passed</b></div><h2>QA</h2><p>quality engineering · CV</p></a>
  <a class="room art" href="https://art.ivolopes.com"><div class="scene"></div><h2>Art</h2><p>ceramics, built by hand</p></a>
  <a class="room moss" href="https://moss.ivolopes.com"><div class="scene"></div><h2>MOSS</h2><p>dj · producer</p></a>
  <div class="room stage soon"><div class="scene"></div><h2>Stage</h2><p>dance · acting · soon</p></div>
</div>
<div class="foot">Porto</div>
</body></html>
