<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>C · Orbit</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=VT323&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="_shared.css">
<style>
body { background: radial-gradient(circle at 50% 50%, #17151a, #08070a 70%); color: #eee; font: 15px var(--sans); min-height: 100vh; overflow: hidden; }
.sky { position: fixed; inset: 0; display: grid; place-items: center; }
.ring { position: absolute; width: min(78vmin, 640px); aspect-ratio: 1; border: 1px dashed rgba(255,255,255,.14); border-radius: 50%; animation: turn 80s linear infinite; }
.center { position: relative; text-align: center; z-index: 2; }
.center h1 { font: 400 clamp(40px, 7vw, 76px)/1 var(--serif); }
.center a { display: inline-block; margin-top: 12px; font: 13px var(--mono); color: #999; }
.node { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px; border-radius: 50%; display: grid; place-items: center; text-align: center; border: 1px solid; backdrop-filter: blur(6px); animation: counter 80s linear infinite; }
.node b { display: block; font-size: 28px; line-height: 1; }
.node small { display: block; margin-top: 6px; font-size: 11px; opacity: .8; letter-spacing: .04em; }
.qa { transform: rotate(-45deg) translateX(min(39vmin, 320px)) rotate(45deg); color: var(--qa); background: rgba(61,220,151,.07); }
.qa b { font-family: var(--display); font-weight: 700; }
.art { transform: rotate(45deg) translateX(min(39vmin, 320px)) rotate(-45deg); color: #e08a5c; background: rgba(196,106,60,.08); }
.art b { font-family: var(--serif); font-style: italic; font-weight: 400; }
.moss { transform: rotate(135deg) translateX(min(39vmin, 320px)) rotate(-135deg); color: var(--moss); background: rgba(156,245,154,.06); }
.moss b { font-family: var(--crt); font-weight: 400; letter-spacing: .1em; text-shadow: 0 0 12px rgba(156,245,154,.5); }
.stage { transform: rotate(225deg) translateX(min(39vmin, 320px)) rotate(-225deg); color: var(--stage); background: rgba(242,210,122,.06); }
.stage b { font-family: var(--display); font-weight: 500; }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes counter { to { filter: none; } }
</style></head><body>
<div class="sky">
  <div class="ring"></div>
  <a class="node qa" href="https://qa.ivolopes.com"><span><b>QA</b><small>quality · CV</small></span></a>
  <a class="node art" href="https://art.ivolopes.com"><span><b>Art</b><small>ceramics</small></span></a>
  <a class="node moss" href="https://moss.ivolopes.com"><span><b>MOSS</b><small>dj · producer</small></span></a>
  <div class="node stage soon"><span><b>Stage</b><small>soon</small></span></div>
  <div class="center"><h1>Ivo Lopes</h1><a href="mailto:mail@ivolopes.com">mail@ivolopes.com</a></div>
</div>
</body></html>
