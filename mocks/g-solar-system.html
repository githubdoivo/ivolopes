<style>
  :root { --ink: #ece8f4; --muted: #8e8aa6; --faint: #6a6680; --bg: #020308; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 12px/1.4 "JetBrains Mono", ui-monospace, monospace; overflow: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #scene.dragging { cursor: grabbing; }
  #scene.pointing { cursor: pointer; }

  /* Labels and their leader lines, positioned every frame from the 3D scene. */
  #overlay { position: fixed; inset: 0; pointer-events: none; transition: opacity .5s; }
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #leaders path { fill: none; stroke-width: 1; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; text-shadow: 0 0 2px #020308, 0 0 10px #020308, 0 0 18px #020308; will-change: transform; opacity: 0; transition: opacity .6s; }
  .tag.left { text-align: right; }
  .tag.mid { text-align: center; }
  .world { pointer-events: auto; display: block; line-height: 1; padding: 6px 0; }
  .world b { display: block; font-weight: 400; font-size: 30px; }
  .world small { display: block; margin-top: 7px; font: 10px/1.2 "JetBrains Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .world .go { display: inline-block; margin-left: 8px; opacity: 0; transform: translateX(-4px); transition: opacity .25s, transform .25s; color: var(--ink); }
  .world.hot .go { opacity: 1; transform: none; }
  .minor { font: 10px "JetBrains Mono", monospace; color: var(--faint); letter-spacing: .14em; }

  /* Each world keeps the type of its own site. */
  .qa b { font-family: "Space Grotesk", sans-serif; font-weight: 700; color: #3ddc97; letter-spacing: -.02em; }
  .art b { font-family: "Fraunces", serif; font-style: italic; color: #ec9a68; }
  .moss b { font-family: "VT323", monospace; font-size: 36px; color: #9cf59a; letter-spacing: .14em; text-shadow: 0 0 12px rgba(156, 245, 154, .55), 0 0 2px #020308; }
  .stage b { font-family: "Italiana", serif; color: #f2d27a; letter-spacing: .08em; }

  /* The sun carries the name. */
  .sun-name { position: fixed; left: 0; top: 0; pointer-events: none; text-align: center; will-change: transform;
    font: 600 30px/.92 "Fraunces", serif; letter-spacing: -.01em; color: #2a0f00; opacity: 0; transition: opacity 1s; }

  .tl { left: 24px; top: 20px; } .tr { right: 24px; top: 20px; text-align: right; }

  .legend a:hover, .legend a:focus-visible { opacity: 1; }
  .legend b { font-weight: 400; font-size: 17px; }
  .legend .moss b { font-size: 20px; }
  .legend i { font-style: normal; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  #veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: var(--bg); z-index: 3; }

  @media (max-width: 760px), (max-aspect-ratio: 4/5) {

    .world small { display: none; }

    .tl { left: 16px; top: 14px; } .tr { right: 16px; top: 14px; }

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const query = new URLSearchParams(location.search);
const frozenAt = query.has("t") ? Number(query.get("t")) : null; // fixed moment, for screenshots

/* ---------- Noise shared by every shader (Ashima simplex 3D) ---------- */
const NOISE = /* glsl */ `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*snoise(p);p*=2.03;a*=0.5;}return s;}
`;

/* ---------- The system ---------- */
// Distances and sizes are compressed so everything fits on one screen; the
// order, the look and the relative speeds (Kepler) are the real ones.
const BODIES = [
  { id: "mercury", R: 7.2, size: 0.5, type: 0, a: "#7d736a", b: "#b9afa4", c: "#4f4842", phase: 0.7 },
  { id: "venus", R: 9.9, size: 0.95, type: 4, a: "#c39a5e", b: "#f1ddb0", atm: "#f6d9a0", phase: 2.6 },
  { id: "qa", name: "earth", R: 13, size: 1.05, type: 2, atm: "#5aa2ff", tilt: 0.41, moon: true, phase: 5.6,
    title: "QA", sub: "earth · quality engineering", href: "https://qa.ivolopes.com", color: "#3ddc97" },
  { id: "art", name: "mars", R: 16.4, size: 0.8, type: 0, a: "#8e3517", b: "#d4703a", c: "#f2b27c", atm: "#e79a6a", tilt: 0.44, phase: 3.5,
    title: "Art", sub: "mars · hand-built ceramics", href: "https://art.ivolopes.com", color: "#ec9a68" },
  { id: "jupiter", R: 25, size: 2.6, type: 1, a: "#b48a66", b: "#efe1c6", c: "#7d5236", spot: true, tilt: 0.05, phase: 1.15 },
  { id: "stage", name: "saturn", R: 31.5, size: 2.1, type: 1, a: "#c8a46a", b: "#f2e3b8", c: "#9c7a48", tilt: 0.47, phase: 4.45,
    ring: { inner: 1.3, outer: 2.25, color: "#e7d2a2", alpha: 0.9 },
    title: "Stage", sub: "saturn · dance & acting", soon: true, color: "#f2d27a" },
  { id: "moss", name: "uranus", R: 38, size: 1.5, type: 3, a: "#73cfc6", b: "#b9f2e6", atm: "#9cf5dc", tilt: 1.71, phase: 2.05,
    ring: { inner: 1.55, outer: 1.68, color: "#cfeee8", alpha: 0.35 },
    title: "MOSS", sub: "uranus · dj & producer", href: "https://moss.ivolopes.com", color: "#9cf59a" },
  { id: "neptune", R: 43.5, size: 1.45, type: 3, a: "#2448c4", b: "#5b86f2", atm: "#6f8cff", tilt: 0.49, phase: 0.25 },
  { id: "pluto", R: 48, size: 0.35, type: 0, a: "#8f7f70", b: "#e8d8c4", c: "#5f5248", ecc: 0.2, inc: 0.3, dashed: true, phase: 3.05 },
];
const SUN_R = 4;
const ORBIT_K = 3.3; // angular speed = K / R^1.5 (about 90 s for one Earth year)

/* ---------- Renderer ---------- */
const canvas = document.getElementById("scene");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
} catch {
  document.body.classList.add("no-gl");
  throw new Error("WebGL unavailable; showing the plain list.");
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 2000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.45, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const clock = { t: frozenAt ?? 0, intro: frozenAt != null || still ? 1 : 0 };
const shared = { uTime: { value: clock.t } };

/* ---------- Sky: stars, a faint Milky Way band ---------- */
const sky = new THREE.Group();
scene.add(sky);
{
  const N = 5200, pos = [], col = [], size = [], phase = [];
  const band = new THREE.Vector3(0.3, 1, 0.2).normalize(); // the galaxy's pole
  const tint = [new THREE.Color("#ffd9b0"), new THREE.Color("#ffffff"), new THREE.Color("#c9d8ff"), new THREE.Color("#a9c1ff")];
  for (let i = 0; i < N; i++) {
    let v = new THREE.Vector3().randomDirection();
    const inBand = i < N * 0.55;
    if (inBand) { // squash towards the galactic plane
      const d = v.dot(band);
      v.addScaledVector(band, -d * (1 - Math.pow(Math.random(), 3) * 0.6)).normalize();
    }
    v.multiplyScalar(600);
    pos.push(v.x, v.y, v.z);
    const c = tint[Math.floor(Math.random() * tint.length)].clone().multiplyScalar(inBand ? 0.35 + Math.random() * 0.3 : 0.5 + Math.random() * 0.6);
    col.push(c.r, c.g, c.b);
    size.push(inBand ? 0.8 + Math.random() * 1.2 : 0.9 + Math.pow(Math.random(), 6) * 3.2);
    phase.push(Math.random() * 6.28);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("aColor", new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute("aSize", new THREE.Float32BufferAttribute(size, 1));
  g.setAttribute("aPhase", new THREE.Float32BufferAttribute(phase, 1));
  sky.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { ...shared, uPR: { value: 1 } },
    vertexShader: `attribute vec3 aColor; attribute float aSize, aPhase; uniform float uTime, uPR; varying vec3 vC;
      void main(){ vC = aColor * (0.7 + 0.3 * sin(uTime * (0.6 + aPhase * 0.2) + aPhase));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uPR; }`,
    fragmentShader: `varying vec3 vC; void main(){ vec2 q = gl_PointCoord * 2.0 - 1.0; float d = dot(q, q); if (d > 1.0) discard;
      gl_FragColor = vec4(vC * (1.0 - d) * (1.0 - d), 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  })));
}

/* ---------- The sun ---------- */
const sunMat = new THREE.ShaderMaterial({
  uniforms: shared,
  vertexShader: `varying vec3 vP, vN, vV; void main(){ vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vN = normalMatrix * normal; vV = -mv.xyz; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uTime; varying vec3 vP, vN, vV; ${NOISE}
    void main(){
      vec3 p = normalize(vP);
      float n = fbm(p * 2.6 + vec3(0.0, uTime * 0.04, uTime * 0.025));
      float g = snoise(p * 22.0 + uTime * 0.15) * 0.5 + snoise(p * 44.0 - uTime * 0.1) * 0.25;
      float t = clamp(0.58 + n * 0.55 + g * 0.18, 0.0, 1.0);
      vec3 c = mix(vec3(0.9, 0.22, 0.02), vec3(1.0, 0.55, 0.12), t);
      c = mix(c, vec3(1.0, 0.86, 0.55), smoothstep(0.72, 1.0, t));
      float mu = max(dot(normalize(vN), normalize(vV)), 0.0);
      c *= 0.5 + 0.5 * pow(mu, 0.45);          // limb darkening
      gl_FragColor = vec4(c * 1.9, 1.0);
    }`,
});
const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 96, 96), sunMat);
scene.add(sun);
// The corona: a camera-facing disc of soft, slowly turning rays.
const corona = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  uniforms: shared,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uTime; varying vec2 vUv; ${NOISE}
    void main(){
      vec2 q = vUv * 2.0 - 1.0; float r = length(q); float a = atan(q.y, q.x);
      float core = 0.2;
      float fall = exp(-max(r - core, 0.0) * 7.0);
      float rays = fbm(vec3(cos(a) * 2.5, sin(a) * 2.5, uTime * 0.05)) * 0.5 + 0.5;
      float streak = snoise(vec3(cos(a) * 9.0, sin(a) * 9.0, r * 2.0 - uTime * 0.12)) * 0.5 + 0.5;
      float glow = fall * (0.55 + 0.6 * rays * smoothstep(0.0, 0.5, r - core + 0.25)) + exp(-max(r - core, 0.0) * 18.0) * streak * 0.4;
      glow *= smoothstep(1.0, 0.6, r);
      vec3 col = mix(vec3(1.0, 0.36, 0.06), vec3(1.0, 0.78, 0.42), fall);
      gl_FragColor = vec4(col * glow * 0.9, 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
}));
corona.scale.setScalar(SUN_R / 0.2 * 2);
scene.add(corona);

/* ---------- Planets ---------- */
const PLANET_VS = `varying vec3 vObj, vWorld, vN; void main(){ vObj = position; vec4 w = modelMatrix * vec4(position, 1.0);
  vWorld = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }`;
const PLANET_FS = `uniform float uTime, uType, uSeed, uDim, uHover, uSpot; uniform vec3 uA, uB, uC, uAtm; varying vec3 vObj, vWorld, vN; ${NOISE}
  void main(){
    vec3 p = normalize(vObj); vec3 col; float wet = 0.0;
    if (uType < 0.5) {                 // rock: mottled plains, dark maria, bright dust
      float n = fbm(p * 2.4 + uSeed); float c = fbm(p * 7.0 + uSeed * 1.7);
      col = mix(uA, uB, smoothstep(-0.45, 0.45, n));
      col = mix(col, uC, smoothstep(0.15, 0.6, c) * 0.55);
      col = mix(col, vec3(0.95, 0.93, 0.9), smoothstep(0.86, 0.95, abs(p.y)) * step(0.5, uSpot));
    } else if (uType < 1.5) {          // gas giant: turbulent bands
      float warp = fbm(p * vec3(1.5, 5.0, 1.5) + uSeed) * 0.16;
      float lat = p.y + warp;
      col = mix(uA, uB, sin(lat * 16.0 + uSeed) * 0.5 + 0.5);
      col = mix(col, uC, pow(sin(lat * 37.0) * 0.5 + 0.5, 3.0) * 0.45);
      if (uSpot > 0.5) {
        vec2 d = vec2(atan(p.z, p.x) - 0.9, (p.y + 0.36) * 2.6);
        float s = smoothstep(0.3, 0.1, length(d) + fbm(p * 8.0) * 0.06);
        col = mix(col, vec3(0.78, 0.33, 0.17), s * 0.85);
      }
    } else if (uType < 2.5) {          // earth: oceans, land, ice, clouds
      float n = fbm(p * 1.9 + uSeed);
      float land = smoothstep(0.04, 0.1, n);
      vec3 ocean = mix(vec3(0.01, 0.05, 0.18), vec3(0.03, 0.2, 0.45), smoothstep(-0.5, 0.06, n));
      vec3 ground = mix(vec3(0.12, 0.28, 0.08), vec3(0.5, 0.4, 0.22), smoothstep(0.1, 0.5, fbm(p * 4.0 + 3.0)));
      col = mix(ocean, ground, land);
      col = mix(col, vec3(0.92, 0.95, 1.0), smoothstep(0.8, 0.88, abs(p.y) + n * 0.08));
      float cl = smoothstep(0.08, 0.55, fbm(p * 3.4 + vec3(uTime * 0.015, 0.0, 0.0) + 9.0));
      col = mix(col, vec3(1.0), cl * 0.8);
      wet = (1.0 - land) * (1.0 - cl);
    } else if (uType < 3.5) {          // ice giant: smooth, faint bands
      float lat = p.y + fbm(p * 2.5 + uSeed) * 0.05;
      col = mix(uA, uB, smoothstep(-1.1, 1.1, lat)) * (1.0 + 0.05 * sin(lat * 22.0));
    } else {                           // venus: thick sulphur haze
      float n = fbm(p * vec3(1.6, 3.5, 1.6) + vec3(uTime * 0.008, 0.0, 0.0) + uSeed);
      col = mix(uA, uB, n * 0.6 + 0.5);
    }
    vec3 N = normalize(vN), L = normalize(-vWorld), V = normalize(cameraPosition - vWorld);
    float nl = dot(N, L);
    vec3 lit = col * (0.05 + 1.2 * smoothstep(-0.12, 1.0, nl));
    lit += wet * pow(max(dot(N, normalize(L + V)), 0.0), 60.0) * 0.6 * step(0.0, nl);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);
    lit += uAtm * rim * smoothstep(-0.25, 0.6, nl) * 0.9;
    float lum = dot(lit, vec3(0.3, 0.59, 0.11));
    lit = mix(lit, vec3(lum) * vec3(0.78, 0.8, 0.92), uDim * 0.7) * (1.0 - uDim * 0.45);
    lit *= 1.0 + uHover * 0.35;
    gl_FragColor = vec4(lit, 1.0);
  }`;
const RING_VS = `uniform float uIn, uOut; varying float vR; varying vec3 vWorld; void main(){
  vR = (length(position.xy) - uIn) / (uOut - uIn); vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz;
  gl_Position = projectionMatrix * viewMatrix * w; }`;
const RING_FS = `uniform vec3 uColor, uCenter; uniform float uAlpha, uRad, uSeed, uDim; varying float vR; varying vec3 vWorld; ${NOISE}
  void main(){
    float bands = 0.55 + 0.45 * snoise(vec3(vR * 34.0, uSeed, 0.0)) * 0.8 + 0.2 * snoise(vec3(vR * 110.0, uSeed, 1.0));
    float gap = smoothstep(0.55, 0.57, vR) * (1.0 - smoothstep(0.62, 0.64, vR));
    float a = smoothstep(0.0, 0.06, vR) * (1.0 - smoothstep(0.94, 1.0, vR)) * bands * (1.0 - gap * 0.92) * uAlpha;
    vec3 L = normalize(-vWorld); vec3 toC = uCenter - vWorld; float t = dot(toC, L);
    float shadow = (t > 0.0 && length(toC - L * t) < uRad) ? 0.12 : 1.0;   // the planet's shadow on its ring
    vec3 col = uColor * (0.55 + 0.45 * bands) * shadow * (1.0 - uDim * 0.45);
    gl_FragColor = vec4(col, a);

// A slowly turning reticle marks the worlds you can visit.
const BEACON_FS = `uniform vec3 uColor; uniform float uTime, uHover, uSoon, uFade; varying vec2 vUv;
  void main(){
    vec2 q = vUv * 2.0 - 1.0; float r = length(q); float a = atan(q.y, q.x) / 6.2831853;
    float R = mix(0.8, 0.72, uHover);
    float line = smoothstep(0.022, 0.0, abs(r - R));
    float arcs = uSoon > 0.5 ? step(0.55, fract(a * 36.0)) : mix(step(0.42, fract(a * 4.0 + uTime * 0.04)), 1.0, uHover);
    float ticks = smoothstep(0.012, 0.0, abs(r - R - 0.08)) * step(0.93, fract(a * 4.0 + 0.125 + uTime * 0.04)) * (1.0 - uSoon);
    float p = fract(uTime * 0.3); float pulse = smoothstep(0.02, 0.0, abs(r - mix(R, 1.0, p))) * (1.0 - p) * (1.0 - uSoon);
    float alpha = (line * arcs * mix(0.6, 1.0, uHover) * (uSoon > 0.5 ? 0.5 : 1.0) + ticks * 0.8 + pulse * 0.35) * uFade;
    gl_FragColor = vec4(uColor * alpha * 1.15, 1.0);
  }`;
const ORBIT_VS = `attribute float aAng; varying float vA; void main(){ vA = aAng; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const ORBIT_FS = `uniform vec3 uColor; uniform float uAng, uBase, uTrail, uDash, uFade; varying float vA;
  void main(){
    float behind = mod(uAng - vA, 6.2831853);
    float a = uBase + uTrail * exp(-behind * 1.4);
    if (uDash > 0.0 && fract(vA * uDash / 6.2831853) > 0.5) a *= 0.15;
    gl_FragColor = vec4(uColor * a * uFade, 1.0);
  }`;

const sphere = new THREE.SphereGeometry(1, 72, 72);
const color = (hex) => new THREE.Color(hex || "#000000");
const tmp = new THREE.Vector3();

function orbitPoint(b, ang, out) {
  const e = b.ecc || 0, inc = b.inc || 0, r = (b.R * (1 - e * e)) / (1 + e * Math.cos(ang));
  return out.set(Math.cos(ang) * r, Math.sin(ang) * r * Math.sin(inc), -Math.sin(ang) * r * Math.cos(inc));
}

const overlay = document.getElementById("overlay");
const leaders = document.getElementById("leaders");
const SVG = "http://www.w3.org/2000/svg";

BODIES.forEach((b, i) => {
  b.active = !!b.title;
  b.live = b.active && !b.soon;
  b.seed = i * 7.31 + 1.3;
  b.hover = 0; b.hoverTarget = 0;
  b.speed = ORBIT_K / Math.pow(b.R, 1.5);

  // Orbit
  const pts = [], angs = [];
  for (let k = 0; k <= 360; k++) { const a = (k / 360) * Math.PI * 2; pts.push(orbitPoint(b, a, new THREE.Vector3())); angs.push(a); }
  const og = new THREE.BufferGeometry().setFromPoints(pts);
  og.setAttribute("aAng", new THREE.Float32BufferAttribute(angs, 1));
  b.orbit = new THREE.Line(og, new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: color(b.active ? b.color : "#b8b4cc") }, uAng: { value: 0 }, uFade: { value: 0 },
      uBase: { value: b.live ? 0.22 : b.active ? 0.16 : 0.07 }, uTrail: { value: b.live ? 0.75 : b.active ? 0.35 : 0.16 },
      uDash: { value: b.dashed ? 140 : b.soon ? 220 : 0 },
    },
    vertexShader: ORBIT_VS, fragmentShader: ORBIT_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  scene.add(b.orbit);

  // Body: pivot (orbit position) > tilt (axis) > mesh (spin)
  b.pivot = new THREE.Group();
  b.tiltGroup = new THREE.Group();
  b.tiltGroup.rotation.z = b.tilt || 0;
  b.pivot.add(b.tiltGroup);
  scene.add(b.pivot);
  b.mat = new THREE.ShaderMaterial({
    uniforms: {
      ...shared, uType: { value: b.type }, uSeed: { value: b.seed }, uDim: { value: b.active ? 0 : 0.62 }, uHover: { value: 0 },
      uSpot: { value: b.spot || b.id === "art" ? 1 : 0 }, uA: { value: color(b.a) }, uB: { value: color(b.b) }, uC: { value: color(b.c) },
      uAtm: { value: color(b.atm).multiplyScalar(b.active ? 1 : 0.5) },
    },
    vertexShader: PLANET_VS, fragmentShader: PLANET_FS,
  });
  b.mesh = new THREE.Mesh(sphere, b.mat);
  b.mesh.scale.setScalar(b.size);
  b.tiltGroup.add(b.mesh);

  if (b.ring) {
    const rin = b.ring.inner * b.size, rout = b.ring.outer * b.size;
    b.ringMat = new THREE.ShaderMaterial({
      uniforms: {
        uIn: { value: rin }, uOut: { value: rout }, uColor: { value: color(b.ring.color) }, uAlpha: { value: b.ring.alpha },
        uCenter: { value: new THREE.Vector3() }, uRad: { value: b.size }, uSeed: { value: b.seed }, uDim: { value: 0 },
      },
      vertexShader: RING_VS, fragmentShader: RING_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    });
    const ring = new THREE.Mesh(new THREE.RingGeometry(rin, rout, 160, 1), b.ringMat);
    ring.rotation.x = -Math.PI / 2;
    b.tiltGroup.add(ring);
  }
  if (b.moon) {
    b.moonPivot = new THREE.Group();
    const moon = new THREE.Mesh(sphere, new THREE.ShaderMaterial({
      uniforms: { ...shared, uType: { value: 0 }, uSeed: { value: 4.2 }, uDim: { value: 0 }, uHover: { value: 0 }, uSpot: { value: 0 },
        uA: { value: color("#6d6a66") }, uB: { value: color("#c9c5be") }, uC: { value: color("#4a4744") }, uAtm: { value: color() } },
      vertexShader: PLANET_VS, fragmentShader: PLANET_FS,
    }));
    moon.scale.setScalar(0.27);
    moon.position.set(b.size * 2.1, 0.15, 0);
    b.moonPivot.add(moon);
    b.pivot.add(b.moonPivot);
  }
  if (b.active) {
    b.reach = b.size * (b.ring && b.ring.outer > 2 ? b.ring.outer + 0.35 : 1.9);
    const h = b.reach / 0.8;
    b.beacon = new THREE.Mesh(new THREE.PlaneGeometry(2 * h, 2 * h), new THREE.ShaderMaterial({
      uniforms: { ...shared, uColor: { value: color(b.color) }, uHover: { value: 0 }, uSoon: { value: b.soon ? 1 : 0 }, uFade: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: BEACON_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    b.pivot.add(b.beacon);
  } else {
    b.reach = b.size * (b.ring ? b.ring.outer : 1.2);
  }

  // Label
  if (b.active) {
    const el = document.createElement(b.live ? "a" : "div");
    el.className = `tag world ${b.id}`;
    el.innerHTML = `<b>${b.title}${b.live ? '<span class="go">→</span>' : ""}</b><small>${b.sub}${b.soon ? " <em>soon</em>" : ""}</small>`;
    if (b.live) { el.href = b.href; el.tabIndex = -1; }
    el.addEventListener("pointerenter", () => setHover(b));
    el.addEventListener("pointerleave", () => setHover(null));
    if (b.live) el.addEventListener("click", (e) => { if (!e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) { e.preventDefault(); fly(b); } });
    b.el = el;
    b.path = document.createElementNS(SVG, "path");
    b.path.setAttribute("stroke", b.color);
    leaders.appendChild(b.path);
  } else {
    b.el = document.createElement("div");
    b.el.className = "tag minor";
    b.el.textContent = b.id;
  }
  overlay.appendChild(b.el);
});

/* ---------- Belts ---------- */
function belt(n, r0, r1, thick, tint, alpha) {
  const pos = [], sz = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = r0 + (r1 - r0) * Math.pow(Math.random(), 0.8);
    pos.push(Math.cos(a) * r, (Math.random() - 0.5) * thick, Math.sin(a) * r);
    sz.push(0.5 + Math.pow(Math.random(), 4) * 1.8);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("aSize", new THREE.Float32BufferAttribute(sz, 1));
  const pts = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { uColor: { value: color(tint) }, uAlpha: { value: alpha }, uPR: { value: 1 }, uFade: { value: 0 } },
    vertexShader: `attribute float aSize; uniform float uPR; varying float vL; void main(){
      vec4 w = modelMatrix * vec4(position, 1.0); vL = 0.35 + 0.65 * smoothstep(-1.0, 1.0, dot(normalize(-w.xyz), normalize(cameraPosition - w.xyz)) * -1.0 + 0.3);
      gl_Position = projectionMatrix * viewMatrix * w; gl_PointSize = aSize * uPR; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uAlpha, uFade; varying float vL; void main(){
      vec2 q = gl_PointCoord * 2.0 - 1.0; float d = dot(q, q); if (d > 1.0) discard;
      gl_FragColor = vec4(uColor * vL * (1.0 - d) * uAlpha * uFade, 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  scene.add(pts);
  return pts;
}
const asteroids = belt(2600, 19.2, 22, 0.7, "#c9b79f", 0.75);
const kuiper = belt(3200, 50, 60, 3, "#9fb2d6", 0.32);

/* ---------- Camera ---------- */
const view = { yaw: 0.35, elev: 0.5, roll: 0, dist: 120, fit: 1, scale: 1, dragging: false };
function fitCamera() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  const tall = aspect < 0.8;
  view.roll = tall ? Math.PI / 2 : 0;          // on tall screens the system runs top to bottom
  view.baseElev = tall ? 0.42 : 0.5;
  view.scale = tall ? 1.4 : aspect < 1.2 ? 1.15 : 1;  // bigger bodies on small screens
  const R = tall ? 43 : 47, tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const major = R * 1.06, minor = R * Math.sin(view.baseElev) * 1.4;
  view.fit = tall ? Math.max(major / tan, minor / (tan * aspect)) : Math.max(major / (tan * aspect), minor / tan);
  sun.scale.setScalar(tall ? 1.3 : 1);
  corona.scale.setScalar(((SUN_R * (tall ? 1.3 : 1)) / 0.2) * 2);
  for (const b of BODIES) { b.tiltGroup.scale.setScalar(view.scale); if (b.beacon) b.beacon.scale.setScalar(view.scale); if (b.moonPivot) b.moonPivot.scale.setScalar(view.scale); }
}
function resize() {
  const pr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setPixelRatio(Math.min(pr, 1.5));
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  fitCamera();
  const dots = pr * (view.roll ? 0.55 : innerWidth < 1100 ? 0.8 : 1);
  scene.traverse((o) => { if (o.material?.uniforms?.uPR) o.material.uniforms.uPR.value = dots; });
  measure();
  if (view.elev == null || !view.touched) view.elev = view.baseElev;
}

/* ---------- Pointer: drag to orbit, hover and click the lit worlds ---------- */
let hovered = null, flying = null;
const pointer = { x: -1, y: -1, down: false, sx: 0, sy: 0, lx: 0, ly: 0, moved: false };
function setHover(b) {
  hovered = b;
  for (const o of BODIES) if (o.active) o.hoverTarget = o === b ? 1 : 0;
  for (const o of BODIES) if (o.el) o.el.classList.toggle("hot", o === b);
  canvas.classList.toggle("pointing", !!(b && b.live) && !pointer.down);
}
function pick(x, y) {
  let best = null, bestD = Infinity;
  for (const b of BODIES) {
    if (!b.active || !b.screen) continue;
    const d = Math.hypot(x - b.screen.x, y - b.screen.y);
    if (d < Math.max(b.screen.reach + 10, 28) && d < bestD) { best = b; bestD = d; }
  }
  return best;
}
canvas.addEventListener("pointerdown", (e) => {
  Object.assign(pointer, { down: true, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false });
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (pointer.down) {
    const dx = e.clientX - pointer.lx, dy = e.clientY - pointer.ly;
    pointer.lx = e.clientX; pointer.ly = e.clientY;
    if (Math.hypot(e.clientX - pointer.sx, e.clientY - pointer.sy) > 6) { pointer.moved = true; canvas.classList.add("dragging"); }
    if (pointer.moved) {
      const [h, v] = view.roll ? [dy, -dx] : [dx, dy];
      view.yaw -= h * 0.005;
      view.elev = THREE.MathUtils.clamp(view.elev + v * 0.004, 0.12, 1.35);
      view.touched = true;
    }
  } else if (e.pointerType === "mouse") {
    setHover(pick(e.clientX, e.clientY));
  }
});
canvas.addEventListener("pointerup", (e) => {
  pointer.down = false;
  canvas.classList.remove("dragging");
  if (!pointer.moved) {
    const b = pick(e.clientX, e.clientY);
    if (b && b.live) fly(b);
    else if (b) setHover(b);   // tapping Stage just lights it up
  }
});
canvas.addEventListener("pointerleave", () => { if (!pointer.down) setHover(null); });
for (const a of document.querySelectorAll(".legend [data-world]")) {
  const b = BODIES.find((o) => o.id === a.dataset.world);
  a.addEventListener("pointerenter", () => setHover(b));
  a.addEventListener("pointerleave", () => setHover(null));
  a.addEventListener("focus", () => setHover(b));
  a.addEventListener("blur", () => setHover(null));
  if (b.live) a.addEventListener("click", (e) => { if (!e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) { e.preventDefault(); fly(b); } });
}

// Clicking a world flies the camera to it, then opens its site.
const veil = document.getElementById("veil");
function fly(b) {
  if (flying) return;
  if (still) { location.href = b.href; return; }
  setHover(b);
  flying = { b, t: 0, from: camera.position.clone(), look: new THREE.Vector3() };
  veil.style.background = `radial-gradient(circle at 50% 50%, ${b.color}33, #020308 70%)`;
}
addEventListener("pageshow", (e) => { if (e.persisted) { flying = null; veil.style.opacity = 0; overlay.style.opacity = 1; } });

/* ---------- Labels ---------- */
const sunName = document.getElementById("sun-name");
function measure() {
  for (const b of BODIES) { b.w = b.el.offsetWidth; b.h = b.el.offsetHeight; }
}
document.fonts?.ready.then(measure);

const camRight = new THREE.Vector3();
function toScreen(v) {
  tmp.copy(v).project(camera);
  return { x: (tmp.x * 0.5 + 0.5) * innerWidth, y: (-tmp.y * 0.5 + 0.5) * innerHeight, z: tmp.z };
}
// Each label tries eight spots around its world and takes the clearest one:
// off the other labels, off every planet and the sun, inside the screen, and
// preferably pointing away from the sun. It sticks to its spot unless another
// is clearly better, so labels don't jitter as the planets move.
const DIRS = Array.from({ length: 8 }, (_, k) => [Math.cos((k * Math.PI) / 4), Math.sin((k * Math.PI) / 4)]);
function overlap(a, b) {
  const w = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0), h = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
  return w > 0 && h > 0 ? w * h : 0;
}
function boxAt(P, dir, d, w, h) {
  const ax = P.x + dir[0] * d, ay = P.y + dir[1] * d;
  const x0 = dir[0] > 0.3 ? ax : dir[0] < -0.3 ? ax - w : ax - w / 2;
  const y0 = dir[1] > 0.3 ? ay : dir[1] < -0.3 ? ay - h : ay - h / 2;
  return { x0, y0, x1: x0 + w, y1: y0 + h, ax, ay };
}
function placeLabels(show) {
  const W = innerWidth, H = innerHeight, tall = !!view.roll;
  const S = toScreen(sun.position);
  const sunPx = Math.abs(toScreen(camRight.clone().multiplyScalar(SUN_R * sun.scale.x)).x - S.x) || 40;
  sunName.style.fontSize = `${Math.max(12, sunPx * 0.36)}px`;
  sunName.style.transform = `translate(${S.x - sunName.offsetWidth / 2}px, ${S.y - sunName.offsetHeight / 2}px)`;
  sunName.style.opacity = show;
  const camToSun = camera.position.length();
  const glowPx = sunPx * 1.5;
  const obstacles = [{ x0: S.x - glowPx, y0: S.y - glowPx, x1: S.x + glowPx, y1: S.y + glowPx, w: 3 }];
  for (const b of BODIES) {
    const wp = b.pivot.getWorldPosition(new THREE.Vector3());
    const P = toScreen(wp);
    const px = (r) => { const e = toScreen(wp.clone().addScaledVector(camRight, r * view.scale)); return Math.hypot(e.x - P.x, e.y - P.y); };
    const reach = px(b.reach), body = px(b.ring ? b.size * b.ring.outer : b.size);
    b.screen = { x: P.x, y: P.y, reach };
    b.hidden = (Math.hypot(P.x - S.x, P.y - S.y) < sunPx * 1.05 && wp.distanceTo(camera.position) > camToSun) || P.z > 1;
    b.P = P;
    if (!b.hidden) obstacles.push({ x0: P.x - body - 3, y0: P.y - body - 3, x1: P.x + body + 3, y1: P.y + body + 3, w: 2.5 });
  }
  const safe = { x0: 10, y0: tall ? 52 : 50, x1: W - 10, y1: H - (tall ? 104 : 56) };
  const placed = [];
  const order = [...BODIES].sort((a, b) => (b.active - a.active) || (b.hover - a.hover));
  for (const b of order) {
    if (b.hidden || !b.w) { b.el.style.opacity = 0; if (b.path) b.path.setAttribute("stroke-opacity", 0); continue; }
    const P = b.P, d = (b.active ? b.screen.reach + (tall ? 14 : 22) : b.screen.reach + 6);
    let ox = P.x - S.x, oy = P.y - S.y; const ol = Math.hypot(ox, oy) || 1; ox /= ol; oy /= ol;
    let best = null;
    DIRS.forEach((dir, k) => {
      const box = boxAt(P, dir, d, b.w, b.h);
      let score = 0;
      for (const o of placed) score += overlap(box, o) * 4;
      for (const o of obstacles) score += overlap(box, o) * o.w;
      const inside = overlap(box, safe);
      score += (b.w * b.h - inside) * 6;
      score += (1 - (dir[0] * ox + dir[1] * oy)) * 60;    // prefer pointing away from the sun
      if (dir[1] !== 0 && Math.abs(dir[0]) < 0.3) score += 40; // straight up/down reads worse
      if (b.slot != null && k !== b.slot) score += 260;       // stickiness
      if (!best || score < best.score) best = { score, box, k };
    });
    b.slot = best.k;
    const { box } = best;
    // Ease towards the chosen spot so a change of side is a glide, not a jump.
    const tx = box.x0, ty = box.y0;
    b.lx = b.lx == null || Math.abs(b.lx - tx) > 400 ? tx : b.lx + (tx - b.lx) * 0.18;
    b.ly = b.ly == null || Math.abs(b.ly - ty) > 400 ? ty : b.ly + (ty - b.ly) * 0.18;
    const cur = { x0: b.lx, y0: b.ly, x1: b.lx + b.w, y1: b.ly + b.h };
    placed.push(cur);
    const dir = DIRS[best.k];
    b.el.classList.toggle("left", dir[0] < -0.3);
    b.el.classList.toggle("mid", Math.abs(dir[0]) <= 0.3);
    b.el.style.transform = `translate(${b.lx.toFixed(1)}px, ${b.ly.toFixed(1)}px)`;
    if (!b.active) { b.el.style.opacity = best.score > 400 ? 0 : show * 0.85; continue; }
    b.el.style.opacity = show;
    // Leader: from the world's edge to the nearest corner/side of its label.
    const sx = P.x + dir[0] * (b.screen.reach + 3), sy = P.y + dir[1] * (b.screen.reach + 3);
    const ex = THREE.MathUtils.clamp(sx, cur.x0, cur.x1), ey = THREE.MathUtils.clamp(sy, cur.y0 + 6, cur.y1 - 6);
    b.path.setAttribute("d", `M${sx.toFixed(1)},${sy.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)}`);
    b.path.setAttribute("stroke-opacity", (show * (0.45 + b.hover * 0.5)).toFixed(2));
  }
}

/* ---------- Loop ---------- */
const ease = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
let last = performance.now();
const look = new THREE.Vector3();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!still && frozenAt == null) {
    const slow = hovered ? 0.12 : 1;                       // the system nearly stops while you aim
    clock.t += dt * (flying ? 0 : slow);
    shared.uTime.value += dt;
    if (!view.dragging && !pointer.down && !flying) view.yaw += dt * 0.012;
    clock.intro = Math.min(1, clock.intro + dt / 3.4);
  } else if (frozenAt != null) {
    shared.uTime.value = frozenAt;
  }
  const intro = ease(clock.intro);

  // Camera on its orbit, pulled back during the intro.
  const dist = view.fit * (0.42 + 0.58 * intro);
  const elev = view.elev + (1 - intro) * 0.6;
  const target = new THREE.Vector3(
    Math.sin(view.yaw) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(view.yaw) * Math.cos(elev) * dist);
  look.set(0, 0, 0);
  if (flying) {
    flying.t += dt / 1.5;
    const e = easeInOut(Math.min(flying.t, 1));
    const wp = flying.b.pivot.getWorldPosition(new THREE.Vector3());
    const away = flying.from.clone().sub(wp).normalize();
    const close = wp.clone().addScaledVector(away, flying.b.size * view.scale * 6.5);
    target.lerpVectors(flying.from, close, e);
    look.lerpVectors(new THREE.Vector3(), wp, Math.min(1, e * 1.4));
    overlay.style.opacity = Math.max(0, 1 - e * 2.5);
    sunName.style.opacity = Math.max(0, 1 - e * 2.5);
    veil.style.opacity = THREE.MathUtils.smoothstep(flying.t, 0.7, 1.05);
    if (flying.t >= 1.1) { location.href = flying.b.href; flying.t = -99; }
  }
  camera.position.copy(target);
  camera.up.set(0, 1, 0);
  camera.lookAt(look);
  if (view.roll) camera.rotateZ(view.roll);
  camera.updateMatrixWorld();
  camRight.setFromMatrixColumn(camera.matrixWorld, 0);
  sky.position.copy(camera.position);

  sun.rotation.y = shared.uTime.value * 0.02;
  corona.quaternion.copy(camera.quaternion);

  BODIES.forEach((b, i) => {
    const ang = b.phase + clock.t * b.speed;
    orbitPoint(b, ang, b.pivot.position);
    b.mesh.rotation.y = shared.uTime.value * (b.type === 1 ? 0.25 : 0.12) + b.seed;
    if (b.moonPivot) b.moonPivot.rotation.y = clock.t * 0.9;
    const appear = THREE.MathUtils.clamp(clock.intro * 2.2 - 0.25 - i * 0.07, 0, 1);
    b.pivot.scale.setScalar(Math.max(0.001, ease(appear)));
    b.orbit.material.uniforms.uAng.value = ((ang % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    b.hover += (b.hoverTarget - b.hover) * 0.14;
    b.orbit.material.uniforms.uFade.value = appear * (1 + b.hover * 1.4);
    b.mat.uniforms.uHover.value = b.hover;
    if (b.ringMat) b.ringMat.uniforms.uCenter.value.copy(b.pivot.position);
    if (b.beacon) {
      b.beacon.quaternion.copy(camera.quaternion);
      b.beacon.material.uniforms.uHover.value = b.hover;
      b.beacon.material.uniforms.uFade.value = THREE.MathUtils.clamp(clock.intro * 2 - 1, 0, 1);
    }
  });
  asteroids.rotation.y = clock.t * 0.03;
  kuiper.rotation.y = clock.t * 0.004;
  asteroids.material.uniforms.uFade.value = kuiper.material.uniforms.uFade.value = THREE.MathUtils.clamp(clock.intro * 1.6 - 0.3, 0, 1);

  placeLabels(flying ? 0 : THREE.MathUtils.clamp(clock.intro * 3 - 2, 0, 1));
  composer.render();
  document.body.dataset.ready = clock.intro >= 1 ? "1" : "";
  requestAnimationFrame(frame);
}

addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
