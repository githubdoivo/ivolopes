<style>
  :root {
    --text: #221a15; --muted: #7a6c62; --accent: #c0613a; --accent-ink: #fff;
    --win: rgba(250, 246, 241, .80); --content: #fbf8f4; --side: rgba(255, 255, 255, .42); --hair: rgba(60, 40, 25, .12);
    --glass: rgba(255, 255, 255, .38); --glass-hi: rgba(255, 255, 255, .85); --glass-lo: rgba(255, 255, 255, .25);
    --shadow: 0 40px 90px rgba(40, 20, 10, .38), 0 0 0 .5px rgba(40, 20, 10, .25);
    --sans: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; --serif: "Fraunces", Georgia, serif;
  }
  :root[data-theme="dark"] {
    --text: #f3ece6; --muted: #a8998e; --accent: #e08257; --win: rgba(34, 28, 25, .78); --content: #1d1815; --side: rgba(70, 58, 50, .38);
    --hair: rgba(255, 240, 230, .1); --glass: rgba(90, 76, 66, .38); --glass-hi: rgba(255, 255, 255, .28); --glass-lo: rgba(255, 255, 255, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --text: #f3ece6; --muted: #a8998e; --accent: #e08257; --win: rgba(34, 28, 25, .78); --content: #1d1815; --side: rgba(70, 58, 50, .38);
      --hair: rgba(255, 240, 230, .1); --glass: rgba(90, 76, 66, .38); --glass-hi: rgba(255, 255, 255, .28); --glass-lo: rgba(255, 255, 255, .06);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 14px/1.55 var(--sans); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; background: #b8774f; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* A warm, glazed wallpaper: clay, sand, a pool of teal glaze. */
  .wallpaper { position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 70% at 18% 20%, #f2c9a4 0%, transparent 60%),
      radial-gradient(55% 60% at 85% 15%, #d98a5c 0%, transparent 62%),
      radial-gradient(70% 70% at 80% 95%, #2f6d72 0%, transparent 60%),
      radial-gradient(60% 60% at 10% 100%, #8f3f22 0%, transparent 65%),
      radial-gradient(40% 40% at 55% 55%, #e9b07f 0%, transparent 70%),
      linear-gradient(160deg, #e6a77a, #a9532f); }
  .wallpaper::after { content: ""; position: absolute; inset: 0; opacity: .18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* Liquid glass: blurred, saturated, with a bright rim and a soft inner glow. */
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), inset 0 0 0 1px var(--glass-lo), 0 8px 26px rgba(40, 20, 10, .14); }

  /* ---------- Menu bar ---------- */
  .menubar { position: fixed; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 18px; padding: 0 16px; z-index: 5;
    color: #fff; font-size: 13px; font-weight: 500; text-shadow: 0 1px 2px rgba(60, 20, 0, .35); }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .menubar svg { width: 15px; height: 15px; display: block; }
  .menubar button { color: #fff; font-weight: 600; }

  /* ---------- The window ---------- */
  .window { position: fixed; left: 50%; top: calc(50% + 4px); transform: translate(-50%, -50%); width: min(1260px, 92vw); height: min(800px, calc(100vh - 140px));
    border-radius: 28px; background: var(--win); -webkit-backdrop-filter: blur(40px) saturate(170%); backdrop-filter: blur(40px) saturate(170%);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .55); display: grid; grid-template-columns: 252px 1fr; overflow: hidden; }
  .sidebar { margin: 9px 0 9px 9px; border-radius: 20px; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--side);
    -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px var(--glass-lo), 0 4px 18px rgba(40, 20, 10, .10); overflow: auto; }
  .lights { display: flex; gap: 8px; padding: 2px 6px 16px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .2); }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .side-h { font-size: 11px; font-weight: 600; color: var(--muted); padding: 10px 10px 4px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; font-size: 13.5px; font-weight: 500; transition: background .2s, color .2s; }
  .nav svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .nav small { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav:hover { background: rgba(127, 100, 80, .1); }
  .nav.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .side-foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--muted); }
  .side-foot a { color: var(--accent); font-weight: 600; }

  .pane { position: relative; min-width: 0; background: var(--content); }
  .toolbar { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; pointer-events: none;
    background: linear-gradient(180deg, var(--content) 30%, transparent); }
  .toolbar > * { pointer-events: auto; }
  .capsule { display: flex; align-items: center; border-radius: 999px; padding: 3px; gap: 2px; }
  .capsule button, .capsule a { height: 32px; min-width: 34px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .capsule button:hover, .capsule a:hover { background: rgba(127, 100, 80, .12); }
  .capsule svg { width: 17px; height: 17px; }
  .wtitle { line-height: 1.15; }
  .wtitle b { display: block; font-size: 14px; font-weight: 700; }
  .wtitle span { font-size: 11.5px; color: var(--muted); }
  .spacer { flex: 1; }
  .tinted { background: color-mix(in srgb, var(--accent) 88%, transparent) !important; color: var(--accent-ink) !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -1px 0 rgba(0, 0, 0, .12), 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); }

  .scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
  .grid { display: grid; grid-template-columns: minmax(300px, 440px) 1fr; }
  .text { padding: 70px 10px 40vh 52px; }
  .stage { position: sticky; top: 0; height: min(800px, calc(100vh - 140px)); }
  .stage canvas { position: absolute; left: 4%; right: 4%; top: 15%; width: 92%; height: 72%; display: block; }
  @media (max-width: 760px) { .stage canvas { position: static; width: 100%; height: 100%; } }
  .kiln { position: absolute; inset: 15% 10%; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(closest-side, rgba(255, 120, 40, .55), rgba(255, 80, 20, .15) 60%, transparent); filter: blur(10px); }
  .section { min-height: 66vh; display: flex; flex-direction: column; justify-content: center; padding: 30px 0; }
  .section:first-child { min-height: 60vh; }
  .eyebrow { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
  h1 { font: 600 64px/1 var(--serif); letter-spacing: -.02em; margin: 8px 0 10px; }
  h2 { font: 600 34px/1.1 var(--serif); letter-spacing: -.01em; margin: 6px 0 12px; }
  .lead { font: italic 400 22px/1.3 var(--serif); color: var(--muted); margin-bottom: 12px; }
  .section p + p { margin-top: 10px; }
  .hint { margin-top: 22px; display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .hint i { width: 18px; height: 28px; border: 1.5px solid currentColor; border-radius: 10px; position: relative; }
  .hint i::after { content: ""; position: absolute; left: 50%; top: 5px; width: 2px; height: 6px; margin-left: -1px; border-radius: 1px; background: currentColor; animation: wheel 1.6s infinite; }
  @keyframes wheel { 60% { transform: translateY(8px); opacity: 0; } }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .piece { border-radius: 16px; overflow: hidden; background: color-mix(in srgb, var(--accent) 7%, var(--content)); box-shadow: inset 0 0 0 1px var(--hair); }
  .piece .ph { aspect-ratio: 4 / 5; display: grid; place-items: center; color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .piece .ph svg { width: 42%; }
  .piece figcaption { padding: 8px 10px 10px; font-size: 12.5px; font-weight: 600; }
  .piece small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .btn { height: 40px; padding: 0 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .btn.plain { box-shadow: inset 0 0 0 1px var(--hair); }

  /* ---------- Dock ---------- */
  .dock { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; border-radius: 26px; z-index: 5; }
  .dock a { position: relative; width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; transition: transform .2s; transform-origin: 50% 100%;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 4px 10px rgba(40, 20, 10, .25); }
  .dock a:hover { transform: scale(1.22) translateY(-4px); }
  .dock a svg { width: 28px; height: 28px; }
  .dock a[aria-current]::after { content: ""; position: absolute; bottom: -7px; width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, .85); }
  .dock .sep { width: 1px; height: 40px; background: rgba(255, 255, 255, .35); margin: 0 3px 5px; }

  /* ---------- Phones: an iOS app, glass tab bar at the bottom ---------- */
  .tabbar, .mtitle { display: none; }
  @media (max-width: 760px) {
    body { overflow: hidden; }
    .menubar, .dock, .sidebar, .toolbar { display: none; }
    .window { inset: 0; left: 0; top: 0; transform: none; width: 100%; height: 100%; border-radius: 0; grid-template-columns: 1fr; box-shadow: none; }
    .grid { display: block; }
    .stage { position: fixed; top: 0; left: 0; right: 0; height: 50svh; z-index: 0; }
    .text { position: relative; z-index: 1; padding: 46svh 12px 120px; }
    .section { min-height: 64svh; justify-content: flex-end; padding: 10px 0; }
    .section .card { padding: 18px 18px 20px; border-radius: 26px; background: color-mix(in srgb, var(--content) 82%, transparent); }
    h1 { font-size: 46px; } h2 { font-size: 28px; } .lead { font-size: 19px; }
    .gallery { gap: 6px; }
    .mtitle { display: flex; position: fixed; top: 0; left: 0; right: 0; z-index: 4; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 14px 12px;
      background: color-mix(in srgb, var(--content) 72%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 .5px 0 var(--hair); opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; pointer-events: none; }
    .mtitle b { font-size: 16px; font-weight: 700; }
    .mtitle.scrolled { opacity: 1; transform: none; }
    .tabbar { display: flex; position: fixed; z-index: 4; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); gap: 10px; align-items: center; }
    .tabs { flex: 1; display: flex; border-radius: 999px; padding: 4px; }
    .tabs a { flex: 1; display: grid; justify-items: center; gap: 1px; padding: 6px 0 5px; border-radius: 999px; font-size: 10.5px; font-weight: 600; color: var(--muted); transition: background .25s, color .25s; }
    .tabs a svg { width: 22px; height: 22px; }
    .tabs a.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .fab { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
    .fab svg { width: 22px; height: 22px; }
  }
  @media (min-width: 761px) { .section .card { background: none !important; box-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; } }
  @media (prefers-reduced-motion: reduce) { .hint i::after { animation: none; } .scroller { scroll-behavior: auto; } }
</style>

<script type="module">
import { createClay } from "https://art.ivolopes.com/clay.js";
const q = new URLSearchParams(location.search);
const c = window.CONTENT[q.get("lang") === "pt" ? "pt" : "en"];
const pt = c.lang === "pt";
document.documentElement.lang = c.lang;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const phone = () => innerWidth <= 760;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const JAR = '<svg viewBox="0 0 200 260" fill="none" stroke="currentColor" stroke-width="6"><path d="M78 20h44c-2 10-10 14-10 24 0 14 44 40 44 96 0 58-30 94-56 100h0c-26-6-56-42-56-100 0-56 44-82 44-96 0-10-8-14-10-24z"/></svg>';
// One small line icon per chapter.
const ICONS = [
  '<circle cx="12" cy="13" r="7"/>',
  '<path d="M5 14c0 4 3 6 7 6s7-2 7-6"/><path d="M9 10c1-2 5-2 6 0"/><circle cx="12" cy="7" r="2"/>',
  '<path d="M4 11h16c0 5-3.5 8-8 8s-8-3-8-8z"/>',
  '<path d="M6 8h12M5 12h14M6 16h12"/><path d="M6 8c-2 0-2 4 0 4M18 12c2 0 2 4 0 4"/>',
  '<path d="M9 3h6c0 2-2 3-2 4 0 2 5 4 5 9 0 4-3 6-6 6s-6-2-6-6c0-5 5-7 5-9 0-1-2-2-2-4z"/>',
  '<path d="M12 21c-4 0-6-3-6-6 0-4 4-6 4-10 3 2 4 4 4 6 1-1 2-2 2-3 2 2 2 4 2 7 0 3-2 6-6 6z"/>',
  '<path d="M12 3c3 5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6 6-11z"/>',
  '<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  '<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
];
const ico = (i) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[i]}</svg>`;

/* Text */
$("#subtitle").textContent = pt ? "Cerâmica · Porto" : "Ceramics · Porto";
$("#order-top-label").textContent = pt ? "Encomendar" : "Order";
$("#order-top").href = `https://art.ivolopes.com/order/?lang=${c.lang}`;
$("#text").innerHTML = c.sections.map((s, i) => `
  <section class="section" id="${s.id}" data-i="${i}"><div class="card glass">
    <p class="eyebrow">${esc(s.eyebrow.replace(/^\/\/\s*/, ""))}</p>
    ${i === 0 ? `<h1>${esc(s.title)}</h1>` : `<h2>${esc(s.title)}</h2>`}
    ${s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ""}
    ${s.body.map((p) => `<p>${esc(p)}</p>`).join("")}
    ${s.gallery ? `<div class="gallery">${c.work.map((w) => `<figure class="piece"><div class="ph">${JAR}</div><figcaption>${esc(w.title)}<small>${esc(w.note)}</small></figcaption></figure>`).join("")}</div>` : ""}
    ${s.contact ? `<div class="btns"><a class="btn plain" href="mailto:${c.email}">${esc(c.email)}</a></div>` : ""}
    ${s.order ? `<div class="btns"><a class="btn tinted" href="https://art.ivolopes.com/order/?lang=${c.lang}">${esc(c.orderCta)}</a></div>` : ""}
    ${i === 0 ? `<p class="hint"><i></i>${esc(c.scrollHint)}</p>` : ""}
  </div></section>`).join("");

/* Sidebar: the process, then the studio */
const label = (s) => s.eyebrow.replace(/^\/\/\s*/, "").replace(/^\d+\s*·\s*/, "");
const cap = (t) => t.replace(/^./, (m) => m.toUpperCase());
const navItem = (s, i, studio) => `<a class="nav${studio ? " studio" : ""}" href="#${s.id}" data-i="${i}">${ico(studio && i === 5 ? 4 : i)}<span>${esc(studio ? s.title : i === 0 ? (pt ? "Início" : "Start") : cap(label(s)))}</span>${!studio && i > 0 && i < 8 ? `<small>0${i}</small>` : ""}</a>`;
$("#side").innerHTML = `<div class="side-h">${pt ? "Processo" : "Process"}</div>${c.sections.slice(0, 8).map((s, i) => navItem(s, i, false)).join("")}
  <div class="side-h">${pt ? "Estúdio" : "Studio"}</div>${navItem(c.sections[5], 5, true)}${navItem(c.sections[8], 8, true)}`;
$("#side-foot").innerHTML = `${esc(c.footer)}<br><a href="mailto:${c.email}">${c.email}</a>`;

/* Phone tab bar */
$("#tabs").innerHTML = [
  ["top", pt ? "Processo" : "Process", 4],
  ["work", pt ? "Obras" : "Work", 1],
  ["order", pt ? "Encomendar" : "Order", 7],
].map(([id, t, ic]) => `<a href="#${id}" data-tab="${id}">${ico(ic === 1 ? 2 : ic)}<span>${esc(t)}</span></a>`).join("");
$("#tabs").querySelector('[data-tab="work"]').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>${pt ? "Obras" : "Work"}</span>`;

/* Theme and language */
const root = document.documentElement;
document.querySelectorAll(".theme").forEach((b) => b.addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
}));
$("#lang").textContent = pt ? "EN" : "PT";
$("#lang").addEventListener("click", () => { location.search = `?lang=${pt ? "en" : "pt"}`; });
const tick = () => { $("#when").textContent = new Date().toLocaleString(pt ? "pt-PT" : "en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
tick(); setInterval(tick, 20000);

/* Clay */
let clay = null;
try { clay = createClay($("#clay"), { reducedMotion: still }); } catch (e) { console.warn(e); }

/* Scroll inside the window (or the page, on phones) drives the clay */
const scroller = $("#scroller");
const sections = [...document.querySelectorAll(".section")];
const navs = [...document.querySelectorAll(".nav")];
const tabs = [...document.querySelectorAll("[data-tab]")];
function stageNow() {
  const box = scroller.getBoundingClientRect();
  const mid = phone() ? innerHeight * 0.62 : box.top + box.height * 0.5;
  const centres = sections.map((s) => { const r = s.getBoundingClientRect(); return r.top + r.height / 2; });
  if (mid <= centres[0]) return 0;
  for (let i = 0; i < centres.length - 1; i++) if (mid <= centres[i + 1]) return i + (mid - centres[i]) / (centres[i + 1] - centres[i]);
  return centres.length - 1;
}
function onScroll() {
  const s = stageNow(), i = Math.round(s);
  clay?.setStage(Math.min(7, s));
  navs.forEach((n) => n.classList.toggle("on", +n.dataset.i === i && (n.classList.contains("studio") ? i >= 5 && i !== 6 && i !== 7 : i < 8)));
  const tab = i >= 8 ? "order" : i === 5 ? "work" : "top";
  tabs.forEach((t) => t.classList.toggle("on", t.dataset.tab === tab));
  $("#mtitle").classList.toggle("scrolled", scroller.scrollTop > 120);
}
scroller.addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);
onScroll();
(function glow() { $("#kiln").style.opacity = $("#clay").dataset.glow || 0; requestAnimationFrame(glow); })();

const go = (d) => { const i = Math.max(0, Math.min(sections.length - 1, Math.round(stageNow()) + d)); sections[i].scrollIntoView({ behavior: still ? "auto" : "smooth", block: "center" }); };
$("#prev").addEventListener("click", () => go(-1));
$("#next").addEventListener("click", () => go(1));
document.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener("click", (e) => {
  const t = document.getElementById(a.getAttribute("href").slice(1));
  if (t) { e.preventDefault(); t.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "center" }); }
}));
// For screenshots: ?at=<section index>
if (q.has("at")) setTimeout(() => { sections[+q.get("at")].scrollIntoView({ block: "center" }); onScroll(); }, 300);
</script>
</body>
</html>
