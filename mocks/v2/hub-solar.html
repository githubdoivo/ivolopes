<style>
  :root { --ink: #ece8f4; --muted: #8e8aa6; --faint: #6a6680; --bg: #020308; --glass: rgba(14, 14, 28, .55); --rim: rgba(255, 255, 255, .14); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 12px/1.4 "JetBrains Mono", ui-monospace, monospace; overflow: hidden; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #scene.dragging { cursor: grabbing; } #scene.pointing { cursor: pointer; }

  #overlay { position: fixed; inset: 0; pointer-events: none; transition: opacity .5s; }
  #overlay.hide { opacity: 0; }
  #overlay.hide .tag { pointer-events: none !important; }
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #leaders path { fill: none; stroke-width: 1; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; opacity: 0; transition: opacity .6s;
    text-shadow: 0 0 2px #020308, 0 0 10px #020308, 0 0 18px #020308; }
  .tag.left { text-align: right; } .tag.mid { text-align: center; }
  .world { pointer-events: auto; display: block; line-height: 1; padding: 6px 0; cursor: pointer; }
  .world b { display: block; font-weight: 400; font-size: 30px; }
  .world small { display: block; margin-top: 7px; font: 10px/1.2 "JetBrains Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .minor { font: 10px "JetBrains Mono", monospace; color: var(--faint); letter-spacing: .14em; pointer-events: auto; cursor: pointer; }

  .qa b, .qa .t { font-family: "Space Grotesk", sans-serif; font-weight: 700; color: #3ddc97; letter-spacing: -.02em; }
  .art b, .art .t { font-family: "Fraunces", serif; font-style: italic; color: #ec9a68; }
  .moss b, .moss .t { font-family: "VT323", monospace; color: #9cf59a; letter-spacing: .14em; text-shadow: 0 0 12px rgba(156, 245, 154, .55), 0 0 2px #020308; }
  .moss b { font-size: 36px; }
  .stage b, .stage .t { font-family: "Italiana", serif; color: #f2d27a; letter-spacing: .08em; }

  .sun-name { position: fixed; left: 0; top: 0; pointer-events: none; text-align: center; will-change: transform;
    font: 600 30px/.92 "Fraunces", serif; color: #2a0f00; opacity: 0; transition: opacity .6s; }

  .chrome { position: fixed; z-index: 2; color: var(--muted); letter-spacing: .08em; transition: opacity .4s; }
  .chrome b { color: var(--ink); font-weight: 400; }
  .tl { left: 24px; top: 20px; } .tr { right: 24px; top: 20px; text-align: right; }
  .bl { left: 24px; bottom: 22px; } .br { right: 24px; bottom: 22px; text-align: right; }
  .bl a:hover { color: var(--ink); }

  /* Glass pills: the four worlds, always one tap away. */
  .dock { position: fixed; z-index: 4; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 4px; padding: 5px;
    border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
    box-shadow: inset 0 1px 0 var(--rim), inset 0 0 0 1px rgba(255, 255, 255, .06), 0 10px 30px rgba(0, 0, 0, .5); }
  .dock a, .dock button { display: inline-flex; align-items: baseline; gap: 6px; padding: 9px 16px 8px; border-radius: 999px; transition: background .25s; }
  .dock a:hover, .dock button:hover, .dock .on { background: rgba(255, 255, 255, .08); }
  .dock b { font-weight: 400; font-size: 18px; line-height: 1; }
  .dock .moss b { font-size: 21px; }
  .dock i { font-style: normal; font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  /* The focus card. */
  .card { position: fixed; z-index: 5; right: 6vw; top: 50%; width: min(380px, 34vw); transform: translate(30px, -50%); opacity: 0; pointer-events: none;
    padding: 22px 22px 18px; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
    box-shadow: inset 0 1px 0 var(--rim), inset 0 0 0 1px rgba(255, 255, 255, .06), 0 30px 60px rgba(0, 0, 0, .55); transition: opacity .45s, transform .45s cubic-bezier(.2, .8, .2, 1); }
  .card.open { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
  .card .k { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .card .t { display: block; font-size: 52px; line-height: 1; margin: 12px 0 6px; font-weight: 400; }
  .card.moss .t { font-size: 60px; }
  .card.minor-card .t { font-family: "Fraunces", serif; font-weight: 500; color: var(--ink); text-transform: capitalize; font-size: 44px; }
  .card .s { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .card p { margin-top: 14px; font: 14px/1.55 system-ui, sans-serif; color: #cfcadd; }
  .card .row { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
  .enter { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 8px; height: 46px; border-radius: 999px; font: 600 14px system-ui, sans-serif; color: #07110c;
    background: var(--accent, #ece8f4); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 24px color-mix(in srgb, var(--accent, #fff) 35%, transparent); }
  .enter[aria-disabled="true"] { background: rgba(255, 255, 255, .08); color: var(--muted); box-shadow: none; pointer-events: none; }
  .round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
  .round svg { width: 18px; height: 18px; }
  .card .back { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; }

  .meteor { position: fixed; z-index: 1; width: 160px; height: 1.5px; pointer-events: none; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(220, 230, 255, .9)); transform-origin: 100% 50%; }
  #veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: var(--bg); z-index: 9; }

  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    .world b { font-size: 22px; } .moss b { font-size: 26px; }
    .world small { display: none; } .world { padding: 3px 0; }
    .tl { left: 18px; top: max(16px, env(safe-area-inset-top)); } .tr { right: 18px; top: max(16px, env(safe-area-inset-top)); }
    .bl, .br { display: none; }
    .dock { left: 12px; right: 12px; transform: none; justify-content: space-between; }
    .dock a, .dock button { flex: 1; justify-content: center; padding: 11px 4px 10px; }
    .dock b { font-size: 17px; }
    .dock i { display: none; }
    .card { left: 12px; right: 12px; width: auto; top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); transform: translateY(24px); padding: 18px 18px 14px; border-radius: 24px; }
    .card.open { transform: none; }
    .card .t { font-size: 40px; margin: 8px 0 4px; } .card.moss .t { font-size: 46px; } .card.minor-card .t { font-size: 34px; }
    .card p { font-size: 13.5px; margin-top: 10px; }
    .card .row { margin-top: 14px; }
  }
  body.no-gl .dock { top: 50%; bottom: auto; transform: translate(-50%, -50%); flex-direction: column; }
</style>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const query = new URLSearchParams(location.search);
const frozenAt = query.has("t") ? Number(query.get("t")) : null; // fixed moment, for screenshots
const $ = (s) => document.querySelector(s);

/* ---------- Noise (Ashima simplex 3D) ---------- */
const NOISE = /* glsl */ `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*snoise(p);p*=2.03;a*=0.5;}return s;}
float fbm3(vec3 p){float s=0.0,a=0.5;for(int i=0;i<3;i++){s+=a*snoise(p);p*=2.03;a*=0.5;}return s;}
`;

/* ---------- The system ---------- */
// R is the orbit on wide screens, r the tighter one used on tall phones.
const BODIES = [
  { id: "mercury", R: 7.2, r: 6.6, size: 0.5, type: 0, a: "#7d736a", b: "#bdb3a8", c: "#4f4842", phase: 0.7,
    fact: "Closest to the sun. A year lasts 88 days." },
  { id: "venus", R: 9.9, r: 8.6, size: 0.95, type: 4, a: "#c39a5e", b: "#f1ddb0", atm: "#f6d9a0", phase: 2.6,
    fact: "The hottest planet, under clouds of sulphuric acid." },
  { id: "qa", name: "earth", R: 13, r: 11, size: 1.05, type: 2, atm: "#5aa2ff", tilt: 0.41, moon: true, phase: 5.6,
    title: "QA", sub: "Quality engineering", href: "https://qa.ivolopes.com", color: "#3ddc97",
    text: "QA Automation Engineer in capital markets. Playwright, Cucumber, Kafka, load tests. The CV lives here." },
  { id: "art", name: "mars", R: 16.4, r: 13.6, size: 0.8, type: 0, a: "#8e3517", b: "#d4703a", c: "#f2b27c", atm: "#e79a6a", tilt: 0.44, phase: 3.5, caps: true,
    title: "Art", sub: "Hand-built ceramics", href: "https://art.ivolopes.com", color: "#ec9a68",
    text: "Pinched and coiled by hand in Porto. Follow a ball of clay to a finished jar, or order a piece." },
  { id: "jupiter", R: 25, r: 19.6, size: 2.6, type: 1, a: "#b48a66", b: "#efe1c6", c: "#7d5236", spot: true, tilt: 0.05, phase: 1.15,
    fact: "Big enough to hold every other planet, with room to spare." },
  { id: "stage", name: "saturn", R: 31.5, r: 24.6, size: 2.1, type: 1, a: "#c8a46a", b: "#f2e3b8", c: "#9c7a48", tilt: 0.47, phase: 4.45,
    ring: { inner: 1.3, outer: 2.25, color: "#e7d2a2", alpha: 0.9 },
    title: "Stage", sub: "Dance & acting", soon: true, color: "#f2d27a",
    text: "Dance and acting. This world is still being built. Opening soon." },
  { id: "moss", name: "uranus", R: 38, r: 29.4, size: 1.5, type: 3, a: "#73cfc6", b: "#b9f2e6", atm: "#9cf5dc", tilt: 1.71, phase: 2.05,
    ring: { inner: 1.55, outer: 1.68, color: "#cfeee8", alpha: 0.35 },
    title: "MOSS", sub: "DJ & producer", href: "https://moss.ivolopes.com", color: "#9cf59a",
    text: "Something is growing in the swamp. Specimen MOSS-01 is germinating. First signal soon." },
  { id: "neptune", R: 43.5, r: 33.6, size: 1.45, type: 3, a: "#2448c4", b: "#5b86f2", atm: "#6f8cff", tilt: 0.49, phase: 0.25, darkSpot: true,
    fact: "The windiest planet, with storms faster than sound." },
  { id: "pluto", R: 48, r: 37.4, size: 0.35, type: 0, a: "#8f7f70", b: "#e8d8c4", c: "#5f5248", ecc: 0.2, inc: 0.3, dashed: true, phase: 3.05,
    fact: "A dwarf planet now, but still part of the family." },
];
const SUN_R = 4;
const ORBIT_K = 5.2; // angular speed = K / R^1.5 (Earth: about 55 s per orbit)

/* ---------- Renderer ---------- */
const canvas = $("#scene");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); }
catch { document.body.classList.add("no-gl"); throw new Error("WebGL unavailable"); }
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 3000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.45, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const clock = { t: frozenAt ?? 0, intro: frozenAt != null || still ? 1 : 0 };
const shared = { uTime: { value: frozenAt ?? 0 } };
const color = (hex) => new THREE.Color(hex || "#000000");
const tmp = new THREE.Vector3();

/* ---------- Sky ---------- */
const sky = new THREE.Group();
scene.add(sky);
{
  const N = 6000, pos = [], col = [], size = [], phase = [];
  const band = new THREE.Vector3(0.3, 1, 0.2).normalize();
  const tint = [new THREE.Color("#ffd9b0"), new THREE.Color("#ffffff"), new THREE.Color("#c9d8ff"), new THREE.Color("#a9c1ff")];
  for (let i = 0; i < N; i++) {
    const v = new THREE.Vector3().randomDirection();
    const inBand = i < N * 0.55;
    if (inBand) { const d = v.dot(band); v.addScaledVector(band, -d * (1 - Math.pow(Math.random(), 3) * 0.6)).normalize(); }
    v.multiplyScalar(900);
    pos.push(v.x, v.y, v.z);
    const c = tint[Math.floor(Math.random() * 4)].clone().multiplyScalar(inBand ? 0.35 + Math.random() * 0.3 : 0.5 + Math.random() * 0.6);
    col.push(c.r, c.g, c.b);
    size.push(inBand ? 0.8 + Math.random() * 1.2 : 0.9 + Math.pow(Math.random(), 6) * 3.2);
    phase.push(Math.random() * 6.28);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("aColor", new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute("aSize", new THREE.Float32BufferAttribute(size, 1));
  g.setAttribute("aPhase", new THREE.Float32BufferAttribute(phase, 1));
  sky.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { ...shared, uPR: { value: 1 } },
    vertexShader: `attribute vec3 aColor; attribute float aSize, aPhase; uniform float uTime, uPR; varying vec3 vC;
      void main(){ vC = aColor * (0.7 + 0.3 * sin(uTime * (0.6 + aPhase * 0.2) + aPhase));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uPR; }`,
    fragmentShader: `varying vec3 vC; void main(){ vec2 q = gl_PointCoord * 2.0 - 1.0; float d = dot(q, q); if (d > 1.0) discard;
      gl_FragColor = vec4(vC * (1.0 - d) * (1.0 - d), 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  })));
}

/* ---------- Sun ---------- */
const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 128, 128), new THREE.ShaderMaterial({
  uniforms: shared,
  vertexShader: `varying vec3 vP, vN, vV; void main(){ vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vN = normalMatrix * normal; vV = -mv.xyz; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uTime; varying vec3 vP, vN, vV; ${NOISE}
    void main(){
      vec3 p = normalize(vP);
      float n = fbm(p * 2.6 + vec3(0.0, uTime * 0.04, uTime * 0.025));
      float cells = 1.0 - abs(snoise(p * 26.0 + uTime * 0.12));          // bright granules with dark lanes
      float fine = snoise(p * 70.0 - uTime * 0.2);
      float t = clamp(0.52 + n * 0.55 + (cells - 0.6) * 0.35 + fine * 0.05, 0.0, 1.0);
      vec3 c = mix(vec3(0.85, 0.2, 0.02), vec3(1.0, 0.55, 0.12), t);
      c = mix(c, vec3(1.0, 0.88, 0.58), smoothstep(0.72, 1.0, t));
      float spots = smoothstep(0.62, 0.72, fbm(p * 4.0 + 11.0));          // a few sunspots
      c *= 1.0 - spots * 0.55;
      float mu = max(dot(normalize(vN), normalize(vV)), 0.0);
      c *= 0.48 + 0.52 * pow(mu, 0.45);
      gl_FragColor = vec4(c * 1.9, 1.0);
    }`,
}));
scene.add(sun);
const corona = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  uniforms: { ...shared, uFade: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uTime, uFade; varying vec2 vUv; ${NOISE}
    void main(){

/* ---------- Focus: fly to a world, show its card ---------- */
const card = $("#card");

  $("#c-t").textContent = b.title || b.id;

const step = (d) => { const i = ORDER.indexOf(focus ? focus.id : "qa"); focusOn(byId[ORDER[(i + d + ORDER.length) % ORDER.length]]); };
$("#back").addEventListener("click", unfocus);
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
$("#enter").addEventListener("click", (e) => { if (!focus?.live || e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); go(focus); });
addEventListener("keydown", (e) => {

// Enter: dive into the world, fade, open its site.
const veil = $("#veil");
function go(b) {

  flying = { b, t: 0 };

addEventListener("pageshow", (e) => { if (e.persisted) { flying = null; veil.style.opacity = 0; } });

/* ---------- Pointer: drag, pinch/scroll zoom, tap, swipe ---------- */
let hovered = null;
const pointers = new Map();
const drag = { down: false, sx: 0, sy: 0, lx: 0, ly: 0, moved: false, pinch: 0, t0: 0 };
function setHover(b) {

}
function pick(x, y, touch) {

/* ---------- Labels ---------- */
const sunName = $("#sun-name");
function measure() { for (const b of BODIES) { b.w = b.el.offsetWidth; b.h = b.el.offsetHeight; } }
document.fonts?.ready.then(measure);
const camRight = new THREE.Vector3();
function toScreen(v) {
  tmp.copy(v).project(camera);
  return { x: (tmp.x * 0.5 + 0.5) * innerWidth, y: (-tmp.y * 0.5 + 0.5) * innerHeight, z: tmp.z };
}
const DIRS = Array.from({ length: 8 }, (_, k) => [Math.cos((k * Math.PI) / 4), Math.sin((k * Math.PI) / 4)]);

  const sunPx = Math.hypot(...(() => { const e = toScreen(camRight.clone().multiplyScalar(SUN_R * sun.scale.x)); return [e.x - S.x, e.y - S.y]; })()) || 40;

  sunName.style.transform = `translate(${S.x - sunName.offsetWidth / 2}px, ${S.y - sunName.offsetHeight / 2}px)`;
  if (!focus) sunName.style.opacity = S.z < 1 ? show : 0;

  const glowPx = sunPx * 1.5;
  const obstacles = [{ x0: S.x - glowPx, y0: S.y - glowPx, x1: S.x + glowPx, y1: S.y + glowPx, w: 3 }];

    const P = toScreen(wp);

/* ---------- Shooting stars ---------- */
function meteor() {
  if (still || document.hidden) return;
  const m = document.createElement("i");
  m.className = "meteor";
  const x = Math.random() * innerWidth, y = Math.random() * innerHeight * 0.45, ang = 150 + Math.random() * 30, len = 300 + Math.random() * 300;
  m.style.left = `${x - 160}px`; m.style.top = `${y}px`;
  document.body.appendChild(m);
  const dx = Math.cos((ang * Math.PI) / 180) * len, dy = Math.sin((ang * Math.PI) / 180) * len;
  m.animate([{ transform: `rotate(${ang - 180}deg) translateX(0)`, opacity: 0 }, { opacity: 1, offset: 0.15 }, { transform: `translate(${dx}px, ${dy}px) rotate(${ang - 180}deg)`, opacity: 0 }],

(function schedule() { setTimeout(() => { meteor(); schedule(); }, 4000 + Math.random() * 7000); })();

/* ---------- Loop ---------- */
const ease = (x) => 1 - Math.pow(1 - x, 3);

    if (b.moonPivot) b.moonPivot.rotation.y = clock.t * 1.2;
