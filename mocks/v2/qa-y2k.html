<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ivo Lopes · QA (Y2K mock)</title>
<meta name="theme-color" content="#2a0f5c">
<style>
  :root {
    --grape: #6a35e0; --grape-deep: #3a1696; --grape-ink: #24095e; --lilac: #e9e1ff; --lilac-2: #d6c8ff;
    --lime: #9be22d; --lime-deep: #4e9a06; --ink: #1d1530; --muted: #5e5476;
    --ui: Tahoma, Verdana, "Segoe UI", sans-serif; --title: "Trebuchet MS", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 12px/1.45 var(--ui); color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 500px at 50% 112%, rgba(255, 140, 230, .55), transparent 60%),
      linear-gradient(180deg, #160634 0%, #3b1680 55%, #8a4fe0 100%); }
  /* A Y2K grid floor under the monitor. */
  body::before { content: ""; position: fixed; left: -50%; right: -50%; bottom: -10%; height: 55%; pointer-events: none;
    background-image: linear-gradient(rgba(220, 190, 255, .35) 1px, transparent 1px), linear-gradient(90deg, rgba(220, 190, 255, .35) 1px, transparent 1px);
    background-size: 60px 60px; transform: perspective(400px) rotateX(62deg); transform-origin: 50% 100%;
    mask-image: linear-gradient(to top, #000 10%, transparent 90%); -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%); }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- The translucent purple monitor ---------- */
  .monitor { position: fixed; left: 50%; top: 50%; width: min(1280px, 96vw); height: min(880px, 94vh); transform: translate(-50%, -50%);
    border-radius: 46px 46px 58px 58px; isolation: isolate;
    background:
      linear-gradient(112deg, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 16%, rgba(255, 255, 255, 0) 72%, rgba(255, 255, 255, .22) 86%, rgba(255, 255, 255, 0) 100%),
      linear-gradient(180deg, rgba(168, 120, 255, .80), rgba(98, 44, 214, .86) 60%, rgba(70, 24, 170, .92));
    box-shadow: inset 0 2px 1px rgba(255, 255, 255, .8), inset 0 -10px 24px rgba(30, 0, 90, .55), inset 0 0 60px rgba(255, 255, 255, .18),
      0 50px 90px rgba(20, 0, 70, .6), 0 0 0 1px rgba(60, 20, 140, .8); }
  /* Visible internals through the plastic: traces, chips, the tube's shadow. */
  .monitor::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: .5; mix-blend-mode: multiply;
    background:
      radial-gradient(60% 55% at 50% 45%, rgba(30, 0, 80, .55), transparent 70%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='120'><g fill='none' stroke='%232a0a70' stroke-width='1.2' opacity='.55'><path d='M0 20h40l12 12h50l10-10h68'/><path d='M0 70h24l10 10h60l14-14h40l16 16h16'/><path d='M60 0v18M120 32v40l-10 10v38M30 80v40'/></g><g fill='%232a0a70' opacity='.55'><circle cx='52' cy='32' r='2.5'/><circle cx='112' cy='22' r='2.5'/><circle cx='94' cy='80' r='2.5'/><rect x='132' y='84' width='26' height='16' rx='2'/><rect x='12' y='34' width='18' height='26' rx='2'/></g></svg>"); }
  .monitor::after { content: ""; position: absolute; left: 6%; top: 1.2%; width: 40%; height: 26px; border-radius: 50%; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0)); filter: blur(2px); }
  .chin { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; display: flex; align-items: center; justify-content: center; gap: 18px; }
  .badge { font: italic 700 19px var(--title); letter-spacing: .02em;
    background: linear-gradient(180deg, #fff 0%, #d9ccff 45%, #8b6fd6 55%, #f4efff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 rgba(40, 0, 100, .7)); }
  .grille { width: 120px; height: 26px; opacity: .55; background: radial-gradient(circle, rgba(30, 0, 80, .9) 1.6px, transparent 2px) 0 0 / 8px 8px; border-radius: 13px; }
  .led { position: absolute; right: 56px; bottom: 30px; width: 9px; height: 9px; border-radius: 50%; background: var(--lime);
    box-shadow: 0 0 8px var(--lime), 0 0 16px rgba(155, 226, 45, .6); animation: led 3s ease-in-out infinite; }
  @keyframes led { 50% { opacity: .55; } }

  .screen { position: absolute; inset: 30px 34px 74px; border-radius: 18px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 3px #1a0640, 0 0 0 5px rgba(255, 255, 255, .25), inset 0 0 0 1px rgba(0, 0, 0, .6); }
  /* CRT glass: glare, scanlines, a soft curved vignette. */
  .glass { position: absolute; inset: 0; pointer-events: none; z-index: 50; border-radius: inherit;
    background:
      linear-gradient(125deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 26%),
      radial-gradient(120% 100% at 50% 50%, transparent 62%, rgba(10, 0, 30, .45) 100%),
      repeating-linear-gradient(180deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 3px); }

  /* ---------- The desktop ---------- */
  .desktop { position: absolute; inset: 0;
    background:
      radial-gradient(70% 35% at 30% 18%, rgba(255, 255, 255, .55), transparent 70%),
      radial-gradient(50% 25% at 78% 28%, rgba(255, 255, 255, .35), transparent 70%),
      radial-gradient(140% 70% at 35% 118%, #b98cff 0 40%, #7a49e8 55%, transparent 56%),
      radial-gradient(120% 60% at 90% 125%, #9a6cf5 0 45%, transparent 46%),
      linear-gradient(180deg, #4c25c9 0%, #8b63f0 45%, #f0b8ff 82%); }
  .icons { position: absolute; left: 10px; top: 12px; display: grid; gap: 10px; width: 84px; }
  .icon { display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border-radius: 3px; text-decoration: none; color: #fff;
    text-align: center; font-size: 11px; text-shadow: 1px 1px 2px rgba(0, 0, 0, .8); border: 1px dotted transparent; }
  .icon:hover, .icon:focus-visible { background: rgba(80, 40, 200, .45); border-color: rgba(255, 255, 255, .6); outline: none; }
  .icon svg { width: 36px; height: 36px; filter: drop-shadow(1px 2px 1px rgba(0, 0, 0, .35)); }

  /* ---------- An XP window, re-tinted grape ---------- */
  .window { position: absolute; left: 108px; top: 14px; right: 16px; bottom: 46px; display: flex; flex-direction: column;
    background: #f1ecfb; border: 3px solid #4d22c4; border-top: 0; border-radius: 9px 9px 0 0; overflow: hidden;
    box-shadow: 4px 6px 18px rgba(20, 0, 60, .45); }
  .titlebar { flex: none; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 5px 0 7px; color: #fff;
    background: linear-gradient(180deg, #b597ff 0%, #7a4ef6 9%, #6233ea 40%, #5326dc 88%, #3d17ae 100%);
    font: 700 13px var(--title); text-shadow: 1px 1px 0 #24095e; border-radius: 8px 8px 0 0; }
  .titlebar .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titlebar svg { width: 16px; height: 16px; flex: none; }
  .tb { width: 21px; height: 21px; border: 1px solid #fff; border-radius: 3px; display: grid; place-items: center; flex: none;
    background: linear-gradient(180deg, #a98cff, #6a3ef0 45%, #5a2ee0); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6); }
  .tb.x { background: linear-gradient(180deg, #ff9d7a, #e8522a 45%, #c83a14); }
  .tb svg { width: 11px; height: 11px; }
  .menubar { flex: none; display: flex; gap: 2px; padding: 2px 4px; background: #f1ecfb; border-bottom: 1px solid #cfc3ee; }
  .menubar span { padding: 2px 7px; border-radius: 2px; }
  .menubar span:hover { background: var(--grape); color: #fff; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: linear-gradient(180deg, #fbf9ff, #e9e2fa); border-bottom: 1px solid #cfc3ee; }
  .tool { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border: 1px solid transparent; border-radius: 3px; background: none; text-decoration: none; }
  .tool:hover { border-color: #b7a6e8; background: linear-gradient(180deg, #fff, #ece4ff); }
  .tool svg { width: 20px; height: 20px; }
  .sep { width: 1px; height: 22px; background: #cfc3ee; margin: 0 3px; }
  .address { flex: 1; display: flex; align-items: center; gap: 6px; margin-left: 6px; color: var(--muted); }
  .address div { flex: 1; display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #9c8ad0; padding: 2px 6px; color: var(--ink); }
  .go { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; }
  .go::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(180deg, #b7f064, #4e9a06); }

  .wbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px 1fr; }
  .taskpane { overflow: auto; padding: 12px; background: linear-gradient(180deg, #8e6ff2, #6544d9); display: grid; align-content: start; gap: 12px; }
  .pane { border-radius: 6px 6px 0 0; overflow: hidden; background: #efe9ff; box-shadow: 0 1px 0 rgba(255, 255, 255, .4); }
  .pane h3 { font: 700 12px var(--ui); color: #3a1696; padding: 6px 10px; background: linear-gradient(90deg, #fff, #d4c5ff); display: flex; justify-content: space-between; }
  .pane h3::after { content: "︽"; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; color: #fff; background: linear-gradient(180deg, #a58aff, #5a2ee0); border: 1px solid #fff; }
  .pane ul { list-style: none; padding: 8px 10px; display: grid; gap: 6px; }
  .pane a, .pane button { display: flex; align-items: center; gap: 7px; text-decoration: none; color: #2c1680; background: none; border: 0; text-align: left; }
  .pane a:hover, .pane button:hover { text-decoration: underline; color: var(--grape); }
  .pane svg { width: 16px; height: 16px; flex: none; }
  .pane .details { color: var(--muted); font-size: 11px; line-height: 1.6; }
  .pane .details b { color: var(--ink); }

  .main { overflow: auto; background: #fff; padding: 22px 26px 30px; scroll-behavior: smooth; }
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid #e3dbf7; }
  .avatar { width: 84px; height: 84px; border-radius: 6px; display: grid; place-items: center; font: 700 30px var(--title); color: #fff;
    background: linear-gradient(135deg, #c9a8ff, #6a35e0 55%, #2a0f8c); border: 3px solid #fff; box-shadow: 0 0 0 1px #9c8ad0, 2px 3px 6px rgba(40, 0, 100, .35); }
  .name { font: 700 46px/1 var(--title); letter-spacing: -.01em;
    background: linear-gradient(180deg, #4b1fcc 0%, #8f6bff 38%, #2a0f8c 52%, #b9a0ff 78%, #4b1fcc 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(1px 1px 0 rgba(255, 255, 255, .9)) drop-shadow(1px 2px 0 rgba(60, 20, 140, .25)); }
  .role { margin-top: 6px; font: 700 15px var(--title); color: #3a1696; }
  .tag { margin-top: 4px; color: var(--muted); font-style: italic; }

  h2 { font: 700 15px var(--title); color: #3a1696; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #b7a6e8, transparent); }
  .summary { max-width: 72ch; font-size: 12.5px; }

  /* The test run, as an XP progress dialog. */
  .run { margin-top: 18px; border: 1px solid #9c8ad0; border-radius: 6px; overflow: hidden; background: #f6f2ff; box-shadow: 2px 2px 6px rgba(60, 20, 140, .15); }
  .run-h { padding: 5px 9px; font: 700 12px var(--title); color: #fff; background: linear-gradient(180deg, #8f6bff, #5326dc); display: flex; justify-content: space-between; }
  .run-b { padding: 10px 12px; display: grid; gap: 8px; }
  .bar { height: 18px; border: 1px solid #8b7bc4; border-radius: 3px; background: #fff; padding: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; transition: width .35s steps(6);
    background: repeating-linear-gradient(90deg, var(--lime) 0 8px, transparent 8px 10px), linear-gradient(180deg, #d7ff9a, #5aa80a); background-blend-mode: multiply; }
  .checks { list-style: none; display: grid; gap: 3px; font-size: 11.5px; }
  .checks li { display: flex; gap: 8px; opacity: .25; transition: opacity .3s; }
  .checks li.ok { opacity: 1; }
  .checks li b { color: #2c7a00; width: 14px; }
  .checks li span:first-of-type { color: #3a1696; min-width: 92px; font-weight: 700; }
  .run-f { color: #2c7a00; font-weight: 700; min-height: 1.4em; }

  /* Metrics as drives in My Computer. */
  .drives { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .drive { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: center; padding: 6px; border: 1px solid transparent; border-radius: 3px; }
  .drive:hover { border-color: #c8b8f5; background: #f4efff; }
  .drive svg { grid-row: span 2; width: 34px; height: 34px; }
  .drive b { font: 700 14px var(--title); color: #2a0f8c; }
  .drive span { color: var(--muted); font-size: 11px; }
  .drive .cap { grid-column: 2; height: 7px; border: 1px solid #9c8ad0; background: #fff; }
  .drive .cap i { display: block; height: 100%; background: linear-gradient(180deg, #b597ff, #5326dc); }

  fieldset { border: 1px solid #c8b8f5; border-radius: 5px; padding: 10px 14px 12px; margin-bottom: 14px; background: linear-gradient(180deg, #fcfaff, #fff 60px); }
  legend { padding: 0 6px; font: 700 13px var(--title); color: #3a1696; }
  legend small { font: 400 11px var(--ui); color: var(--muted); margin-left: 6px; }
  .blurb { color: var(--muted); font-style: italic; margin-bottom: 8px; }
  .bullets { padding-left: 16px; display: grid; gap: 4px; }
  .bullets li::marker { color: var(--grape); }
  .bullets li.more { display: none; }
  fieldset.open .bullets li.more { display: list-item; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .chips span { font-size: 10.5px; padding: 1px 7px; border: 1px solid #b7a6e8; border-radius: 9px; background: linear-gradient(180deg, #fff, #ece4ff); color: #3a1696; }
  .xpbtn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; margin: 10px 6px 0 0; border: 1px solid #3a1696; border-radius: 3px; text-decoration: none; font-size: 11.5px;
    background: linear-gradient(180deg, #fff 0%, #f1ecfb 80%, #d9cdf7 100%); box-shadow: inset 0 -1px 0 rgba(60, 20, 140, .15); }
  .xpbtn:hover { box-shadow: inset 0 0 0 2px #f7c35a; }
  .xpbtn.primary { box-shadow: inset 0 0 0 1px #9b7bff; }

  /* Toolkit as an Explorer tree. */
  .tree { list-style: none; font-size: 12px; }
  .tree details { margin-left: 2px; }
  .tree summary { list-style: none; display: flex; align-items: center; gap: 5px; padding: 1px 2px; cursor: pointer; width: max-content; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "+"; width: 9px; height: 9px; border: 1px solid #8b7bc4; font: 9px/7px var(--ui); text-align: center; color: #3a1696; background: #fff; }
  .tree details[open] > summary::before { content: "−"; }
  .tree summary:hover { background: var(--grape); color: #fff; }
  .tree ul { list-style: none; margin-left: 6px; padding-left: 16px; border-left: 1px dotted #9c8ad0; }
  .tree li { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .tree svg { width: 16px; height: 16px; flex: none; }

  .statusbar { flex: none; display: flex; gap: 2px; background: #ebe4fa; border-top: 1px solid #cfc3ee; font-size: 11px; }
  .statusbar span { padding: 3px 8px; border-right: 1px solid #cfc3ee; }
  .statusbar span:first-child { flex: 1; }

  /* ---------- Taskbar and start menu ---------- */
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; z-index: 20;
    background: linear-gradient(180deg, #8d66ff 0%, #5a2ee0 12%, #4b22cc 55%, #3c18a8 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
  .start { height: 100%; display: flex; align-items: center; gap: 7px; padding: 0 22px 0 12px; border: 0; border-radius: 0 14px 14px 0; color: #fff;
    font: italic 700 18px var(--title); text-shadow: 1px 1px 1px rgba(0, 0, 0, .5);
    background: linear-gradient(180deg, #a6e86a 0%, #3e9a12 12%, #3a9a10 70%, #2a7a08 100%); box-shadow: inset -2px 0 3px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .start:hover { filter: brightness(1.08); }
  .start .orb { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #e3d4ff 30%, #7d4ff0 70%, #3a1696); box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
  .tasks { flex: 1; display: flex; gap: 4px; padding: 0 6px; min-width: 0; }
  .task { max-width: 220px; flex: 1; height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 3px; color: #fff; white-space: nowrap; overflow: hidden;
    background: linear-gradient(180deg, #3a14a0, #2c0c86); box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .5); }
  .task svg { width: 15px; height: 15px; flex: none; }
  .tray { height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: #fff; background: linear-gradient(180deg, #6a46f0, #3b1ab8 20%, #2f1290); border-left: 1px solid #1d0870; box-shadow: inset 1px 0 0 rgba(255, 255, 255, .25); }
  .tray button { background: none; border: 1px solid rgba(255, 255, 255, .45); border-radius: 3px; padding: 0 5px; font-size: 10.5px; }
  .tray svg { width: 15px; height: 15px; }

  .startmenu { position: absolute; left: 0; bottom: 34px; width: 380px; z-index: 30; border-radius: 8px 8px 0 0; overflow: hidden; display: none;
    border: 1px solid #3a1696; box-shadow: 4px 0 14px rgba(20, 0, 60, .5); background: #fff; }
  .startmenu.open { display: block; }
  .sm-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: #fff; font: 700 15px var(--title); text-shadow: 1px 1px 1px rgba(0, 0, 0, .5);
    background: linear-gradient(180deg, #a07cff, #5a2ee0 25%, #4b22cc); }
  .sm-head .avatar { width: 46px; height: 46px; font-size: 17px; border-width: 2px; }
  .sm-cols { display: grid; grid-template-columns: 1fr 1fr; }
  .sm-cols ul { list-style: none; padding: 6px; display: grid; gap: 2px; align-content: start; }
  .sm-cols ul + ul { background: #e9e1ff; border-left: 1px solid #c8b8f5; }
  .sm-cols a { display: flex; align-items: center; gap: 8px; padding: 5px 6px; text-decoration: none; border-radius: 2px; }
  .sm-cols a:hover { background: var(--grape); color: #fff; }
  .sm-cols a b { display: block; }
  .sm-cols a small { display: block; color: var(--muted); font-size: 10px; }
  .sm-cols a:hover small { color: #e9e1ff; }
  .sm-cols svg { width: 26px; height: 26px; flex: none; }
  .sm-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 6px 10px; background: linear-gradient(180deg, #5a2ee0, #3c18a8); }
  .sm-foot a { color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .sm-foot i { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #fff; background: linear-gradient(180deg, #ffb27a, #e0531f); }

  /* ---------- Boot ---------- */
  .boot { position: absolute; inset: 0; z-index: 60; background: #000; display: grid; place-items: center; align-content: center; gap: 34px; transition: opacity .5s; }
  .boot.done { opacity: 0; pointer-events: none; }
  .boot .logo { text-align: center; color: #fff; font: italic 700 40px var(--title); }
  .boot .logo small { display: block; font: 700 13px var(--title); color: #b597ff; letter-spacing: .3em; margin-top: 4px; font-style: normal; }
  .boot .load { width: 150px; height: 18px; border: 2px solid #8b7bc4; border-radius: 4px; padding: 2px; overflow: hidden; position: relative; }
  .boot .load i { position: absolute; top: 2px; bottom: 2px; width: 32px; left: -36px; animation: slide 1.2s linear infinite;
    background: repeating-linear-gradient(90deg, #9b7bff 0 8px, transparent 8px 12px); }
  @keyframes slide { to { left: 150px; } }

  /* ---------- Phones: the monitor becomes a thin purple shell, the window is maximised ---------- */
  @media (max-width: 760px) {
    body::before { display: none; }
    .monitor { width: 100vw; height: 100dvh; border-radius: 0; left: 0; top: 0; transform: none; }
    .monitor::after, .chin, .led { display: none; }
    .screen { inset: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); border-radius: 26px; }
    .icons, .taskpane, .address, .menubar, .tool .lbl, .sep { display: none; }
    .window { left: 0; top: 0; right: 0; bottom: 40px; border: 0; border-radius: 0; }
    .titlebar { border-radius: 0; height: 34px; padding-top: 2px; }
    .wbody { grid-template-columns: 1fr; }
    .main { padding: 16px 14px 26px; }
    .hero { grid-template-columns: 1fr; gap: 10px; }
    .avatar { width: 58px; height: 58px; font-size: 22px; }
    .name { font-size: 38px; }
    .taskbar { height: 40px; }
    .startmenu { bottom: 40px; width: 100%; }
    .task .lbl { display: none; } .task { flex: 0 0 auto; }
    .statusbar span:not(:first-child) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .led, .boot .load i { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<div class="monitor">
  <div class="screen">
    <div class="desktop">
      <nav class="icons" aria-label="Shortcuts" id="icons"></nav>

      <section class="window" aria-label="CV">
        <div class="titlebar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="11" rx="2" fill="#e9e1ff" stroke="#24095e"/><path d="M4 7l2 2 4-4" stroke="#2c7a00" stroke-width="2" fill="none"/></svg>
          <span class="t" id="wtitle">Ivo Lopes · QA Automation Engineer</span>
          <span class="tb" aria-hidden="true"><svg viewBox="0 0 11 11"><path d="M2 8h6" stroke="#fff" stroke-width="2"/></svg></span>
          <span class="tb" aria-hidden="true"><svg viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" stroke="#fff" stroke-width="1.6" fill="none"/></svg></span>
          <span class="tb x" aria-hidden="true"><svg viewBox="0 0 11 11"><path d="M2 2l7 7M9 2l-7 7" stroke="#fff" stroke-width="2"/></svg></span>
        </div>
        <div class="menubar" aria-hidden="true"><span>File</span><span>Edit</span><span>View</span><span>Tests</span><span>Help</span></div>
        <div class="toolbar">
          <button class="tool" id="rerun" type="button"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="url(#gl)"/><path d="M8 6l6 4-6 4z" fill="#fff"/></svg><span class="lbl">Run tests</span></button>
          <a class="tool" id="pdf" href="#"><svg viewBox="0 0 20 20"><path d="M4 2h8l4 4v12H4z" fill="#fff" stroke="#5326dc"/><path d="M10 8v6M7 11l3 3 3-3" stroke="#5326dc" stroke-width="1.6" fill="none"/></svg><span class="lbl">Download CV</span></a>
          <a class="tool" href="mailto:mail@ivolopes.com"><svg viewBox="0 0 20 20"><rect x="2" y="4" width="16" height="12" rx="1.5" fill="#fff" stroke="#5326dc"/><path d="M2.5 5l7.5 6 7.5-6" stroke="#5326dc" fill="none"/></svg><span class="lbl">E-mail</span></a>
          <span class="sep"></span>
          <div class="address"><span>Address</span><div><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#8f6bff"/><path d="M1 7h12M7 1c3 3 3 9 0 12M7 1c-3 3-3 9 0 12" stroke="#fff" fill="none"/></svg>https://qa.ivolopes.com/</div><span class="go">Go</span></div>
        </div>
        <div class="wbody">
          <aside class="taskpane" id="taskpane"></aside>
          <main class="main" id="main"></main>
        </div>
        <div class="statusbar"><span id="status">Done</span><span>Porto, Portugal</span><span>🔒 Internet</span></div>
      </section>

      <div class="startmenu" id="startmenu"></div>
      <div class="taskbar">
        <button class="start" id="start" type="button" aria-expanded="false" aria-controls="startmenu"><span class="orb"></span>start</button>
        <div class="tasks"><div class="task"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="11" rx="2" fill="#e9e1ff"/><path d="M4 7l2 2 4-4" stroke="#2c7a00" stroke-width="2" fill="none"/></svg><span class="lbl">Ivo Lopes · QA</span></div></div>
        <div class="tray">
          <button id="lang" type="button">PT</button>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#fff"/><path d="M11 5c1.5 1.5 1.5 4.5 0 6" stroke="#fff" fill="none"/></svg>
          <span id="clock">12:00</span>
        </div>
      </div>
    </div>
    <div class="boot" id="boot" aria-hidden="true"><div class="logo">Ivo Lopes<small>QUALITY EDITION</small></div><div class="load"><i></i></div></div>
    <div class="glass" aria-hidden="true"></div>
  </div>
  <div class="chin" aria-hidden="true"><span class="grille"></span><span class="badge">ivo·qa</span><span class="grille"></span></div>
  <span class="led" aria-hidden="true"></span>
</div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7f064"/><stop offset="1" stop-color="#3e8a06"/></linearGradient></defs></svg>

<script src="https://qa.ivolopes.com/data.js"></script>
<script src="https://qa.ivolopes.com/data.pt.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const cv = q.get("lang") === "pt" && window.CV_PT ? window.CV_PT : window.CV;
  const ui = cv.ui, pt = cv.lang === "pt";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PDF = `https://qa.ivolopes.com/${ui.pdfFile}`;
  document.documentElement.lang = cv.lang;

  // Small XP-ish icons, drawn inline.
  const I = {
    pdf: '<svg viewBox="0 0 36 36"><path d="M7 3h16l7 7v23H7z" fill="#fff" stroke="#5326dc" stroke-width="1.5"/><path d="M23 3v7h7" fill="#e9e1ff" stroke="#5326dc" stroke-width="1.5"/><rect x="10" y="20" width="16" height="8" rx="1" fill="#d6336c"/><text x="18" y="26.5" font-size="6" font-family="Tahoma" font-weight="700" fill="#fff" text-anchor="middle">PDF</text></svg>',
    app: '<svg viewBox="0 0 36 36"><rect x="4" y="6" width="28" height="22" rx="3" fill="#7a4ef6" stroke="#24095e" stroke-width="1.5"/><rect x="7" y="11" width="22" height="14" fill="#e9e1ff"/><circle cx="18" cy="18" r="4" fill="#9be22d"/><rect x="4" y="6" width="28" height="4" fill="#3a1696"/></svg>',
    txt: '<svg viewBox="0 0 36 36"><path d="M8 3h14l6 6v24H8z" fill="#fff" stroke="#5e5476" stroke-width="1.5"/><path d="M12 14h12M12 18h12M12 22h9M12 26h11" stroke="#8b7bc4" stroke-width="1.5"/></svg>',
    web: '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="#8f6bff" stroke="#24095e" stroke-width="1.5"/><path d="M4 18h28M18 4c6 6 6 22 0 28M18 4c-6 6-6 22 0 28" stroke="#fff" stroke-width="1.5" fill="none"/></svg>',
    mail: '<svg viewBox="0 0 36 36"><rect x="4" y="8" width="28" height="20" rx="2" fill="#fff" stroke="#5326dc" stroke-width="1.5"/><path d="M5 9l13 10L31 9" stroke="#5326dc" stroke-width="1.5" fill="none"/></svg>',
    bin: '<svg viewBox="0 0 36 36"><path d="M9 10h18l-2 22H11z" fill="#e9e1ff" stroke="#24095e" stroke-width="1.5"/><path d="M7 10h22M14 6h8" stroke="#24095e" stroke-width="2"/><path d="M15 15v13M21 15v13" stroke="#8b7bc4" stroke-width="1.5"/></svg>',
    drive: '<svg viewBox="0 0 34 34"><rect x="3" y="11" width="28" height="14" rx="3" fill="#d6c8ff" stroke="#3a1696" stroke-width="1.4"/><rect x="3" y="11" width="28" height="5" rx="2" fill="#f4efff"/><circle cx="26" cy="20" r="1.8" fill="#9be22d"/><path d="M7 20h12" stroke="#8b7bc4" stroke-width="2"/></svg>',
    folder: '<svg viewBox="0 0 16 16"><path d="M1 4h5l1.5 1.5H15V13H1z" fill="#f7d36b" stroke="#a87b00" stroke-width=".8"/></svg>',
    file: '<svg viewBox="0 0 16 16"><path d="M3 1h7l3 3v11H3z" fill="#fff" stroke="#7a6aa8" stroke-width=".8"/><path d="M5 7h6M5 9.5h6M5 12h4" stroke="#b7a6e8"/></svg>',
    link: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#8f6bff"/><path d="M1 8h14M8 1c3 3 3 11 0 14M8 1c-3 3-3 11 0 14" stroke="#fff" fill="none" stroke-width=".9"/></svg>',
    copy: '<svg viewBox="0 0 16 16"><rect x="5" y="4" width="9" height="11" fill="#fff" stroke="#5326dc"/><rect x="2" y="1" width="9" height="11" fill="#f4efff" stroke="#5326dc"/></svg>',
    pin: '<svg viewBox="0 0 16 16"><path d="M8 15s5-5 5-9a5 5 0 0 0-10 0c0 4 5 9 5 9z" fill="#d6336c"/><circle cx="8" cy="6" r="2" fill="#fff"/></svg>',
  };
  const P = cv.projects[0];

  /* Desktop icons */
  $("#icons").innerHTML = [
    [I.pdf, pt ? "O meu CV.pdf" : "My CV.pdf", PDF],
    [I.app, "appdoivo.exe", P.demo],
    [I.web, "E2E tests", P.tests],
    [I.txt, "flaky-ci.txt", `https://qa.ivolopes.com/${P.story}`],
    [I.web, "LinkedIn", cv.links[0].href],
    [I.web, "GitHub", cv.links[1].href],
    [I.bin, pt ? "Reciclagem" : "Recycle Bin", null],
  ].map(([icon, label, href]) => href ? `<a class="icon" href="${href}">${icon}<span>${esc(label)}</span></a>` : `<span class="icon">${icon}<span>${esc(label)}</span></span>`).join("");

  /* Task pane */
  $("#taskpane").innerHTML = `
    <div class="pane"><h3>${pt ? "Contacto" : "Contact"}</h3><ul>
      <li><a href="mailto:${cv.email}">${I.mail.replace("36 36", "36 36")}${pt ? "Enviar e-mail" : "E-mail me"}</a></li>
      <li><button type="button" id="copy">${I.copy}<span>${esc(ui.copyEmail)}</span></button></li>
      ${cv.links.map((l) => `<li><a href="${l.href}">${I.link}${esc(l.label)}</a></li>`).join("")}
    </ul></div>
    <div class="pane"><h3>${pt ? "Transferências" : "Downloads"}</h3><ul>
      <li><a href="https://qa.ivolopes.com/ivo-lopes-cv.pdf">${I.file}CV (EN).pdf</a></li>
      <li><a href="https://qa.ivolopes.com/ivo-lopes-cv-pt.pdf">${I.file}CV (PT).pdf</a></li>
    </ul></div>
    <div class="pane"><h3>${pt ? "Detalhes" : "Details"}</h3><ul class="details">
      <li><b>${esc(cv.name)}</b><br>${esc(cv.title)}</li>
      <li>${I.pin.replace("<svg", '<svg style="width:12px;height:12px;vertical-align:-2px"')} ${esc(cv.location)}<br>${esc(cv.coords)}</li>
    </ul></div>`;
  $("#copy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(cv.email); e.currentTarget.querySelector("span").textContent = ui.copied; } catch (_) {}
  });

  /* Main */
  const maxN = Math.max(...cv.metrics.map((m) => parseFloat(m.value) || 80));
  $("#main").innerHTML = `
    <header class="hero">
      <div class="avatar" aria-hidden="true">IL</div>
      <div><h1 class="name">${esc(cv.name)}</h1><p class="role">${esc(cv.title)}</p><p class="tag">${esc(cv.tagline)}</p></div>
    </header>
    <section class="run" aria-label="${pt ? "Execução de testes" : "Test run"}">
      <div class="run-h"><span>${pt ? "A executar testes…" : "Running tests…"}</span><span id="run-n">0 / ${cv.checks.length}</span></div>
      <div class="run-b">
        <div class="bar"><i id="bar"></i></div>
        <ul class="checks">${cv.checks.map(([k, v]) => `<li><b>✓</b><span>${esc(k)}</span><span>${esc(v)}</span></li>`).join("")}</ul>
        <div class="run-f" id="run-f"></div>
      </div>
    </section>
    <h2>${esc(ui.sSummary)}</h2>
    <p class="summary">${rich(cv.summary)}</p>
    <h2>${pt ? "O meu computador" : "My Computer"}</h2>
    <div class="drives">${cv.metrics.map((m) => {
      const n = parseFloat(String(m.value).replace(/[^\d.]/g, "")) || 0;
      const pct = m.value.includes("%") ? n : Math.min(100, 18 + (n / Math.max(maxN, 1)) * 82);
      return `<div class="drive">${I.drive}<b>${esc(m.value)}</b><span>${esc(m.label)}</span><div class="cap"><i style="width:${pct.toFixed(0)}%"></i></div></div>`;
    }).join("")}</div>
    <h2>${esc(ui.experience)}</h2>
    ${cv.experience.map((j) => `
      <fieldset>
        <legend>${esc(j.company)} · ${esc(j.role)}<small>${esc(j.start)} → ${esc(j.end)}</small></legend>
        <p class="blurb">${esc(j.blurb)}</p>
        <ul class="bullets">${j.bullets.map((b, i) => `<li class="${i >= 4 ? "more" : ""}">${rich(b)}</li>`).join("")}</ul>
        ${j.bullets.length > 4 ? `<button class="xpbtn" type="button" data-more>${esc(ui.more(j.bullets.length - 4))}</button>` : ""}
        <div class="chips">${j.stack.map((s) => `<span>${esc(s)}</span>`).join("")}</div>
      </fieldset>`).join("")}
    <h2>${esc(ui.projects)}</h2>
    <fieldset>
      <legend>${esc(P.name)}<small>${esc(P.kind)}</small></legend>
      <p class="blurb">${esc(P.blurb)}</p>
      <ul class="bullets">${P.points.map((b) => `<li>${rich(b)}</li>`).join("")}</ul>
      <div>
        <a class="xpbtn primary" href="${P.demo}">${esc(ui.tryDemo)}</a>
        <a class="xpbtn" href="${P.href}">${esc(ui.code)}</a>
        <a class="xpbtn" href="${P.tests}">${esc(ui.tests)}</a>
        <a class="xpbtn" href="https://qa.ivolopes.com/${P.story}">${esc(ui.readStory)}</a>
      </div>
      <div class="chips">${P.stack.map((s) => `<span>${esc(s)}</span>`).join("")}</div>
    </fieldset>
    <h2>${esc(ui.toolkit)}</h2>
    <div class="tree">${cv.skills.map((g, i) => `
      <details ${i < 2 ? "open" : ""}><summary>${I.folder}${esc(g.group)}</summary>
        <ul>${g.items.map((s) => `<li>${I.file}${esc(s)}</li>`).join("")}</ul></details>`).join("")}</div>
    <h2>${esc(ui.contact)}</h2>
    <p>${esc(ui.contactLead)}</p>
    <a class="xpbtn primary" href="mailto:${cv.email}">${esc(cv.email)}</a>
    <a class="xpbtn" href="${PDF}" download="${esc(ui.pdfName)}">${esc(ui.download)}</a>`;
  document.querySelectorAll("[data-more]").forEach((b) => b.addEventListener("click", () => {
    const f = b.closest("fieldset"); f.classList.toggle("open");
    b.textContent = f.classList.contains("open") ? ui.less : ui.more(f.querySelectorAll("li.more").length);
  }));
  $("#pdf").href = PDF;
  $("#pdf").setAttribute("download", ui.pdfName);

  /* Start menu */
  const menu = $("#startmenu"), startBtn = $("#start");
  menu.innerHTML = `
    <div class="sm-head"><div class="avatar" aria-hidden="true">IL</div>${esc(cv.name)}</div>
    <div class="sm-cols">
      <ul>
        <li><a href="${PDF}">${I.pdf}<span><b>${pt ? "O meu CV" : "My CV"}</b><small>PDF · ${pt ? "uma página" : "one page"}</small></span></a></li>
        <li><a href="${P.demo}">${I.app}<span><b>appdoivo</b><small>${esc(ui.liveDemo)}</small></span></a></li>
        <li><a href="${P.tests}">${I.web}<span><b>E2E tests</b><small>Playwright + Cucumber</small></span></a></li>
        <li><a href="https://qa.ivolopes.com/${P.story}">${I.txt}<span><b>Flaky CI</b><small>${pt ? "um caso real" : "a write-up"}</small></span></a></li>
      </ul>
      <ul>
        <li><a href="mailto:${cv.email}">${I.mail}<span><b>E-mail</b></span></a></li>
        ${cv.links.map((l) => `<li><a href="${l.href}">${I.web}<span><b>${esc(l.label)}</b></span></a></li>`).join("")}
      </ul>
    </div>
    <div class="sm-foot"><a href="?lang=${pt ? "en" : "pt"}"><i></i>${pt ? "English" : "Português"}</a></div>`;
  startBtn.addEventListener("click", (e) => { e.stopPropagation(); const o = menu.classList.toggle("open"); startBtn.setAttribute("aria-expanded", o); });
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) { menu.classList.remove("open"); startBtn.setAttribute("aria-expanded", "false"); } });

  /* Tray */
  const lang = $("#lang");
  lang.textContent = pt ? "EN" : "PT";
  lang.addEventListener("click", () => { location.search = `?lang=${pt ? "en" : "pt"}`; });
  const tick = () => { $("#clock").textContent = new Date().toLocaleTimeString(pt ? "pt-PT" : "en-GB", { hour: "2-digit", minute: "2-digit" }); };
  tick(); setInterval(tick, 15000);

  /* The test run */
  const items = [...document.querySelectorAll(".checks li")];
  function run() {
    items.forEach((li) => li.classList.remove("ok"));
    $("#bar").style.width = "0%"; $("#run-f").textContent = ""; $("#status").textContent = pt ? "A executar…" : "Running…";
    items.forEach((li, i) => setTimeout(() => {
      li.classList.add("ok");
      $("#bar").style.width = `${((i + 1) / items.length) * 100}%`;
      $("#run-n").textContent = `${i + 1} / ${items.length}`;
      if (i === items.length - 1) { $("#run-f").textContent = `✓ ${ui.passedCount(items.length)}`; $("#status").textContent = ui.footerChecks; }
    }, still ? 0 : 400 + i * 420));
  }
  $("#rerun").addEventListener("click", run);

  /* Boot, then run */
  const boot = $("#boot");
  setTimeout(() => { boot.classList.add("done"); run(); }, still || q.has("noboot") ? 0 : 1700);
})();
</script>
</body>
</html>
