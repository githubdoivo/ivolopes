<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ivo Lopes · Ceramics</title>
<meta name="theme-color" content="#ece7e1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js" } }</script>
<style>
  :root {
    --bg: #ece7e1; --bg2: #ddd5cc; --win: #f8f5f1; --text: #1f1915; --muted: #8a7d72; --hair: rgba(50, 35, 20, .1); --accent: #b9572f;
    --glass: rgba(255, 255, 255, .5); --glass-edge: rgba(255, 255, 255, .9); --glass-low: rgba(255, 255, 255, .3); --glass-shadow: 0 10px 30px rgba(60, 40, 20, .12);
    --sans: "Inter", -apple-system, system-ui, sans-serif; --serif: "Fraunces", Georgia, serif;
  }
  :root[data-theme="dark"] {
    --bg: #161311; --bg2: #0f0d0c; --win: #201b18; --text: #f2ebe4; --muted: #9c8e83; --hair: rgba(255, 240, 225, .09); --accent: #e0835a;
    --glass: rgba(70, 60, 54, .45); --glass-edge: rgba(255, 255, 255, .22); --glass-low: rgba(255, 255, 255, .06); --glass-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #161311; --bg2: #0f0d0c; --win: #201b18; --text: #f2ebe4; --muted: #9c8e83; --hair: rgba(255, 240, 225, .09); --accent: #e0835a;
    --glass: rgba(70, 60, 54, .45); --glass-edge: rgba(255, 255, 255, .22); --glass-low: rgba(255, 255, 255, .06); --glass-shadow: 0 10px 30px rgba(0, 0, 0, .35); } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 14px/1.6 var(--sans); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased;
    background: radial-gradient(80% 70% at 50% 40%, var(--bg) 0%, var(--bg2) 100%); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }

  .glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%);
    box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-low), var(--glass-shadow); }

  /* ---------- The window ---------- */
  .window { position: fixed; left: 50%; top: 50%; width: min(1180px, 92vw); height: min(760px, 88vh); border-radius: 26px; overflow: hidden; background: var(--win);
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(var(--s, 1)); opacity: var(--o, 1);
    box-shadow: 0 60px 120px -30px rgba(60, 35, 15, .45), 0 20px 40px -20px rgba(60, 35, 15, .25), 0 0 0 .5px rgba(40, 25, 10, .22), inset 0 1px 0 rgba(255, 255, 255, .5);
    transition: width .5s cubic-bezier(.2, .8, .2, 1), height .5s cubic-bezier(.2, .8, .2, 1), border-radius .5s, transform .5s cubic-bezier(.3, .7, .2, 1), opacity .4s; }
  .window.dragging { transition: none; }
  .window.zoomed { width: calc(100vw - 24px); height: calc(100vh - 24px); border-radius: 20px; --dx: 0px !important; --dy: 0px !important; }
  .window.away { --s: .2; --o: 0; pointer-events: none; transform: translate(-50%, calc(50vh - 40%)) scale(.12); }

  /* The scene runs under everything, sidebar included. */
  .scene { position: absolute; inset: 0; background:
    radial-gradient(48% 62% at 70% 52%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    radial-gradient(40% 50% at 18% 30%, color-mix(in srgb, #2f6d72 12%, transparent), transparent 70%); }
  .kiln { position: absolute; left: 50%; right: 4%; top: 18%; bottom: 14%; border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 120, 40, .55), rgba(255, 80, 20, .15) 60%, transparent); filter: blur(12px); }
  #clay { position: absolute; left: 46%; top: 12%; width: 52%; height: 74%; display: block; }

  .sidebar { position: absolute; z-index: 3; left: 10px; top: 10px; bottom: 10px; width: 232px; border-radius: 19px; padding: 14px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .lights { display: flex; gap: 8px; padding: 1px 6px 18px; }
  .lights button { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .22); }
  .lights svg { width: 8px; height: 8px; opacity: 0; }
  .lights:hover svg, .lights:focus-within svg { opacity: .7; }
  .lights .r { background: #ff5f57; } .lights .y { background: #febc2e; } .lights .g { background: #28c840; }
  .side-h { font-size: 11px; font-weight: 600; color: var(--muted); padding: 12px 10px 5px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 9px; font-size: 13.5px; font-weight: 500; transition: background .2s, color .2s; }
  .nav svg { width: 17px; height: 17px; flex: none; color: var(--accent); }
  .nav small { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav:hover { background: rgba(127, 100, 80, .1); }
  .nav.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .side-foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .side-foot a { color: var(--accent); font-weight: 600; }

  .toolbar { position: absolute; z-index: 3; left: 254px; right: 12px; top: 12px; display: flex; align-items: center; gap: 10px; }
  .toolbar .drag { flex: 1; height: 40px; display: flex; flex-direction: column; justify-content: center; padding-left: 8px; line-height: 1.2; cursor: grab; user-select: none; }
  .toolbar .drag b { font-size: 14px; font-weight: 600; }
  .toolbar .drag span { font-size: 11.5px; color: var(--muted); }
  .capsule { display: flex; align-items: center; height: 40px; border-radius: 999px; padding: 4px; gap: 2px; }
  .capsule button, .capsule a { height: 32px; min-width: 34px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .capsule button:hover, .capsule a:hover { background: rgba(127, 100, 80, .12); }
  .capsule svg { width: 17px; height: 17px; }
  .tinted { background: var(--accent) !important; color: #fff !important; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 16px color-mix(in srgb, var(--accent) 45%, transparent); }

  .scroller { position: absolute; z-index: 2; left: 242px; top: 0; bottom: 0; width: min(520px, calc(47% - 242px + 60px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 120px, #000 calc(100% - 90px), transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 120px, #000 calc(100% - 90px), transparent 100%); }
  .scroller::-webkit-scrollbar { display: none; }
  .text { padding: 22vh 30px 44vh 44px; }
  .section { min-height: 62vh; display: flex; flex-direction: column; justify-content: center; opacity: .28; transition: opacity .5s; }
  .section.on { opacity: 1; }
  .eyebrow { font-size: 12px; font-weight: 600; color: var(--accent); }
  h1 { font: 560 62px/1 var(--serif); letter-spacing: -.025em; margin: 10px 0 10px; }
  h2 { font: 560 34px/1.08 var(--serif); letter-spacing: -.015em; margin: 8px 0 12px; }
  .lead { font: italic 400 21px/1.35 var(--serif); color: var(--muted); margin-bottom: 12px; }
  .section p + p { margin-top: 10px; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .piece { border-radius: 16px; overflow: hidden; background: color-mix(in srgb, var(--accent) 7%, var(--win)); box-shadow: inset 0 0 0 1px var(--hair); }
  .piece .ph { aspect-ratio: 4 / 5; display: grid; place-items: center; color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .piece .ph svg { width: 40%; }
  .piece figcaption { padding: 8px 10px 10px; font-size: 12.5px; font-weight: 600; }
  .piece small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .btn { margin-top: 18px; height: 42px; padding: 0 20px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .btn.plain { box-shadow: inset 0 0 0 1px var(--hair); }

  /* A timeline to scrub the clay through its stages. */
  .scrub { position: absolute; z-index: 3; left: calc(47% + 20px); right: 40px; bottom: 18px; max-width: 520px; margin-left: auto; margin-right: auto; height: 52px; border-radius: 999px;
    display: flex; align-items: center; gap: 14px; padding: 0 18px 0 8px; user-select: none; touch-action: none; }
  .scrub .now { display: flex; align-items: center; gap: 8px; min-width: 132px; font-size: 12.5px; font-weight: 600; }
  .scrub .now i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-style: normal; font-size: 12px; font-variant-numeric: tabular-nums;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
  .track { position: relative; flex: 1; height: 28px; cursor: pointer; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 3px; background: color-mix(in srgb, var(--text) 14%, transparent); }
  .track .fill { position: absolute; left: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 3px; background: var(--accent); }
  .track .tick { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--win); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--text) 30%, transparent); }
  .track .tick.done { background: var(--accent); box-shadow: none; }
  .track .thumb { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .25), inset 0 0 0 .5px rgba(0, 0, 0, .1); }

  /* Minimised: a little glass jar to bring the window back. */
  .reopen { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); z-index: 5; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 8px; border-radius: 999px;
    font-weight: 600; transition: transform .5s cubic-bezier(.3, .7, .2, 1); }
  .reopen i { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(160deg, #e6a77a, #a9532f); }
  .reopen i svg { width: 18px; height: 18px; }
  .reopen.show { transform: translate(-50%, 0); }

  /* ---------- Phones: the same app, iOS style ---------- */
  .tabbar, .mtitle { display: none; }
  @media (max-width: 760px) {
    .window { inset: 0; left: 0; top: 0; width: 100% !important; height: 100% !important; border-radius: 0 !important; transform: none !important; opacity: 1 !important; box-shadow: none; }
    .sidebar, .toolbar, .scrub, .reopen { display: none; }
    .scene { background: radial-gradient(70% 40% at 50% 26%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
    #clay { left: 0; right: 0; top: 0; height: 50svh; width: 100%; }
    .kiln { left: 10%; right: 10%; top: 6%; bottom: auto; height: 40svh; }
    .scroller { left: 0; width: 100%; }
    .text { padding: 46svh 12px 120px; }
    .section { min-height: 62svh; justify-content: flex-end; opacity: 1; }
    .section:first-child { min-height: 0; padding-top: 0; }
    .scroller { -webkit-mask-image: none; mask-image: none; }
    .section .card { padding: 18px 18px 20px; border-radius: 26px; background: color-mix(in srgb, var(--win) 86%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
      box-shadow: inset 0 1px 0 var(--glass-edge), 0 10px 30px rgba(60, 40, 20, .1); }
    h1 { font-size: 46px; } h2 { font-size: 28px; } .lead { font-size: 19px; }
    .mtitle { display: flex; position: fixed; top: 0; left: 0; right: 0; z-index: 4; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 14px 12px; font-weight: 600;
      background: color-mix(in srgb, var(--win) 72%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 .5px 0 var(--hair);
      opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; pointer-events: none; }
    .mtitle.on { opacity: 1; transform: none; }
    .tabbar { display: flex; position: fixed; z-index: 4; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); gap: 10px; align-items: center; }
    .tabs { flex: 1; display: flex; border-radius: 999px; padding: 4px; }
    .tabs a { flex: 1; display: grid; justify-items: center; gap: 1px; padding: 6px 0 5px; border-radius: 999px; font-size: 10.5px; font-weight: 600; color: var(--muted); transition: background .25s, color .25s; }
    .tabs a svg { width: 22px; height: 22px; }
    .tabs a.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .fab { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
    .fab svg { width: 22px; height: 22px; }
  }
  @media (min-width: 761px) { .card { display: contents; } }
  @media (prefers-reduced-motion: reduce) { .window, .reopen, .section { transition: none; } }
</style>
</head>
<body>
<div class="window" id="win">
  <div class="scene" aria-hidden="true"><div class="kiln" id="kiln"></div><canvas id="clay"></canvas></div>

  <aside class="sidebar glass" aria-label="Chapters">
    <div class="lights" role="group" aria-label="Window">
      <button class="r" type="button" data-act="close" aria-label="Close"><svg viewBox="0 0 8 8"><path d="M1.5 1.5l5 5M6.5 1.5l-5 5" stroke="#4d0000" stroke-width="1.2"/></svg></button>
      <button class="y" type="button" data-act="min" aria-label="Minimise"><svg viewBox="0 0 8 8"><path d="M1.2 4h5.6" stroke="#5a3d00" stroke-width="1.3"/></svg></button>
      <button class="g" type="button" data-act="zoom" aria-label="Zoom"><svg viewBox="0 0 8 8"><path d="M2 6V2.6L5.4 6zM6 2v3.4L2.6 2z" fill="#0b4d00"/></svg></button>
    </div>
    <div id="side"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <div class="toolbar">
    <div class="drag" id="drag"><b>Ivo Lopes</b><span id="subtitle"></span></div>
    <div class="capsule glass">
      <button type="button" class="theme" aria-label="Light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" id="lang">PT</button>
    </div>
    <div class="capsule glass"><a class="tinted" id="order-top" href="https://art.ivolopes.com/order/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span id="order-top-label">Order</span></a></div>
  </div>

  <div class="scroller" id="scroller"><div class="text" id="text"></div></div>

  <div class="scrub glass" id="scrub" role="slider" aria-label="Stage of the clay" aria-valuemin="0" aria-valuemax="7" tabindex="0">
    <div class="now"><i id="now-n">01</i><span id="now-l"></span></div>
    <div class="track" id="track"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
  </div>
</div>

<button class="reopen glass" id="reopen" type="button"><i><svg viewBox="0 0 200 260" fill="#fff"><path d="M78 20h44c-2 10-10 14-10 24 0 14 44 40 44 96 0 58-30 94-56 100H100c-26-6-56-42-56-100 0-56 44-82 44-96 0-10-8-14-10-24z"/></svg></i><span id="reopen-l">Ceramics</span></button>

<div class="mtitle" id="mtitle" aria-hidden="true">Ivo Lopes</div>
<nav class="tabbar" aria-label="Sections">
  <div class="tabs glass" id="tabs"></div>
  <button class="fab glass theme" type="button" aria-label="Light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</nav>

<script src="https://art.ivolopes.com/content.js"></script>
<script type="module">
import { createClay } from "https://art.ivolopes.com/clay.js";
const q = new URLSearchParams(location.search);
const c = window.CONTENT[q.get("lang") === "pt" ? "pt" : "en"];
const pt = c.lang === "pt";
document.documentElement.lang = c.lang;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const phone = () => innerWidth <= 760;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const JAR = '<svg viewBox="0 0 200 260" fill="none" stroke="currentColor" stroke-width="6"><path d="M78 20h44c-2 10-10 14-10 24 0 14 44 40 44 96 0 58-30 94-56 100h0c-26-6-56-42-56-100 0-56 44-82 44-96 0-10-8-14-10-24z"/></svg>';
const ICONS = [
  '<circle cx="12" cy="13" r="7"/>',
  '<circle cx="12" cy="13" r="7"/><path d="M8 11c1.5-1 6.5-1 8 0"/>',
  '<path d="M5 12c0 4 3 7 7 7s7-3 7-7"/><ellipse cx="12" cy="12" rx="7" ry="2.2"/>',
  '<path d="M4 11h16c0 5-3.5 8-8 8s-8-3-8-8z"/>',
  '<path d="M6 8h12M5 12h14M6 16h12"/><path d="M6 8c-2 0-2 4 0 4M18 12c2 0 2 4 0 4"/>',
  '<path d="M9 3h6c0 2-2 3-2 4 0 2 5 4 5 9 0 4-3 6-6 6s-6-2-6-6c0-5 5-7 5-9 0-1-2-2-2-4z"/>',
  '<path d="M12 21c-4 0-6-3-6-6 0-4 4-6 4-10 3 2 4 4 4 6 1-1 2-2 2-3 2 2 2 4 2 7 0 3-2 6-6 6z"/>',
  '<path d="M12 3c3 5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6 6-11z"/>',
  '<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
];
const ico = (i) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[i]}</svg>`;
const label = (s) => s.eyebrow.replace(/^\/\/\s*/, "").replace(/^\d+\s*·\s*/, "");
const cap = (t) => t.replace(/^./, (m) => m.toUpperCase());

/* ---------- Content ---------- */
$("#subtitle").textContent = pt ? "Cerâmica feita à mão · Porto" : "Hand-built ceramics · Porto";
$("#order-top-label").textContent = pt ? "Encomendar" : "Order";
$("#reopen-l").textContent = pt ? "Cerâmica" : "Ceramics";
$("#order-top").href = `https://art.ivolopes.com/order/?lang=${c.lang}`;
$("#text").innerHTML = c.sections.map((s, i) => `
  <section class="section" id="${s.id}" data-i="${i}"><div class="card">
    <p class="eyebrow">${esc(s.eyebrow.replace(/^\/\/\s*/, ""))}</p>
    ${i === 0 ? `<h1>${esc(s.title)}</h1>` : `<h2>${esc(s.title)}</h2>`}
    ${s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ""}
    ${s.body.map((p) => `<p>${esc(p)}</p>`).join("")}
    ${s.gallery ? `<div class="gallery">${c.work.map((w) => `<figure class="piece"><div class="ph">${JAR}</div><figcaption>${esc(w.title)}<small>${esc(w.note)}</small></figcaption></figure>`).join("")}</div>` : ""}
    ${s.contact ? `<a class="btn plain" href="mailto:${c.email}">${esc(c.email)}</a>` : ""}
    ${s.order ? `<a class="btn tinted" href="https://art.ivolopes.com/order/?lang=${c.lang}">${esc(c.orderCta)}</a>` : ""}
  </div></section>`).join("");
const nav = (s, i, studio) => `<a class="nav" href="#${s.id}" data-i="${i}">${ico(studio && i === 5 ? 5 : i)}<span>${esc(studio ? s.title : i === 0 ? (pt ? "Início" : "Start") : cap(label(s)))}</span>${!studio && i > 0 && i < 8 ? `<small>0${i}</small>` : ""}</a>`;
$("#side").innerHTML = `<div class="side-h">${pt ? "Processo" : "Process"}</div>${c.sections.slice(0, 8).map((s, i) => nav(s, i, false)).join("")}
  <div class="side-h">${pt ? "Estúdio" : "Studio"}</div>${nav(c.sections[5], 5, true).replace('class="nav"', 'class="nav studio"')}${nav(c.sections[8], 8, true).replace('class="nav"', 'class="nav studio"')}`;
$("#side-foot").innerHTML = `${esc(c.footer)}<br><a href="mailto:${c.email}">${c.email}</a>`;
$("#tabs").innerHTML = [["top", pt ? "Processo" : "Process", 5], ["work", pt ? "Obras" : "Work", -1], ["order", pt ? "Encomendar" : "Order", 8]]
  .map(([id, t, ic]) => `<a href="#${id}" data-tab="${id}">${ic < 0 ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>' : ico(ic)}<span>${esc(t)}</span></a>`).join("");

/* ---------- Theme, language ---------- */
const root = document.documentElement;
document.querySelectorAll(".theme").forEach((b) => b.addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
}));
$("#lang").textContent = pt ? "EN" : "PT";
$("#lang").addEventListener("click", () => { location.search = `?lang=${pt ? "en" : "pt"}`; });

/* ---------- Clay, driven by scroll (or the timeline) ---------- */
let clay = null;
try { clay = createClay($("#clay"), { reducedMotion: still }); } catch (e) { console.warn(e); }
const scroller = $("#scroller");
const sections = [...document.querySelectorAll(".section")];
const navs = [...document.querySelectorAll(".nav")];
const tabs = [...document.querySelectorAll("[data-tab]")];
const centres = () => sections.map((s) => s.offsetTop + s.offsetHeight / 2);
const mid = () => scroller.scrollTop + (phone() ? innerHeight * 0.62 : scroller.clientHeight * 0.5);
function stageNow() {
  const cs = centres(), m = mid();
  if (m <= cs[0]) return 0;
  for (let i = 0; i < cs.length - 1; i++) if (m <= cs[i + 1]) return i + (m - cs[i]) / (cs[i + 1] - cs[i]);
  return cs.length - 1;
}
function scrollToStage(s, smooth) {
  const cs = centres(), i = Math.min(cs.length - 2, Math.floor(s)), f = s - i;
  const target = cs[i] + f * (cs[i + 1] - cs[i]) - (phone() ? innerHeight * 0.62 : scroller.clientHeight * 0.5);
  scroller.scrollTo({ top: target, behavior: smooth && !still ? "smooth" : "auto" });
}
const STAGES = 7;
function onScroll() {
  const s = stageNow(), i = Math.round(s), cl = Math.min(STAGES, s);
  clay?.setStage(cl);
  sections.forEach((sec, k) => sec.classList.toggle("on", k === i));
  navs.forEach((n) => n.classList.toggle("on", +n.dataset.i === i && (n.classList.contains("studio") ? i === 5 || i === 8 : i < 8)));
  tabs.forEach((t) => t.classList.toggle("on", t.dataset.tab === (i >= 8 ? "order" : i === 5 ? "work" : "top")));
  // Timeline
  const u = cl / STAGES;
  $("#fill").style.width = `${u * 100}%`;
  $("#thumb").style.left = `${u * 100}%`;
  const k = Math.min(STAGES, Math.round(cl));
  $("#now-n").textContent = String(k).padStart(2, "0");
  $("#now-l").textContent = k === 0 ? (pt ? "Bola" : "Ball") : cap(label(c.sections[k]));
  document.querySelectorAll(".tick").forEach((t, j) => t.classList.toggle("done", j <= cl + 0.01));
  $("#scrub").setAttribute("aria-valuenow", cl.toFixed(1));
  $("#mtitle").classList.toggle("on", scroller.scrollTop > 140);
}
const track = $("#track");
for (let j = 0; j <= STAGES; j++) { const t = document.createElement("i"); t.className = "tick"; t.style.left = `${(j / STAGES) * 100}%`; track.insertBefore(t, $("#thumb")); }
let scrubbing = false;
const scrubAt = (e, smooth) => { const r = track.getBoundingClientRect(); scrollToStage(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * STAGES, smooth); };
track.addEventListener("pointerdown", (e) => { scrubbing = true; track.setPointerCapture(e.pointerId); scrubAt(e, true); });
track.addEventListener("pointermove", (e) => { if (scrubbing) scrubAt(e, false); });
track.addEventListener("pointerup", () => { scrubbing = false; });
$("#scrub").addEventListener("keydown", (e) => {
  const s = Math.round(stageNow());
  if (e.key === "ArrowRight") scrollToStage(Math.min(STAGES, s + 1), true);
  if (e.key === "ArrowLeft") scrollToStage(Math.max(0, s - 1), true);
});
scroller.addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);
onScroll();
(function glow() { $("#kiln").style.opacity = $("#clay").dataset.glow || 0; requestAnimationFrame(glow); })();
document.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener("click", (e) => {
  const i = sections.findIndex((s) => s.id === a.getAttribute("href").slice(1));
  if (i >= 0) { e.preventDefault(); scrollToStage(i, true); }
}));

/* ---------- The window behaves like one ---------- */
const win = $("#win"), reopen = $("#reopen");
function hide() { win.classList.add("away"); reopen.classList.add("show"); }
function show() { win.classList.remove("away"); reopen.classList.remove("show"); }
document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.act === "zoom") win.classList.toggle("zoomed"); else hide();
}));
reopen.addEventListener("click", show);
const drag = $("#drag");
let d = null;
drag.addEventListener("pointerdown", (e) => {
  if (win.classList.contains("zoomed")) return;
  d = { x: e.clientX, y: e.clientY, dx: parseFloat(win.style.getPropertyValue("--dx")) || 0, dy: parseFloat(win.style.getPropertyValue("--dy")) || 0 };
  drag.setPointerCapture(e.pointerId); win.classList.add("dragging"); drag.style.cursor = "grabbing";
});
drag.addEventListener("pointermove", (e) => {
  if (!d) return;
  win.style.setProperty("--dx", `${d.dx + e.clientX - d.x}px`);
  win.style.setProperty("--dy", `${Math.max(-innerHeight * 0.4, Math.min(innerHeight * 0.4, d.dy + e.clientY - d.y))}px`);
});
drag.addEventListener("pointerup", () => { d = null; win.classList.remove("dragging"); drag.style.cursor = ""; });
drag.addEventListener("dblclick", () => win.classList.toggle("zoomed"));

if (q.has("at")) setTimeout(() => { scrollToStage(+q.get("at"), false); onScroll(); }, 300);
</script>
</body>
</html>
