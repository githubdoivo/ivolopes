<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MOSS · signal acquired</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #9cf59a; overflow: hidden; }
  body { font: 12px "IBM Plex Mono", monospace; -webkit-font-smoothing: antialiased; touch-action: none; }
  /* specimen.js grows the bloom here; the visor samples it every frame. */
  #specimen { position: fixed; inset: 0; width: 100%; height: 100%; visibility: hidden; }
  #visor { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Real, accessible text and links, laid exactly over what the visor draws. */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hit { position: fixed; left: 0; top: 0; display: block; color: transparent; border-radius: 4px; }
  .hit:focus-visible { outline: 1px solid #9cf59a; outline-offset: 4px; }
</style>
</head>
<body>
<canvas id="specimen" aria-hidden="true"></canvas>
<canvas id="visor" aria-hidden="true"></canvas>
<main class="sr">
  <h1>MOSS</h1>
  <p>DJ and producer. Specimen MOSS-01 is germinating: something is growing out there. First transmission soon.</p>
</main>
<a class="hit" id="mail" href="mailto:mail@ivolopes.com">mail@ivolopes.com</a>

<script src="https://moss.ivolopes.com/specimen.js"></script>
<script>
(function () {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const q = new URLSearchParams(location.search);
  const frozen = q.has("t") ? +q.get("t") : null;
  const spec = document.getElementById("specimen");
  const out = document.getElementById("visor");
  const mail = document.getElementById("mail");

  /* ---------- The HUD layer: drawn flat, bent by the lens afterwards ---------- */
  const hud = document.createElement("canvas");
  const g = hud.getContext("2d");
  const sp = document.createElement("canvas"), s2 = sp.getContext("2d");
  let W, H, dpr, phone, cx, cy, R;
  const GREEN = (a) => `rgba(156, 245, 154, ${a})`, DIM = (a) => `rgba(95, 174, 99, ${a})`, VIOLET = (a) => `rgba(190, 150, 255, ${a})`;
  const TELEMETRY = ["spore.dispersal ok", "substrate.ph 5.8", "root.freq 42.0hz", "canopy.humidity 98%", "bassline.root A1", "frond.unfurl nominal",
    "mycelium.link stable", "kick.pattern 4/4", "lux.ambient 0.3", "bloom.state open", "signal.carrier locked", "chlorophyll rising", "tempo.sync 124", "transmission soon"];
  const pointer = { x: 0, y: 0, sx: 0, sy: 0, on: false, lock: 0 };

  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; phone = W < 860;
    hud.width = Math.round(W * dpr); hud.height = Math.round(H * dpr);
    // Same maths as specimen.js, so callouts land on the bloom.
    cx = W / 2; cy = phone ? H * 0.53 : H * 0.47;
    R = Math.min(W * (phone ? 0.4 : 0.26), H * (phone ? 0.21 : 0.29));
    SS = phone ? 0.62 : 0.66;  // the specimen is drawn smaller than on the live page
    R *= SS;
  }
  let SS = 1;

  function text(s, x, y, { font = "12px 'IBM Plex Mono'", color = GREEN(0.85), align = "left", glow = 0, spacing = 0 } = {}) {
    g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic";
    if ("letterSpacing" in g) g.letterSpacing = `${spacing}px`;
    g.shadowColor = color; g.shadowBlur = glow;
    g.fillText(s, x, y);
    g.shadowBlur = 0;
    if ("letterSpacing" in g) g.letterSpacing = "0px";
  }
  const line = (pts, color, w = 1) => { g.strokeStyle = color; g.lineWidth = w; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); };
  const pad = (n) => String(n).padStart(2, "0");

  function drawHUD(t) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const beat = Math.pow(1 - (((t * 124) / 60) % 1), 3);
    const m = phone ? 22 : 40;

    // The specimen, a little deeper than the HUD (parallax).
    // Drawn through a soft round mask, so the scan band never shows a hard edge.
    if (sp.width !== hud.width || sp.height !== hud.height) { sp.width = hud.width; sp.height = hud.height; }
    s2.setTransform(dpr, 0, 0, dpr, 0, 0);
    s2.globalCompositeOperation = "source-over";
    s2.clearRect(0, 0, W, H);
    s2.save(); s2.translate(cx + pointer.sx * -14, cy + pointer.sy * -10); s2.scale(SS, SS); s2.drawImage(spec, -cx, -cy, W, H); s2.restore();
    const mk = s2.createRadialGradient(cx, cy, R * 1.05, cx, cy, R * 1.5);
    mk.addColorStop(0, "#000"); mk.addColorStop(1, "rgba(0,0,0,0)");
    s2.globalCompositeOperation = "destination-in"; s2.fillStyle = mk; s2.fillRect(0, 0, W, H);
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 0.92; g.drawImage(sp, 0, 0); g.restore();

    g.save();
    g.translate(pointer.sx * -5, pointer.sy * -4);

    // Visor corners.
    const L = phone ? 16 : 26;
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) line([[x, y + L * sy], [x, y], [x + L * sx, y]], GREEN(0.5));

    // Wordmark and identity.
    const wm = phone ? 64 : 104;
    const wx = phone ? W / 2 : m + 18, wy = phone ? m + 66 : m + 96, align = phone ? "center" : "left";
    text("MOSS", wx, wy, { font: `${wm}px VT323`, color: GREEN(0.95), glow: 14 + beat * 10, spacing: wm * 0.12, align });
    text("DJ · PRODUCER", wx + (phone ? 0 : 4), wy + (phone ? 22 : 28), { font: `${phone ? 13 : 16}px VT323`, color: DIM(0.9), spacing: 6, align });
    if (!phone) {
      text("SPECIMEN MOSS-01", m + 22, wy + 70, { color: GREEN(0.7), spacing: 2 });
      text(Math.floor(t * 1.4) % 2 ? "● GERMINATING" : "○ GERMINATING", m + 22, wy + 88, { color: GREEN(0.9), spacing: 2 });
      text("BRYOPHYTA / AUDIO", m + 22, wy + 106, { color: DIM(0.75), spacing: 2 });
    }

    // Top right: time, place, signal.
    const tr = W - m - 18;
    text(`T+${pad(Math.floor(t / 60) % 60)}:${pad(Math.floor(t) % 60)}`, phone ? W - m - 4 : tr, phone ? m + 14 : m + 26, { font: `${phone ? 14 : 18}px VT323`, color: GREEN(0.9), align: "right", spacing: 2 });
    if (!phone) {
      text("41.15N 8.61W", tr, m + 46, { color: DIM(0.8), align: "right", spacing: 2 });
      text(`SIGNAL ${Math.round(-48 + Math.sin(t * 1.3) * 4)} DB`, tr, m + 64, { color: DIM(0.8), align: "right", spacing: 2 });
    } else {
      text("MOSS-01", m + 4, m + 14, { font: "14px VT323", color: DIM(0.9), spacing: 2 });
    }

    // A slow ring of ticks around the bloom.
    const rr = R * (phone ? 1.25 : 1.38);
    g.save(); g.translate(cx, cy);
    g.rotate(t * 0.03);
    for (let i = 0; i < 180; i++) {
      const a = (i / 180) * Math.PI * 2, long = i % 15 === 0;
      const r0 = rr - (long ? 9 : 4);
      g.strokeStyle = GREEN(long ? 0.55 : 0.2); g.lineWidth = 1;
      g.beginPath(); g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); g.stroke();
    }
    g.restore();
    g.strokeStyle = VIOLET(0.35); g.setLineDash([2, 6]); g.beginPath(); g.arc(cx, cy, rr + 14, -Math.PI * 0.85, -Math.PI * 0.15); g.stroke(); g.setLineDash([]);

    // Callouts pinned to the specimen.
    const cov = spec.dataset.coverage || "0.0";
    const calls = phone
      ? [[-1.2, "BLOOM", "OPEN"], [1.95, "MOSS", `${cov}%`]]
      : [[-0.62, "BLOOM 01", "CERAMIC · OPEN"], [3.5, "FRONDS", "UNFURLING"], [2.25, "MOSS", `COVERAGE ${cov}%`], [0.55, "ROOT FREQ", "42.0 HZ"]];
    for (const [a, k, v] of calls) {
      const ax = cx + Math.cos(a) * R * 0.72, ay = cy + Math.sin(a) * R * 0.66;
      const ex = cx + Math.cos(a) * rr * 1.08, ey = cy + Math.sin(a) * rr * 1.08;
      const dir = Math.cos(a) >= 0 ? 1 : -1;
      g.font = `${phone ? 13 : 16}px VT323`;
      const tw = Math.max(g.measureText(k).width, v.length * (phone ? 6 : 7)) + 8;
      // Keep the label on screen: shorten the leader if it would run off.
      const room = dir > 0 ? W - m - 10 - ex - tw : ex - tw - m - 10;
      const len = Math.max(12, Math.min(phone ? 30 : 70, room));
      g.fillStyle = GREEN(0.9); g.beginPath(); g.arc(ax, ay, 2, 0, Math.PI * 2); g.fill();
      line([[ax, ay], [ex, ey], [ex + dir * len, ey]], GREEN(0.45));
      const tx = ex + dir * (len + 6), al = dir > 0 ? "left" : "right";
      text(k, tx, ey - 3, { font: `${phone ? 13 : 16}px VT323`, color: GREEN(0.95), align: al, spacing: 2 });
      text(v, tx, ey + 12, { font: `${phone ? 9 : 10}px 'IBM Plex Mono'`, color: DIM(0.8), align: al, spacing: 1.5 });
    }

    // Reticle: follows the pointer, locks onto the bloom.
    if (pointer.on && !phone) {
      const near = Math.hypot(pointer.x - cx, pointer.y - cy) < R * 1.1;
      pointer.lock += ((near ? 1 : 0) - pointer.lock) * 0.12;
      const px = pointer.x + (cx - pointer.x) * pointer.lock, py = pointer.y + (cy - pointer.y) * pointer.lock;
      const s = 18 + pointer.lock * (R * 0.95 - 18);
      for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) line([[px + sx * s, py + sy * (s - 8)], [px + sx * s, py + sy * s], [px + sx * (s - 8), py + sy * s]], GREEN(0.8));
      if (pointer.lock > 0.6) text("TARGET LOCKED · MOSS-01", px + s + 10, py - s + 10, { color: GREEN(0.9 * pointer.lock), spacing: 2 });
    }

    // Right edge: telemetry, scrolling up.
    if (!phone) {
      const x = W - m - 18, y0 = H * 0.36, rows = 9, step = 17, off = (t * 0.6) % 1;
      for (let i = 0; i < rows; i++) {
        const idx = Math.floor(t * 0.6) + i, y = y0 + (i - off) * step;
        const fade = Math.min(1, i - off + 0.4, rows - 1 - i + off) / 2;
        text(TELEMETRY[idx % TELEMETRY.length], x, y, { color: GREEN(Math.max(0, fade) * 0.9), align: "right", spacing: 1 });
      }
      // Left edge: a depth scale.
      const lx = m + 22, top = H * 0.42, bot = H * 0.72;
      for (let i = 0; i <= 30; i++) { const y = top + (i / 30) * (bot - top); line([[lx, y], [lx + (i % 5 ? 4 : 10), y]], GREEN(i % 5 ? 0.25 : 0.5)); }
      const my = top + (0.5 + Math.sin(t * 0.3) * 0.35) * (bot - top);
      g.fillStyle = VIOLET(0.9); g.beginPath(); g.moveTo(lx + 14, my); g.lineTo(lx + 22, my - 4); g.lineTo(lx + 22, my + 4); g.fill();
      text(`${(0.42 + Math.sin(t * 0.3) * 0.12).toFixed(2)} AU`, lx + 28, my + 4, { color: VIOLET(0.85), spacing: 1 });
    }

    // Bottom: the transmission waveform, pulsing at 124 BPM.
    const by = H - m - (phone ? 70 : 54), x0 = m + 18, x1 = W - m - 18;
    g.beginPath();
    for (let x = x0; x <= x1; x += 2) {
      const u = (x - x0) / (x1 - x0), env = Math.sin(u * Math.PI);
      const y = by + env * (Math.sin(u * 60 + t * 6) * 6 + Math.sin(u * 23 - t * 3) * 4 + Math.sin(u * 140 + t * 11) * 2) * (0.35 + beat * 0.9);
      x === x0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.strokeStyle = GREEN(0.75); g.lineWidth = 1.2; g.shadowColor = GREEN(0.8); g.shadowBlur = 8; g.stroke(); g.shadowBlur = 0;
    line([[x0, by], [x1, by]], GREEN(0.12));
    const sy = by + (phone ? 32 : 30);
    text("TRANSMISSION", phone ? W / 2 : x0, sy, { font: `${phone ? 15 : 17}px VT323`, color: DIM(0.9), align: phone ? "center" : "left", spacing: 4 });
    text(`${Math.floor(t * 1.4) % 2 ? "●" : " "} SOON`, phone ? W / 2 : W / 2, phone ? sy + 22 : sy, { font: `${phone ? 22 : 24}px VT323`, color: GREEN(0.95), align: "center", spacing: 8, glow: 10 });
    const mx = phone ? W / 2 : x1, my2 = phone ? sy + 44 : sy;
    text("MAIL@IVOLOPES.COM", mx, my2, { font: `${phone ? 15 : 17}px VT323`, color: GREEN(0.9), align: phone ? "center" : "right", spacing: 3 });
    mailBox = { x: mx, y: my2, w: g.measureText("MAIL@IVOLOPES.COM").width, align: phone ? "center" : "right" };
    g.restore();
  }
  let mailBox = null;

  /* ---------- The lens: one curved sheet of glass over space, specimen and HUD ---------- */
  const gl = out.getContext("webgl", { premultipliedAlpha: false, antialias: false });
  const VS = "attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }";
  const FS = `precision highp float;
    uniform sampler2D uHud; uniform vec2 uRes, uPar; uniform float uTime, uBeat, uK;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++){ s += a * noise(p); p = p * 2.02 + vec2(1.7, 9.2); a *= .5; } return s; }
    float stars(vec2 p, float scale, float t){ vec2 g = p * scale, id = floor(g), f = fract(g) - .5; float h = hash(id);
      vec2 o = vec2(hash(id + 3.1), hash(id + 7.7)) - .5; float d = length(f - o * .7);
      return step(.94, h) * (.55 + .45 * sin(t * 1.7 + h * 60.)) * smoothstep(.08, 0., d) * (h - .9) * 14.; }
    // Where the glass bends a screen point to: barrel distortion, stronger at the rim.
    vec2 bend(vec2 uv, float k){ vec2 c = uv * 2. - 1.; vec2 a = c * vec2(uRes.x / uRes.y, 1.); float r2 = dot(a, a) / dot(vec2(uRes.x / uRes.y, 1.), vec2(uRes.x / uRes.y, 1.));
      return (c * (1. + k * r2)) * .5 + .5; }
    vec3 space(vec2 uv){
      vec2 a = (uv - .5) * vec2(uRes.x / uRes.y, 1.) + uPar * .05;
      float t = uTime;
      vec2 q = a * 1.3 + vec2(t * .006, t * .002);
      float n = fbm(q * 1.4), m = fbm(q * 2.8 + n * 1.7 + 4.);
      vec3 col = vec3(.004, .006, .008);
      col += vec3(.03, .20, .15) * smoothstep(.38, .95, m) * (.6 + .4 * n);
      col += vec3(.20, .06, .30) * smoothstep(.45, .95, n);
      col += vec3(.10, .30, .12) * pow(smoothstep(.55, .95, n * m * 1.9), 2.) * .6;
      col *= smoothstep(1.2, .25, length(a));
      vec2 b = a + uPar * .02;
      col += vec3(.8, .95, .9) * (stars(b, 26., t) + stars(b + uPar * .02, 60., t * 1.3) * .6 + stars(b, 130., t) * .3);
      return col;
    }
    void main(){
      float k = uK;
      vec2 uv = bend(vUv, k);
      // Outside the glass: the black of the visor frame, with a thin lit edge.
      vec2 edge = min(uv, 1. - uv); float inside = min(edge.x, edge.y);
      if (inside < 0.) { float rim = smoothstep(.006, 0., -inside); gl_FragColor = vec4(vec3(.25, .6, .3) * rim * .25, 1.); return; }
      vec3 col = space(uv);
      // HUD and specimen, with colour fringing towards the rim.
      vec2 c = uv - .5; float r = length(c * 2.);
      float ca = .0035 * r * r;
      vec4 h = texture2D(uHud, vec2(uv.x, 1. - uv.y));
      float hr = texture2D(uHud, vec2(.5 + c.x * (1. + ca), 1. - (.5 + c.y * (1. + ca)))).r;
      float hb = texture2D(uHud, vec2(.5 + c.x * (1. - ca), 1. - (.5 + c.y * (1. - ca)))).b;
      vec3 hc = vec3(hr, h.g, hb);
      // A soft glow from the brightest HUD lines.
      vec2 px = 2.5 / uRes;
      vec3 glow = (texture2D(uHud, vec2(uv.x + px.x, 1. - uv.y)).rgb * texture2D(uHud, vec2(uv.x + px.x, 1. - uv.y)).a + texture2D(uHud, vec2(uv.x - px.x, 1. - uv.y)).rgb * texture2D(uHud, vec2(uv.x - px.x, 1. - uv.y)).a
        + texture2D(uHud, vec2(uv.x, 1. - uv.y - px.y)).rgb * texture2D(uHud, vec2(uv.x, 1. - uv.y - px.y)).a + texture2D(uHud, vec2(uv.x, 1. - uv.y + px.y)).rgb * texture2D(uHud, vec2(uv.x, 1. - uv.y + px.y)).a) * .25;
      col = mix(col, hc, h.a) + glow * .07 * (1. + uBeat * .6);
      // Glass: darker and greener at the rim, a faint reflection, fine scanlines, grain.
      col *= smoothstep(1.55, .55, r);
      col += vec3(.01, .03, .02) * smoothstep(.6, 1.4, r);
      col += vec3(.06, .08, .1) * smoothstep(.35, 0., length((vUv - vec2(.28, .82)) * vec2(1.6, 3.))) * .5;
      col *= .94 + .06 * sin(gl_FragCoord.y * 1.6);
      col += (hash(gl_FragCoord.xy + fract(uTime) * 100.) - .5) * .035;
      gl_FragColor = vec4(col, 1.);
    }`;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([a, b]) => gl.texParameteri(gl.TEXTURE_2D, a, b));
  const U = Object.fromEntries(["uRes", "uPar", "uTime", "uBeat", "uK"].map((n) => [n, gl.getUniformLocation(prog, n)]));
  const K = () => (phone ? 0.1 : 0.16);

  function size() {
    layout();
    const pr = Math.min(devicePixelRatio || 1, 2);
    out.width = Math.round(W * pr); out.height = Math.round(H * pr);
    gl.viewport(0, 0, out.width, out.height);
    gl.uniform2f(U.uRes, out.width, out.height);
    gl.uniform1f(U.uK, K());
  }

  // Screen position of a flat HUD point after the lens (inverse of bend()).
  function project(x, y) {
    const asp = W / H, norm = asp * asp + 1;
    const tx = (x / W) * 2 - 1, ty = (y / H) * 2 - 1;
    let px = tx, py = ty;
    for (let i = 0; i < 8; i++) { const r2 = ((px * asp) ** 2 + py * py) / norm, s = 1 + K() * r2; px = tx / s; py = ty / s; }
    return [(px + 1) / 2 * W, (py + 1) / 2 * H];
  }
  function placeMail() {
    if (!mailBox) return;
    const { x, y, w, align } = mailBox;
    const x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
    const [ax, ay] = project(x0, y - 16), [bx, by] = project(x0 + w, y + 6);
    Object.assign(mail.style, { transform: `translate(${ax}px, ${ay}px)`, width: `${bx - ax}px`, height: `${by - ay}px` });
  }

  addEventListener("pointermove", (e) => {
    pointer.on = e.pointerType === "mouse";
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.tx = (e.clientX / W) * 2 - 1; pointer.ty = (e.clientY / H) * 2 - 1;
  });
  addEventListener("pointerleave", () => { pointer.on = false; pointer.tx = pointer.ty = 0; });
  if (window.DeviceOrientationEvent && phone) addEventListener("deviceorientation", (e) => { if (e.gamma != null) { pointer.tx = Math.max(-1, Math.min(1, e.gamma / 30)); pointer.ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); } });

  addEventListener("resize", size);
  size();
  const t0 = performance.now();
  let placed = 0;
  function frame(now) {
    const t = frozen ?? (still ? 30 : (now - t0) / 1000);
    pointer.sx += ((pointer.tx || 0) - pointer.sx) * 0.06;
    pointer.sy += ((pointer.ty || 0) - pointer.sy) * 0.06;
    drawHUD(t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, hud);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uBeat, Math.pow(1 - (((t * 124) / 60) % 1), 3));
    gl.uniform2f(U.uPar, pointer.sx, pointer.sy);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (placed++ % 30 === 0) placeMail();
    requestAnimationFrame(frame);
  }
  (document.fonts ? document.fonts.load("40px VT323").then(() => document.fonts.load("11px 'IBM Plex Mono'")) : Promise.resolve()).finally(() => requestAnimationFrame(frame));
})();
</script>
